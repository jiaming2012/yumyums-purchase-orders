  Object.assign(FAIL_NOTES[fldId], patch);
  autoSaveFailNote(fldId);
}
function setSeverity(fldId, severity) {
  if (!FAIL_NOTES[fldId]) FAIL_NOTES[fldId] = { note: '', severity: '' };
  FAIL_NOTES[fldId].severity = severity;
}
// isCurrentPeriodEntry — may this queue entry lend its idempotency_key to a
// submit happening NOW?
//
// Key reuse (ledger T-23 decision 60) was authorised for a second press of the
// SAME checklist on the SAME day. Nothing enforced the second half: entries
// carried no period and nothing retired them, so a persistently-failing server
// let MONDAY's queued key be adopted by THURSDAY's submit — the server upserts
// on idempotency_key, so Thursday's answers landed on Monday's submission row
// and every day in between collapsed into one. Ledger T-25 decision 71.
//
// 🛑 Aging out here means RETIREMENT FROM KEY REUSE. It is NOT deletion, and
// that is deliberate, not an omission. Offline, a queued payload is the only
// durable copy of what the crew member entered that day (the same reason `id`
// is not reused — see submitChecklistToAPI below), and a submission queued
// Monday that finally drains on Thursday is CORRECT, not garbage. A stale entry
// keeps draining normally; it just stops being a source of keys.
//
// An entry with NO period was queued by code older than this function. It is
// treated as NOT current — conservative in the direction that matters, since
// adopting a stale key is the defect being fixed. The cost is one transient
// deploy-boundary case (an entry queued minutes before the new code loaded
// cannot lend its key, so a second press mints a fresh one and can write a
// second row); the service worker's controllerchange reload closes that window
// within a page load.
// appDay — the calendar date (YYYY-MM-DD) of an instant IN THE APP TIMEZONE.
//
// Delegates to sync.js's appDateString, which is the definition. The inline
// fallback exists only because this file must not hard-depend on sync.js having
// loaded (the same reason isCurrentPeriodEntry guards currentSubmitPeriod) —
// keep the two in step if either changes.
//
// 🛑 The old expression here was `new Date().toISOString().slice(0, 10)` — UTC.
// See appDateString in sync.js for why that broke a dinner service in half.
function appDay(when) {
  if (typeof appDateString === 'function') return appDateString(when);
  var d = (when === undefined || when === null) ? new Date() : new Date(when);
  if (isNaN(d.getTime())) return '';
  try {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: (typeof APP_TIMEZONE === 'string' ? APP_TIMEZONE : 'America/New_York'),
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(d);
    var get = function(t) { var p = parts.find(function(x) { return x.type === t; }); return p && p.value; };
    var y = get('year'), m = get('month'), day = get('day');
    if (y && m && day) return y + '-' + m + '-' + day;
  } catch (e) { /* fall through */ }
  return d.toISOString().slice(0, 10);
}

function isCurrentPeriodEntry(e) {
  var period = typeof currentSubmitPeriod === 'function'
    ? currentSubmitPeriod()
    : appDay();
  return !!e && e.period === period;
}

// findQueuedSubmission returns the payload already sitting in the offline
// submitQueue for this template IN THE CURRENT PERIOD, or null.
//
// Why it reads IndexedDB and not a module-level map: the queue is the only
// DURABLE record that a submission is already in flight. "Submit offline, get
// interrupted, reopen the PWA, submit again" is an ordinary way for a crew
// member to press Submit twice, and a reload wipes any in-memory key.
//
// Never lets a lookup failure break a submit — if IndexedDB is unavailable or
// throws, it returns null and the caller mints a fresh key, i.e. degrades to
// the previous behaviour rather than failing the submission.
async function findQueuedSubmission(tplId) {
  try {
    if (typeof getDB !== 'function' || typeof idbGetAll !== 'function') return null;
    var db = await getDB();
    var entries = await idbGetAll(db, 'submitQueue');
    if (!Array.isArray(entries)) return null;
    return entries.find(function(e) {
      return e && e.template_id === tplId && e.idempotency_key && isCurrentPeriodEntry(e);
    }) || null;
  } catch (e) {
    return null;
  }
}
async function submitChecklistToAPI(tplId, allFlds, isReapproval) {
  var responses = allFlds.map(function(f) {
    var resp = FIELD_RESPONSES[f.id];
    var failNote = FAIL_NOTES[f.id];
    var rawVal = null;
    if (resp) {
      var base = resp.sub_steps ? { value: resp.value, sub_steps: resp.sub_steps } : resp.value;
      // Bundle the correction photo into the submitted value so the resubmit
      // gate (frontend + backend) sees it and the manager can review it. The
      // hydrate paths unwrap `_correction_photo`/`_v` symmetrically.
      rawVal = CORRECTION_PHOTOS[f.id] ? { _v: base, _correction_photo: CORRECTION_PHOTOS[f.id] } : base;
    }
    return {
      field_id: f.id,
      value: resp ? JSON.stringify(rawVal) : null,
      fail_note: failNote ? failNote.note : null,
      fail_severity: failNote ? failNote.severity : null
    };
  }).filter(function(r) { return r.value !== null; });
  // Reuse the KEY of any submission already queued for this template IN THE
  // CURRENT PERIOD rather than minting a new one (ledger T-23 decision 60,
  // which authorises the key only; the period bound is T-25 decision 71 — see
  // findQueuedSubmission / isCurrentPeriodEntry above for why a Monday key must
  // never be adopted by a Thursday submit).
  //
  // An offline submit queues the payload and then correctly returns to the list
  // WITHOUT pushing into MY_SUBMISSIONS — so the checklist stays editable, which
  // is deliberate. Minting a fresh UUID on the second press therefore walked
  // straight past the server's `ON CONFLICT (idempotency_key) DO UPDATE ...
  // RETURNING id` upsert (backend/internal/workflow/repository.go:722) and wrote a
  // SECOND checklist_submissions row for one checklist. Reusing the key makes both
  // presses land on the same row. Measured: both POSTs return 201 with the SAME
  // submission id, and each is evicted from the queue on the SUCCESS path
  // (sync.js:583).
  //
  // 🛑 `id` is deliberately NOT reused, and this is load-bearing, not an omission.
  // submitQueue is keyed on `id` (sync.js:52), so reusing it would turn
  // enqueueSubmission's idbPut from an append into a REPLACE. Offline, the queued
  // payload is the ONLY durable copy of what the crew member entered — submitOp
  // (sync.js:695) does not queue and throws when offline, and hydrateFieldState
  // clears FIELD_RESPONSES and rebuilds from DRAFT_RESPONSES on every reopen. So
  // press 2 builds an EMPTY payload, and replacing would silently destroy the
  // answers: one row, zero responses, success toast. Two queue entries sharing one
  // key is the correct shape — the server upserts only the fields present in each
  // payload, so the first entry's answers survive and the empty second adds
  // nothing. The banner transiently counting two queued submissions is a
  // cosmetic price for not deleting someone's work. Guarded by DBL-04.
  //
  // "The server upserts only the fields present in each payload" was TRUE of
  // submission_responses and FALSE of submission_fail_notes when this comment
  // was first written: that INSERT was bare, so a second POST under the same key
  // APPENDED a duplicate note and the approver read it twice
  // (`submission_rows=1 response_rows=1 fail_note_rows=2`, measured 2026-07-27).
  // The sentence was made true rather than edited away — migration 0071 adds
  // UNIQUE (submission_id, field_id) and repository.go's fail-note insert now
  // carries the matching ON CONFLICT ... DO UPDATE. Both tables upsert now.
  // (photo_url is deliberately excluded from that SET list — it is not in the
  // INSERT column list, so writing it would NULL an attached photo.)
  var queued = await findQueuedSubmission(tplId);
  var submitPayload = {
    id: generateUUID(),
    template_id: tplId,
    idempotency_key: queued ? queued.idempotency_key : generateUUID(),
    responses: responses,
    fail_notes: Object.keys(FAIL_NOTES).map(function(fid) {
      return { field_id: fid, note: FAIL_NOTES[fid].note, severity: FAIL_NOTES[fid].severity };
    })
  };
  try {
    return await api('POST', 'submitChecklist', submitPayload);
  } catch (err) {
    if (!navigator.onLine) {
      await enqueueSubmission(submitPayload);
      throw { offline: true };
    }
    throw err;
  }
}

function handlePhotoCaptureClick(fldId) {

function evaluateFailTrigger(fail_trigger, value) {
  if (!fail_trigger) return false;
  if (value === null || value === undefined || value === '') return false;
  if (fail_trigger.type === 'out_of_range') {
    var num = parseFloat(value);
    if (isNaN(num)) return false;
    var hasMin = fail_trigger.min !== undefined && fail_trigger.min !== null;
    var hasMax = fail_trigger.max !== undefined && fail_trigger.max !== null;
    if (hasMin && hasMax) return num < fail_trigger.min || num > fail_trigger.max;
    if (hasMin) return num < fail_trigger.min;
    if (hasMax) return num > fail_trigger.max;
  }
  return false;
}

  // live store. `Object.keys()` of it is the set of fields RxDB is currently
  // answering. The DOM shows the RESULT of hydrate + render; this shows what got
  // past `acceptedFillDocs`, which is what lets a test tell "the runner ignored
  // the foreign row" apart from "the foreign row never arrived" — G6 finding
  // F-A's own distinction, and the reason [FILL-04] asserts both.
  overlayKeys: function() { return Object.assign({}, RXDB_FILL_RESPONSES); }
};

function renderApprovals() {
  var body = document.getElementById('approvals-body');
  if (!body) return;

  if (!container) {

  if (!PENDING || PENDING.length === 0) {
    container.innerHTML = '<div class="empty-state"><h2>' + EMPTY_APPROVALS.h + '</h2><p>' + EMPTY_APPROVALS.p + '</p></div>';
    return;
  }
  var pendingHtml = PENDING.map(function(submission) {
    var submissionId = submission.id;
    var tplName = submission.template_name || submission.tpl_name || 'Checklist';
    var submittedBy = submission.submitted_by_name || submission.submittedBy || 'Crew';
    var submittedAt = submission.submitted_at || submission.submittedAt || new Date().toISOString();
    // Flatten template_snapshot sections into a fields array, merge with responses
    if (!submission.fields && submission.template_snapshot) {
      var snap = typeof submission.template_snapshot === 'string' ? JSON.parse(submission.template_snapshot) : submission.template_snapshot;
      var respMap = {};
      (submission.responses || []).forEach(function(r) { respMap[r.field_id] = r.value; });
      submission.fields = [];
      (snap.sections || []).forEach(function(sec) {
        (sec.fields || []).forEach(function(f) {
          var val = respMap[f.id];
          // Unwrap JSON-encoded value strings
          if (typeof val === 'string') { try { val = JSON.parse(val); } catch(e) {} }
          // Unwrap the `_correction_photo`/`_fail_note` value bundle so the
          // reviewer sees the real answer, and surface the correction photo.
          var correctionPhoto = null;
          if (val && typeof val === 'object' && val._v !== undefined) {
            if (val._correction_photo) correctionPhoto = val._correction_photo;
            val = val._v;
          }
          var field = { id: f.id, label: f.label || f.type, type: f.type, value: val !== undefined ? val : null };
          if (correctionPhoto) field.correctionPhoto = correctionPhoto;
          if (f.sub_steps && f.sub_steps.length > 0) field.sub_steps = f.sub_steps;
          submission.fields.push(field);
        });
      });
    }
    var fields = submission.fields || [];
    var itemsHtml = fields.map(function(fld) {
      var answered = fld.value !== null && fld.value !== undefined;
      var isRejected = fld._pendingReject;
      var rejectForm = isRejected ?
        '<div class="reject-item-form">' +
        '<textarea class="reject-item-input" name="reject-' + fld.id + '" data-reject-fld="' + fld.id + '" placeholder="Comment for crew\u2026" rows="2">' + escapeHtml(fld._rejectComment || '') + '</textarea>' +
        '<label class="require-photo-toggle"><input type="checkbox" name="reject-photo-' + fld.id + '" data-reject-photo-fld="' + fld.id + '" ' + (fld._rejectRequirePhoto ? 'checked' : '') + '> Require photo evidence</label></div>' : '';
      // Show photo thumbnail inline if the field value is a Spaces URL, or if a
      // correction photo was attached to satisfy a require-photo rejection.
      var photoThumb = '';
      var thumbUrl = (answered && typeof fld.value === 'string' && fld.value.startsWith('https://')) ? fld.value : (fld.correctionPhoto || null);
      if (thumbUrl) {
        photoThumb = '<a class="photo-thumb-link" href="' + thumbUrl + '" target="_blank" style="display:block;margin:6px 0 0 0"><img class="approvals-photo-thumb" src="' + thumbUrl + '" alt="Photo evidence"></a>';
      }
      var hasSubs = fld.sub_steps && fld.sub_steps.length > 0;
      var subsHtml = '';
      if (hasSubs) {
        var subState = (fld.value && typeof fld.value === 'object' && fld.value.sub_steps) ? fld.value.sub_steps : {};
        subsHtml = fld.sub_steps.map(function(s) {
          var done = !!subState[s.id];
          var subAttrib = '';
          if (done && subState[s.id] && typeof subState[s.id] === 'object' && subState[s.id].by) {
            subAttrib = '<div style="padding:2px 0 4px 48px;font-size:11px;color:var(--mut)">' + escapeHtml(subState[s.id].by) + ' \u00b7 ' + formatTime(new Date(subState[s.id].at)) + '</div>';
          }
          var subIsRejected = s._pendingReject;
          var subRejectForm = subIsRejected ?
            '<div class="reject-item-form" style="margin-left:24px">' +
            '<textarea class="reject-item-input" name="reject-' + s.id + '" data-reject-fld="' + s.id + '" placeholder="Comment for crew\u2026" rows="2">' + escapeHtml(s._rejectComment || '') + '</textarea>' +
            '<label class="require-photo-toggle"><input type="checkbox" name="reject-photo-' + s.id + '" data-reject-photo-fld="' + s.id + '" ' + (s._rejectRequirePhoto ? 'checked' : '') + '> Require photo evidence</label></div>' : '';
          return '<div class="review-item" style="padding-left:24px">' +
            '<span class="review-check" style="font-size:12px;' + (done ? '' : 'color:#c0392b') + '">' + (done ? '✓' : '✗') + '</span>' +
            '<span class="review-label" style="font-size:13px">' + escapeHtml(s.label) + '</span>' +
            '<button class="review-reject-btn ' + (subIsRejected ? 'selected' : '') + '" data-action="toggle-reject-item" data-submission-id="' + submissionId + '" data-fld-id="' + s.id + '" style="font-size:11px;padding:2px 8px">' + (subIsRejected ? 'Flagged' : 'Flag') + '</button>' +
            '</div>' + subAttrib + subRejectForm;
        }).join('');
      }
      // For fields with sub-steps: no Flag on parent, sub-steps have their own flags
      if (hasSubs) {
        return '<div class="review-item">' +
          '<span class="review-check" style="' + (answered ? '' : 'color:#c0392b') + '">' + (answered ? '✓' : '✗') + '</span>' +
          '<span class="review-label">' + escapeHtml(fld.label || fld.type || fld.field_label || '') + '</span>' +
          '</div>' + subsHtml;
      }
      // For text fields, show the value below the label
      var textValue = '';
      if (fld.type === 'text' && answered && fld.value) {
        var displayText = typeof fld.value === 'string' ? fld.value : String(fld.value);
        textValue = '<div style="width:100%;padding:4px 0 0 24px;font-size:13px;color:var(--mut);white-space:pre-wrap;word-break:break-word">' + escapeHtml(displayText) + '</div>';
      }
      return '<div class="review-item" style="flex-wrap:wrap">' +
        '<span class="review-check" style="' + (answered ? '' : 'color:#c0392b') + '">' + (answered ? '✓' : '✗') + '</span>' +
        '<span class="review-label">' + escapeHtml(fld.label || fld.type || fld.field_label || '') + '</span>' +
        '<button class="review-reject-btn ' + (isRejected ? 'selected' : '') + '" data-action="toggle-reject-item" data-submission-id="' + submissionId + '" data-fld-id="' + fld.id + '">' + (isRejected ? 'Flagged' : 'Flag') + '</button>' +
        textValue +
        (photoThumb ? '<div style="width:100%;padding-left:24px">' + photoThumb + '</div>' : '') +
        '</div>' + rejectForm;
    }).join('');
    var rejCount = fields.reduce(function(count, f) {
      if (f._pendingReject) count++;
      (f.sub_steps || []).forEach(function(s) { if (s._pendingReject) count++; });
      return count;
    }, 0);
    return '<div class="approval-card card" data-submission-id="' + submissionId + '">' +
      '<div class="hd"><h1>' + escapeHtml(tplName) + '</h1>' +
      '<div class="sub">' + escapeHtml(submittedBy) + ' \u00b7 ' + formatDateTime(new Date(submittedAt)) + '</div></div>' +
      itemsHtml +
      '<div class="approval-actions" style="padding:16px;margin-top:16px;background:var(--bg);border-radius:0 0 12px 12px">' +
      '<button class="btn-approve" data-action="approve" data-submission-id="' + submissionId + '">Approve submission</button>' +
      '<button class="btn-reject" data-action="reject-submit" data-submission-id="' + submissionId + '" style="margin-top:8px">' + (rejCount > 0 ? 'Send rejection (' + rejCount + ')' : 'Send rejection') + '</button>' +
      '</div></div>';
  }).join('');
  container.innerHTML = pendingHtml ? '<div class="cat">PENDING</div>' + pendingHtml : '<div class="empty-state"><h2>' + EMPTY_APPROVALS.h + '</h2><p>' + EMPTY_APPROVALS.p + '</p></div>';
}

// ─── Submission lifecycle vocabulary ─────────────────────────────────────────
// The SERVER is the only writer of checklist_submissions.status, and it persists
// exactly four values (backend/internal/workflow/repository.go, submitChecklist +
// approveItem/rejectItem, constrained by the 0011 CHECK):
//
//   'completed' — template requires NO approval. Terminal. Nobody reviews it.
//   'pending'   — template requires approval, awaiting a reviewer.
//   'approved' / 'rejected' — the reviewer's verdict.
//
// 'submitted' and 'pending_approval' were CLIENT-ONLY strings this page invented
// for its own optimistic write; the server has never persisted either. They are
// still recognised below (never produced) so a MY_SUBMISSIONS cached by an older
// tab keeps rendering correctly until its next reload. Card A, run 20260726 —
// before this, 'completed' matched nothing and a submitted no-approval checklist
// fell through to the "not yet submitted" branch: editable, unbadged, with a live
// #submit-btn and fillState.readonly false.
var SUBMITTED_STATUSES = ['completed', 'submitted'];
var PENDING_STATUSES = ['pending', 'pending_approval'];
function isSubmittedStatus(st) { return SUBMITTED_STATUSES.indexOf(st) !== -1; }
function isPendingStatus(st) { return PENDING_STATUSES.indexOf(st) !== -1; }
function isApprovedStatus(st) { return st === 'approved'; }
// "The submission is a frozen record" — true for every status that means the
// responses are no longer live drafts. Gates snapshot reads (getProgress,
// hydration), not the read-only UI branch.
function isFrozenStatus(st) { return isSubmittedStatus(st) || isPendingStatus(st) || isApprovedStatus(st); }

function renderChecklistList(today) {
  if (!today || today.length === 0) {
    return '<div class="empty-state"><h2>' + EMPTY_MY.h + '</h2><p>' + EMPTY_MY.p + '</p></div>' +
      '<div style="padding:16px 0 8px;text-align:center"><button data-action="view-history" style="background:none;border:none;color:var(--info-tx);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;min-height:44px">View history</button></div>';
  }
  var totalFields = 0, totalAnswered = 0;
  const rows = today.map(tpl => {
    const secCount = tpl.sections ? tpl.sections.filter(isSectionVisible).length : 0;
    // Check if already submitted TODAY in MY_SUBMISSIONS (ignore stale submissions from prior days)
    var todayStr = appDay();  // app timezone, NOT UTC — card A1
    var submission = MY_SUBMISSIONS ? MY_SUBMISSIONS.find(function(s) {
      if (s.template_id !== tpl.id) return false;
      var subDate = s.submitted_at ? appDay(s.submitted_at) : '';
      return subDate === todayStr;
    }) : null;
    var progress = getProgress(tpl, submission);
    var answeredCount = progress.answered;
    var fieldCount = progress.total;
    const pct = fieldCount ? Math.round(answeredCount / fieldCount * 100) : 0;
    totalFields += fieldCount;
    totalAnswered += answeredCount;
    var pendingBadge = submission && isPendingStatus(submission.status) ? '<div class="approval-badge">Pending Approval</div>' : '';
    var approvedBadge = submission && isApprovedStatus(submission.status) ? '<div style="font-size:12px;color:#27ae60;margin-top:4px;font-weight:500">Approved \u2713</div>' : '';
    var submittedBadge = !approvedBadge && submission && isSubmittedStatus(submission.status) ? '<div style="font-size:12px;color:#27ae60;margin-top:4px;font-weight:500">Submitted \u2713</div>' : '';
    return `<div class="row" data-fill-template-id="${tpl.id}" data-template-id="${tpl.id}" style="cursor:pointer"><div style="flex:1"><div class="nm">${escapeHtml(tpl.name)}</div><div class="mt">${secCount} section${secCount !== 1 ? 's' : ''} \u00b7 ${answeredCount}/${fieldCount} items</div><div style="height:4px;background:var(--brd);border-radius:2px;margin-top:6px;overflow:hidden"><div style="height:100%;background:#27ae60;border-radius:2px;width:${pct}%"></div></div>${pendingBadge}${approvedBadge}${submittedBadge}</div></div>`;
  }).join('');
  const aggPct = totalFields ? Math.round(totalAnswered / totalFields * 100) : 0;
  return `<div class="cat">TODAY'S CHECKLISTS</div>
<div style="padding:8px 16px 12px">
  <div style="height:8px;background:var(--brd);border-radius:4px;overflow:hidden"><div style="height:100%;background:#27ae60;border-radius:4px;width:${aggPct}%;transition:width .3s"></div></div>
  <div style="font-size:12px;color:var(--mut);margin-top:4px">${totalAnswered} of ${totalFields} items complete across ${today.length} checklist${today.length !== 1 ? 's' : ''}</div>
</div>
<div class="card">${rows}</div>
<div style="padding:8px 0;text-align:center"><button data-action="view-history" style="background:none;border:none;color:var(--info-tx);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;min-height:44px">View history</button></div>`;
}

function renderRunner() {
  const tpl = fillState.activeTemplate;
  clearHiddenFieldAnswers();
  var runnerProgress = countCompletedFields();
  var answered = runnerProgress.answered;
  var allFields = { length: runnerProgress.total };
  // Check submission status BEFORE rendering sections — only today's submissions count
  var todayStr = appDay();  // app timezone, NOT UTC — card A1
  var submission = MY_SUBMISSIONS ? MY_SUBMISSIONS.find(function(s) {
    if (s.template_id !== tpl.id) return false;
    var subDate = s.submitted_at ? appDay(s.submitted_at) : '';
    return subDate === todayStr;
  }) : null;
  var isSubmitted = !!submission && isSubmittedStatus(submission.status);
  var isPending = !!submission && isPendingStatus(submission.status);
  var isApproved = !!submission && isApprovedStatus(submission.status);
  fillState.readonly = isSubmitted || isPending || isApproved;
  const sectionsHtml = (tpl.sections || []).map(sec => renderRunnerSection(sec)).join('');
  const unsubmitBtn = `<button data-action="unsubmit" data-tpl-id="${tpl.id}" data-submission-id="${submission ? submission.id : ''}" style="width:100%;padding:14px;margin:16px 0 0;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer">Unsubmit</button>`;
  const submitHtml = isApproved
    ? `<div class="submit-confirm" style="margin-top:16px;color:#27ae60;font-weight:600">Approved \u2713</div>`
    : isSubmitted
    ? `<div class="submit-confirm" style="margin-top:16px">Checklist submitted. Thanks, ${getUserInitials()}!</div>${unsubmitBtn}`
    : isPending
      ? `<div class="submit-confirm" style="margin-top:16px">Submitted for approval by ${submission.submitted_by_name || getUserName()}. Waiting for manager review.</div>${unsubmitBtn}`
      : `<button class="btn-primary" id="submit-btn" data-action="submit" data-tpl-id="${tpl.id}" style="margin-top:8px">Submit checklist</button>`;
  return `<button class="editor-back" id="fill-back">Checklists</button>
<div style="padding:12px 16px 0;font-size:16px;font-weight:600">${escapeHtml(tpl.name)}</div>
<div style="padding:10px 16px 0" class="progress-line">
  <div style="height:6px;background:var(--brd);border-radius:3px;overflow:hidden;margin-bottom:6px"><div style="height:100%;background:#27ae60;border-radius:3px;width:${allFields.length?Math.round(answered/allFields.length*100):0}%;transition:width .3s"></div></div>
  <div style="font-size:13px;color:var(--mut)">${answered} of ${allFields.length} items complete</div>
</div>
${sectionsHtml}
${submitHtml}`;
}

function isSectionVisible(sec) {
  if (!sec.condition || !sec.condition.days || sec.condition.days.length === 0) return true;
  return sec.condition.days.includes(new Date().getDay());
}

function isFieldVisible(fld) {
  // Day-of-week check
  if (fld.condition && fld.condition.days && fld.condition.days.length > 0) {
    if (!fld.condition.days.includes(new Date().getDay())) return false;
  }
  // Skip logic check
  if (fld.condition && fld.condition.field_id) {
    var depResp = FIELD_RESPONSES[fld.condition.field_id];
    if (!depResp) return false; // dependent field not answered yet — hide
    var depVal = String(depResp.value);
    var expected = String(fld.condition.value);
    // Handle sentinel values from the builder dropdown
    if (expected === '_notempty') {
      // "_notempty" represents the concept "has a value" — operator 'equals' means "show when not-empty"
      var hasValue = depVal && depVal !== 'undefined' && depVal !== 'null';
      if (fld.condition.operator === 'equals') return hasValue;
      if (fld.condition.operator === 'not_equals') return !hasValue;
    }
    if (fld.condition.operator === 'equals' && depVal !== expected) return false;
    if (fld.condition.operator === 'not_equals' && depVal === expected) return false;
  }
  return true;
}

function clearHiddenFieldAnswers() {
  if (!fillState.activeTemplate) return;
  fillState.activeTemplate.sections.forEach(function(sec) {
    if (!isSectionVisible(sec)) {
      sec.fields.forEach(function(f) { delete FIELD_RESPONSES[f.id]; delete FAIL_NOTES[f.id]; });
    } else {
      sec.fields.forEach(function(f) {
        if (!isFieldVisible(f)) { delete FIELD_RESPONSES[f.id]; delete FAIL_NOTES[f.id]; }
      });
    }
  });
}

function renderRunnerSection(sec) {
  if (!isSectionVisible(sec)) return '';
  const fieldsHtml = (sec.fields || []).map(f => isFieldVisible(f) ? renderRunnerField(f) : '').join('');
  if (!fieldsHtml) return '';
  return `<div class="sec-hd"><span>${escapeHtml(sec.title)}</span></div><div class="card">${fieldsHtml}</div>`;
}

function renderFeedbackNote(fldId) {
  var fb = FEEDBACK_NOTES[fldId];
  if (!fb || !fb.comment) return '';
  return '<div style="margin-top:4px;padding:6px 10px;background:var(--warn-bg);color:var(--warn-tx);border-radius:6px;font-size:12px">' +
    '<span style="font-weight:600">Feedback:</span> ' + escapeHtml(fb.comment) + '</div>';
}

// correctionBannerFor renders the "⚠ Rejected: <comment>" banner for a rejected
// field OR sub-step. Keyed by id so it works for both top-level fields (which
// have a FIELD_RESPONSES entry) and sub-steps (which don't — pass resp=null).
// A rejection's comment and photo requirement must render wherever the rejected
// item lives; before this, sub-step rows rendered no banner, so a sub-step
// rejection's comment silently vanished (operator-found 2026-07-18).
function correctionBannerFor(fieldId, resp) {
  var rejFlag = REJECTION_FLAGS[fieldId];
  if (!rejFlag) return '';
  var photoSuffix = rejFlag.requirePhoto
    ? (fieldHasRequiredPhoto(fieldId) ? ' · ✓ Photo uploaded' : ' · 📷 Photo required before resubmit')
    : '';
  return '<div class="correction-banner">⚠ Rejected: ' + escapeHtml(rejFlag.comment) + photoSuffix + '</div>';
}

// correctionPhotoUI renders the capture control that lets the crew attach the
// photo an approver required when bouncing a NON-photo field back. Photo-type
// fields satisfy require_photo through their own answer value, so they get no
// second control here. The captured URL lives in CORRECTION_PHOTOS[fieldId]
// (persisted via the `_correction_photo` value bundle), separate from the
// field's answer, so a checkbox can be both checked AND carry its evidence.
function correctionPhotoUI(fieldId, fieldType) {
  var rejFlag = REJECTION_FLAGS[fieldId];
  if (!rejFlag || !rejFlag.requirePhoto || fieldType === 'photo') return '';
  var url = CORRECTION_PHOTOS[fieldId];
  var inner = url
    ? '<div class="photo-thumb-wrap">' +
      '<a class="photo-thumb-link" href="' + url + '" target="_blank"><img class="photo-thumb" src="' + url + '" alt="Correction photo"></a>' +
      '<button class="photo-retake-link" data-action="correction-photo-retake" data-fld-id="' + fieldId + '">Retake</button>' +
      '</div>'
    : '<button class="photo-capture-btn" data-action="correction-photo-capture" data-fld-id="' + fieldId + '">📷 Add photo</button>';
  return '<div class="correction-photo-area" data-correction-photo-fld="' + fieldId + '" style="margin:0 0 8px">' + inner + '</div>';
}

function renderRunnerField(fld) {
  const answered = FIELD_RESPONSES[fld.id] !== undefined;
  const resp = answered ? FIELD_RESPONSES[fld.id] : null;
  // A pending field re-emits its mark here so a re-render (reopen, remote op)
  // cannot silently upgrade "waiting to sync" into "saved".
  const pendingMark = PENDING_SYNC.has(fld.id) ? '<span class="unsaved-mark">Unsaved</span>' : '';
  const attribution = answered
    ? `<div class="fill-attribution">${escapeHtml(resp.answeredBy)} · ${formatTime(resp.answeredAt)}</div>${pendingMark}`
    : pendingMark;

  // Read-only mode: show values without interactive controls
  if (fillState.readonly) {
    var displayVal = '';
    if (fld.type === 'checkbox') {
      var subs = fld.sub_steps && fld.sub_steps.length > 0 ? fld.sub_steps : null;
      if (subs) {
        var subState = (resp && resp.sub_steps) ? resp.sub_steps : {};
        var allSubsDone = subs.every(function(s) { return !!subState[s.id]; });
        var subsReadonly = subs.map(function(s) {
          var subVal = subState[s.id];
          var done = !!subVal;
          var subAttrib = '';
          if (done && subVal && typeof subVal === 'object' && subVal.by) {
            subAttrib = '<div class="fill-attribution" style="padding:2px 0 8px 24px;font-size:11px;border-bottom:0.5px solid var(--brd)">' + escapeHtml(subVal.by) + ' \u00b7 ' + formatTime(new Date(subVal.at)) + '</div>';
          }
          return '<div class="sub-step-row"' + (subAttrib ? ' style="border-bottom:none"' : '') + '><span class="sub-step-label-text' + (done ? ' style="text-decoration:line-through;color:var(--mut)"' : '') + '">' + escapeHtml(s.label) + '</span>' +
            '<span class="sub-step-check ' + (done ? 'done' : '') + '" style="cursor:default">' + (done ? '✓' : '') + '</span></div>' + subAttrib;
        }).join('');
        return '<div class="fill-field" data-field-id="' + fld.id + '">' +
          '<div class="fill-field-row">' +
          '<div class="fill-field-label" style="margin-bottom:0">' + escapeHtml(fld.label) + '</div>' +
          '<span style="font-weight:500;' + (allSubsDone ? 'color:#27ae60' : 'color:#c0392b') + '">' + (allSubsDone ? '✓' : '✗') + '</span>' +
          '</div>' +
          subsReadonly +
          attribution +
          renderFeedbackNote(fld.id) +
          '</div>';
      }
      displayVal = answered ? '<span style="color:#27ae60">✓</span>' : '<span style="color:#c0392b">✗</span>';
    } else if (fld.type === 'yes_no') {
      displayVal = !answered ? '<span style="color:#c0392b">✗</span>' : (resp.value === true || resp.value === 'true') ? 'Yes' : 'No';
    } else if (fld.type === 'temperature') {
      var unit = fld.config && fld.config.unit ? fld.config.unit : 'F';
      displayVal = answered ? resp.value + '°' + unit : '<span style="color:#c0392b">✗</span>';
    } else if (fld.type === 'text') {
      displayVal = answered ? escapeHtml(String(resp.value)) : '<span style="color:#c0392b">✗</span>';
    } else if (fld.type === 'photo') {
      displayVal = answered && typeof resp.value === 'string' && resp.value.startsWith('https://') ? '<a href="' + resp.value + '" target="_blank" style="color:var(--info-tx)">View photo</a>' : '<span style="color:#c0392b">✗</span>';
    } else {
      displayVal = answered ? String(resp.value) : '<span style="color:#c0392b">✗</span>';
    }
    var failNote = FAIL_NOTES[fld.id];
    var failHtml = failNote && failNote.note ? `<div style="margin-top:4px;font-size:12px;color:var(--warn-tx)">Corrective action: ${escapeHtml(failNote.note)} (${escapeHtml(failNote.severity || '')})</div>` : '';
    var feedbackHtml = renderFeedbackNote(fld.id);
    if (fld.type === 'text') {
      return `<div class="fill-field" data-field-id="${fld.id}">
  <div class="fill-field-label" style="margin-bottom:4px">${escapeHtml(fld.label)}</div>
  <div style="font-size:14px;font-weight:500;white-space:pre-wrap;word-break:break-word">${displayVal}</div>
  ${attribution}${failHtml}${feedbackHtml}
</div>`;
    }
    return `<div class="fill-field" data-field-id="${fld.id}">
  <div class="fill-field-row">
    <div class="fill-field-label" style="margin-bottom:0">${escapeHtml(fld.label)}</div>
    <span style="font-weight:500">${displayVal}</span>
  </div>
  ${attribution}${failHtml}${feedbackHtml}
</div>`;
  }

  const correctionBanner = correctionBannerFor(fld.id, resp) + correctionPhotoUI(fld.id, fld.type);

  if (fld.type === 'checkbox') {
    var subs = fld.sub_steps && fld.sub_steps.length > 0 ? fld.sub_steps : null;
    var subStepsHtml = '';
    if (subs) {
      var subState = (resp && resp.sub_steps) ? resp.sub_steps : {};
      var allSubsDone = subs.every(function(s) { return !!subState[s.id]; });
      subStepsHtml = subs.map(function(s) {
        var subVal = subState[s.id];
        var done = !!subVal;
        // Per-sub attribution: support both legacy (true) and new ({by, at}) format
        var subAttrib = '';
        if (done && subVal && typeof subVal === 'object' && subVal.by) {
          subAttrib = '<div class="fill-attribution" style="padding:2px 0 8px 24px;font-size:11px;border-bottom:0.5px solid var(--brd)">' + escapeHtml(subVal.by) + ' \u00b7 ' + formatTime(new Date(subVal.at)) + '</div>';
        }
        // A rejected sub-step renders its own correction banner (comment +
        // photo requirement) above its row — before this, sub-step rejection
        // feedback rendered nowhere and silently vanished (2026-07-18).
        return correctionBannerFor(s.id, null) +
          '<div class="sub-step-row"' + (subAttrib ? ' style="border-bottom:none"' : '') + '><span class="sub-step-label-text' + (done ? ' style="text-decoration:line-through;color:var(--mut)"' : '') + '">' + escapeHtml(s.label) + '</span>' +
          '<button class="sub-step-check ' + (done ? 'done' : '') + '" data-action="toggle-sub-step" data-field-id="' + fld.id + '" data-sub-id="' + s.id + '">' + (done ? '✓' : '') + '</button></div>' + subAttrib;
      }).join('');
      // For sub-step checkboxes, parent is auto-checked when all subs done
      var parentChecked = allSubsDone;
      return '<div class="fill-field" data-field-id="' + fld.id + '">' +
        correctionBanner +
        '<div class="fill-field-row" style="border-bottom:0.5px solid var(--brd);padding-bottom:8px">' +
        '<div class="fill-field-label" style="margin-bottom:0">' + escapeHtml(fld.label) + '</div>' +
        '<button class="check-btn ' + (parentChecked ? 'checked' : '') + '" data-field-id="' + fld.id + '" data-has-subs="true" aria-label="Toggle checkbox">' + (parentChecked ? '✓' : '') + '</button>' +
        '</div>' +
        subStepsHtml +
        pendingMark +
        '</div>';
    }
    return `<div class="fill-field" data-field-id="${fld.id}">
  ${correctionBanner}
  <div class="fill-field-row">
    <div class="fill-field-label" style="margin-bottom:0">${escapeHtml(fld.label)}</div>
    <button class="check-btn ${answered ? 'checked' : ''}" data-field-id="${fld.id}" aria-label="Toggle checkbox">${answered ? '✓' : ''}</button>
  </div>
  ${attribution}
</div>`;
  }

  if (fld.type === 'yes_no') {
    const isYes = answered && (resp.value === true || resp.value === 'true');
    const isNo = answered && (resp.value === false || resp.value === 'false');
    const failCard = isNo ? renderFailCard(fld, FAIL_NOTES[fld.id] || null) : '';
    return `<div class="fill-field" data-field-id="${fld.id}">
  ${correctionBanner}
  <div class="fill-field-label">${escapeHtml(fld.label)}</div>
  <div class="yn-pills">
    <button class="yn-pill${isYes ? ' on' : ''}" data-action="set-yes" data-fld-id="${fld.id}">Yes</button>
    <button class="yn-pill${isNo ? ' on' : ''}" data-action="set-no" data-fld-id="${fld.id}">No</button>
  </div>
  ${attribution}
</div>${failCard}`;
  }

  if (fld.type === 'text') {
    return `<div class="fill-field" data-field-id="${fld.id}">
  ${correctionBanner}
  <label class="fill-field-label" for="txt-${fld.id}">${escapeHtml(fld.label)}</label>
  <textarea id="txt-${fld.id}" class="fill-textarea" data-action="text-input" data-fld-id="${fld.id}" data-field-id="${fld.id}" rows="3" placeholder="Enter notes...">${answered ? escapeHtml(resp.value) : ''}</textarea>
  ${attribution}
</div>`;
  }

  if (fld.type === 'temperature') {
    const tempVal = answered ? resp.value : '';
    const isFail = evaluateFailTrigger(fld.fail_trigger, tempVal);
    const warnLabel = isFail && fld.fail_trigger
      ? `<span class="temp-warn">Out of range (${fld.fail_trigger.min}\u2013${fld.fail_trigger.max}\u00b0F)</span>`
      : '';
    const failCard = isFail ? renderFailCard(fld, FAIL_NOTES[fld.id] || null) : '';
    return `<div class="fill-field" data-field-id="${fld.id}">
  ${correctionBanner}
  <label class="fill-field-label" for="temp-${fld.id}">${escapeHtml(fld.label)}</label>
  <div class="temp-input-row" style="padding-left:0;padding-right:0">
    <input type="number" id="temp-${fld.id}" class="fill-temp-input" data-action="temp-input" data-fld-id="${fld.id}" data-field-id="${fld.id}" value="${tempVal}" placeholder="0" style="width:80px;padding:10px 12px;background:var(--bg);border:0.5px solid var(--brd);border-radius:8px;font-size:18px;color:var(--txt);font-family:inherit;outline:none;-webkit-appearance:none">
    <span class="temp-unit" style="font-size:14px;color:var(--mut);margin-left:4px">°F</span>
  </div>
  ${warnLabel}
  ${attribution}
</div>${failCard}`;
  }

  if (fld.type === 'photo') {
    var photoUrl = answered && resp && typeof resp.value === 'string' && resp.value.startsWith('https://') ? resp.value : null;
    var captureAreaHtml = photoUrl
      ? '<div class="photo-thumb-wrap">' +
        '<a class="photo-thumb-link" href="' + photoUrl + '" target="_blank">' +
        '<img class="photo-thumb" src="' + photoUrl + '" alt="Captured photo">' +
        '</a>' +
        '<button class="photo-retake-link" data-action="photo-retake" data-fld-id="' + fld.id + '">Retake</button>' +
        '</div>'
      : '<button class="photo-capture-btn" data-action="photo-capture" data-fld-id="' + fld.id + '">📷 Take Photo</button>';
    return '<div class="fill-field" data-field-id="' + fld.id + '">' +
      correctionBanner +
      '<div class="fill-field-label">' + escapeHtml(fld.label) + '</div>' +
      '<div class="photo-capture-area" style="margin-top:6px">' + captureAreaHtml + '</div>' +
      attribution +
      '</div>';
  }

  return `<div class="fill-field" data-field-id="${fld.id}"><div class="fill-field-label">${escapeHtml(fld.label)}</div></div>`;
}

function attachRunnerListeners() {
  // Text textarea: save on blur, re-render to show/hide conditional fields
  document.querySelectorAll('.fill-textarea').forEach(el => {
    el.addEventListener('blur', function() {
      const fldId = this.dataset.fieldId;
      if (this.value.trim()) {
        FIELD_RESPONSES[fldId] = { value: this.value.trim(), answeredBy: getUserName(), answeredAt: new Date() };
        debouncedSaveField(fldId, this.value.trim());
      } else {
        delete FIELD_RESPONSES[fldId];
      }
      updateProgress();
      renderFillOut();
    });
  });
  // Temperature: handled by input delegation — no blur listener needed
}

function isFieldAnswered(f) {
  var resp = FIELD_RESPONSES[f.id];
  if (resp === undefined) return false;
  if (REJECTION_FLAGS[f.id]) return false;
  // For fields with sub-steps, only count as complete when all subs are done
  if (f.sub_steps && f.sub_steps.length > 0) return resp.value === true;
  return true;
}

// getProgress: single source of truth for "X of Y items complete".
// Applies section/field visibility filters and handles sub-steps consistently.
// For submitted checklists, uses snapshot + responses instead of live template.
function getProgress(tpl, submission) {
  if (submission && submission.responses && submission.template_snapshot &&
      isFrozenStatus(submission.status)) {
    var snap = typeof submission.template_snapshot === 'string' ? JSON.parse(submission.template_snapshot) : submission.template_snapshot;
    var snapFields = (snap.sections || []).filter(isSectionVisible).flatMap(function(s) { return (s.fields || []).filter(isFieldVisible); });
    var respIds = new Set(submission.responses.filter(function(r) { return r.value !== null && r.value !== undefined; }).map(function(r) { return r.field_id; }));
    var answered = snapFields.filter(function(f) { return respIds.has(f.id); }).length;
    return { answered: answered, total: snapFields.length };
  }
  var visibleFields = (tpl.sections || []).filter(isSectionVisible).flatMap(function(s) { return (s.fields || []).filter(isFieldVisible); });
  var answered = visibleFields.filter(isFieldAnswered).length;
  return { answered: answered, total: visibleFields.length };
}

function countCompletedFields() {
  if (!fillState.activeTemplate) return { answered: 0, total: 0 };
  return getProgress(fillState.activeTemplate, null);
}

function updateProgress() {
  const { answered, total } = countCompletedFields();
  const el = document.querySelector('#fill-body .progress-line');
  if (el) {
    var pct = total ? Math.round(answered / total * 100) : 0;
    el.innerHTML = '<div style="height:6px;background:var(--brd);border-radius:3px;overflow:hidden;margin-bottom:6px"><div style="height:100%;background:#27ae60;border-radius:3px;width:' + pct + '%;transition:width .3s"></div></div><div style="font-size:13px;color:var(--mut)">' + answered + ' of ' + total + ' items complete</div>';
  }
}

document.getElementById('fill-body').addEventListener('click', function(e) {
  // Checklist list row → open runner
  const fillRow = e.target.closest('[data-fill-template-id]');
  if (fillRow) {
    const tpl = MY_CHECKLISTS.find(t => t.id === fillRow.dataset.fillTemplateId);
    if (tpl) {
      fillState.activeTemplate = tpl;
      fillState.view = 'runner';
      location.hash = 'checklist=' + tpl.id;
      // For submitted/pending checklists, use snapshot sections so field IDs match responses
      var todayStr = appDay();  // app timezone, NOT UTC — card A1
      var submission = MY_SUBMISSIONS ? MY_SUBMISSIONS.find(function(s) {
        if (s.template_id !== tpl.id) return false;
        var subDate = s.submitted_at ? appDay(s.submitted_at) : '';
        return subDate === todayStr;
      }) : null;
      if (submission && submission.template_snapshot && isFrozenStatus(submission.status)) {
        var snap = typeof submission.template_snapshot === 'string' ? JSON.parse(submission.template_snapshot) : submission.template_snapshot;
        if (snap && snap.sections) tpl.sections = snap.sections;
      }
      // Restore field state (including fail notes) for this template's fields
      var tplFieldIds = fillTemplateFieldIds(tpl);
      hydrateFieldState(tplFieldIds);
      renderFillOut();
      // ── C3: this checklist's RxDB fill scope. READS ONLY (decision 126). ──
      // A no-op unless the `hq_sync_read` flag is on AND this checklist has a
      // submission row — `checklist_submissions.id` is what the scope is scoped
      // BY (decision 105), and a checklist with no submission has none. It never
      // throws and never blocks the render above, which has already happened.
      closeActiveFillScope();
      if (submission) {
        fillState.syncChecklistId = submission.id;
        fillSyncOpen(submission.id, tpl.id, [...tplFieldIds]);
      }
    }
    return;
  }

  // View history link
  if (e.target.closest('[data-action="view-history"]')) {
    var container = document.getElementById('checklist-list');
    if (container) {
      container.innerHTML = '<div style="padding:8px 0"><div style="font-size:13px;color:var(--mut);padding:8px 16px">Loading history\u2026</div></div>';
      api('GET', 'myHistory').then(function(history) {
        if (!history || history.length === 0) {
          container.innerHTML = '<div class="empty-state"><h2>No history yet</h2><p>Your submitted checklists will appear here.</p></div>';
          return;
        }
        var rows = history.map(function(s) {
          return '<div class="row"><div><div class="nm">' + escapeHtml(s.template_name || 'Checklist') + '</div>' +
            '<div class="mt">' + formatDateTime(new Date(s.submitted_at || s.submittedAt)) + ' \u00b7 ' + escapeHtml(s.status || '') + '</div></div></div>';
        }).join('');
        container.innerHTML = '<div class="cat">HISTORY</div><div class="card">' + rows + '</div>' +
          '<div style="padding:8px 0;text-align:center"><button data-action="back-to-today" style="background:none;border:none;color:var(--info-tx);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;min-height:44px">\u2190 Back to today</button></div>';
      }).catch(function() {
        container.innerHTML = '<div class="inline-error">Couldn\u2019t load history. <button class="retry-btn" onclick="renderMyChecklists()">Retry</button></div>';
      });
    }
    return;
  }

  // Back to today
  if (e.target.closest('[data-action="back-to-today"]')) {
    renderMyChecklists();
    return;
  }

  // Back button in runner
  if (e.target.closest('#fill-back')) {
    // One scope per open checklist, CANCELLED ON CLOSE (ledger T-43(c)). Only
    // this checklist's — any other live fill scope keeps running.
    closeActiveFillScope();
    fillState.view = 'list';
    fillState.activeTemplate = null;
    fillState.readonly = false;
    location.hash = '';
    renderFillOut();
    return;
  }

  // Checkbox button
  const checkBtn = e.target.closest('.check-btn');
  if (checkBtn) {
    const fldId = checkBtn.dataset.fieldId;
    const hasSubs = checkBtn.dataset.hasSubs === 'true';
    if (hasSubs) {
      // Parent with sub-steps: unchecking clears all sub-steps; can't directly check parent
      if (FIELD_RESPONSES[fldId]) {
        delete FIELD_RESPONSES[fldId]; // clears parent + sub_steps state
        debouncedSaveField(fldId, null);
      }
    } else if (FIELD_RESPONSES[fldId]) {
      delete FIELD_RESPONSES[fldId];
      debouncedSaveField(fldId, null);
    } else {
      clearRejectionFlag(fldId);
      FIELD_RESPONSES[fldId] = { value: true, answeredBy: getUserName(), answeredAt: new Date() };
      debouncedSaveField(fldId, true);
    }
    // Re-render full runner to show/hide conditional fields that depend on this checkbox
    renderFillOut();
    return;
  }

  // data-action routing
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const action = actionEl.dataset.action;
    const fldId = actionEl.dataset.fldId;

    if (action === 'toggle-sub-step') {
      var parentFldId = actionEl.dataset.fieldId;
      var subId = actionEl.dataset.subId;
      var tplField = fillState.activeTemplate.sections.flatMap(function(s){return s.fields}).find(function(f){return f.id===parentFldId});
      if (!tplField || !tplField.sub_steps) return;
      // Get or create response with sub_steps map
      if (!FIELD_RESPONSES[parentFldId]) {
        FIELD_RESPONSES[parentFldId] = { value: false, answeredBy: getUserName(), answeredAt: new Date(), sub_steps: {} };
      }
      var resp = FIELD_RESPONSES[parentFldId];
      if (!resp.sub_steps) resp.sub_steps = {};
      // Toggle — store who checked each sub-step
      if (resp.sub_steps[subId]) {
        delete resp.sub_steps[subId];
      } else {
        resp.sub_steps[subId] = { by: getUserName(), at: new Date().toISOString() };
      }
      resp.answeredBy = getUserName();
      resp.answeredAt = new Date();
      // Auto-check parent if all subs done; clean up if none checked
      var allDone = tplField.sub_steps.every(function(s){ return !!resp.sub_steps[s.id]; });
      var anyDone = tplField.sub_steps.some(function(s){ return !!resp.sub_steps[s.id]; });
      resp.value = allDone;
      if (allDone) { clearRejectionFlag(parentFldId); }
      if (!anyDone) {
        delete FIELD_RESPONSES[parentFldId];
        debouncedSaveField(parentFldId, false);
      } else {
        debouncedSaveField(parentFldId, { value: resp.value, sub_steps: resp.sub_steps });
      }
      var fieldDiv = document.querySelector('.fill-field[data-field-id="' + parentFldId + '"]');
      if (fieldDiv) fieldDiv.outerHTML = renderRunnerField(tplField);
      updateProgress();
      return;
    }

    if (action === 'set-yes') {
      clearRejectionFlag(fldId);
      FIELD_RESPONSES[fldId] = { value: true, answeredBy: getUserName(), answeredAt: new Date() };
      debouncedSaveField(fldId, true);
      if (FAIL_NOTES[fldId]) delete FAIL_NOTES[fldId];
      renderFillOut();
      return;
    }

    if (action === 'set-no') {
      clearRejectionFlag(fldId);
      FIELD_RESPONSES[fldId] = { value: false, answeredBy: getUserName(), answeredAt: new Date() };
      debouncedSaveField(fldId, false);
      if (!FAIL_NOTES[fldId]) FAIL_NOTES[fldId] = { note: '', severity: '' };
      renderFillOut();
      return;
    }

    if (action === 'set-severity') {
      const severity = actionEl.dataset.severity;
      if (!FAIL_NOTES[fldId]) FAIL_NOTES[fldId] = { note: '', severity: '' };
      FAIL_NOTES[fldId].severity = severity;
      autoSaveFailNote(fldId);
      // Re-render just the fail card
      const failCard = e.target.closest('.fail-card');
      if (failCard) {
        const tplField = fillState.activeTemplate.sections.flatMap(s => s.fields).find(f => f.id === fldId);
        if (tplField) {
          const tmp = document.createElement('div');
          tmp.innerHTML = renderFailCard(tplField, FAIL_NOTES[fldId]);
          failCard.replaceWith(tmp.firstChild);
        }
      }
      return;
    }

    if (action === 'photo-capture' || action === 'photo-retake') {
      handlePhotoCaptureClick(fldId);
      return;
    }

    if (action === 'fail-photo-capture' || action === 'fail-photo-retake') {
      handleFailPhotoCaptureClick(fldId);
      return;
    }

    if (action === 'correction-photo-capture' || action === 'correction-photo-retake') {
      handleCorrectionPhotoCaptureClick(fldId);
      return;
    }

    if (action === 'unsubmit') {
      var submissionId = actionEl.dataset.submissionId;
      if (!submissionId) { showToast('No submission to unsubmit'); return; }
      if (!confirm('Unsubmit this checklist? It will return to draft and you can edit your responses.')) return;
      actionEl.textContent = 'Unsubmitting\u2026';
      actionEl.disabled = true;
      api('POST', 'unsubmitChecklist', { submission_id: submissionId }).then(function() {
        showToast('Checklist unsubmitted');
        // Remove from MY_SUBMISSIONS so the runner exits read-only mode
        if (MY_SUBMISSIONS) {
          MY_SUBMISSIONS = MY_SUBMISSIONS.filter(function(s) { return s.id !== submissionId; });
        }
        fillState.readonly = false;
        // Reload to get fresh draft state
        loadMyChecklists();
        renderFillOut();
      }).catch(function(err) {
        actionEl.textContent = 'Unsubmit';
        actionEl.disabled = false;
        if (err && err.error === 'not_submitter') showToast('Only the submitter can unsubmit');
        else if (err && err.error === 'already_approved') showToast('Cannot unsubmit an approved checklist');
        else showToast('Unsubmit failed. Try again.');
      });
      return;
    }

    if (action === 'submit') {
      const tplId = actionEl.dataset.tplId;
      var btn = document.getElementById('submit-btn');
      var allFlds = fillState.activeTemplate.sections.filter(function(s){return isSectionVisible(s)}).flatMap(function(s){return s.fields.filter(function(f){return isFieldVisible(f)})});

      // Validate: fields with triggered fail conditions must have a corrective action
      var missingCorrective = allFlds.filter(function(f) {
        var resp = FIELD_RESPONSES[f.id];
        if (!resp) return false;
        // A yes/no field answered "No" is a triggered fail requiring a corrective
        // note — mirrors the corrective card the fill UI already renders on every "No".
        var triggered = (f.type === 'yes_no' && (resp.value === false || resp.value === 'false'))
          || (f.fail_trigger && evaluateFailTrigger(f.fail_trigger, resp.value));
        if (!triggered) return false;
        var fn = FAIL_NOTES[f.id];
        return !fn || !fn.note || !fn.note.trim() || !fn.severity;
      });
      if (missingCorrective.length > 0) {
        var fieldNames = missingCorrective.map(function(f) { return f.label; }).join(', ');
        showToast('Select severity for: ' + fieldNames);
        // Scroll to first missing fail card
        var firstFld = document.querySelector('[data-field-id="' + missingCorrective[0].id + '"]');
        if (firstFld) firstFld.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // Validate: required photo fields must have a photo attached (a valid
      // https:// URL as the response value). Also enforces resubmit when a
      // rejection flagged require_photo for the field. Mirrors the backend
      // photo_required gate in validateFailNotes.
      var missingPhoto = allFlds.filter(function(f) {
        var rejFlag = REJECTION_FLAGS[f.id];
        var needsPhoto = (f.type === 'photo' && f.required) || (rejFlag && rejFlag.requirePhoto);
        if (!needsPhoto) return false;
        // Satisfied by the field's own photo value (photo-type fields) OR the
        // dedicated correction-photo slot (any other field type).
        return !fieldHasRequiredPhoto(f.id);
      });
      if (missingPhoto.length > 0) {
        var photoNames = missingPhoto.map(function(f) { return f.label; }).join(', ');
        showToast('Photo required for: ' + photoNames);
        var firstPhoto = document.querySelector('[data-field-id="' + missingPhoto[0].id + '"]');
        if (firstPhoto) firstPhoto.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // Check if all items are complete — prompt if not
      var incompleteCount = allFlds.filter(function(f) { return !isFieldAnswered(f); }).length;
      if (incompleteCount > 0) {
        if (!confirm(incompleteCount + ' item' + (incompleteCount !== 1 ? 's' : '') + ' not completed. Submit anyway?')) return;
      }

      // Cancel any pending auto-saves — their drafts will be moved by submitChecklist
      Object.keys(SAVE_DEBOUNCE).forEach(function(k) { clearTimeout(SAVE_DEBOUNCE[k]); delete SAVE_DEBOUNCE[k]; });
      Object.keys(FAIL_NOTE_DEBOUNCE).forEach(function(k) { clearTimeout(FAIL_NOTE_DEBOUNCE[k]); delete FAIL_NOTE_DEBOUNCE[k]; });
      _pendingSaves = 0;
      var statusEl = document.getElementById('save-status');
      if (statusEl) { statusEl.style.display = 'none'; statusEl.style.opacity = '0'; }
      if (btn) { btn.textContent = 'Submitting\u2026'; btn.disabled = true; }

     OVERSIGHT. The sheet renders from the durable local conflict record; the
     record is written when `conflict$` fires; `conflict$` fires when
     replication runs; replication is not started, because `HQ_SYNC_REST_URL` is
     unset in every environment and the /sync door answers 503 by design until
     `sync-rxdb-row-visibility-rls` lands. So in production today there are zero
     records, the banner never appears, and nothing on this page changes.
     `sync-hard-cutover` is the card that switches the producer on.

     What that buys, and why it is not busywork: every state of this UI is
     forced from a seeded store in tests/states-sync-rxdb-conflict-notice.spec.js,
     the screen exists and is reviewable, and the cutover card has to supply a
     store and a write function rather than design a screen under time pressure.

     🛑 NO WRITE PATH IS SWAPPED. debouncedSaveField -> submitOp('SET_FIELD') ->
     DRAFT_RESPONSES -> hydrateFieldState is byte-untouched. (This comment said
     `autoSaveField`, which is defined nowhere — B-65.) `applyRestore`
     below USES that same live path — "Restore mine writes the crew member's
     value again, now, from the current master state" is an ordinary edit, and
     the ordinary edit in this tree is submitOp. -->
<script type="module">
import { mountConflictNotice } from './sync-rxdb/conflict-notice-ui.js';
import { createRxdbConflictStore, createMemoryConflictStore } from './sync-rxdb/conflict-notice.js';

const bannerRoot = document.getElementById('conflict-notice');
const sheetRoot = document.getElementById('conflict-sheet');

// The store. An RxDB database exists only once something creates one — nothing
// does in this tree — so the default is an EMPTY memory store, which renders
// the `empty` plate and no banner. That is exactly what "HQ caught nothing"
// looks like, and the empty state's copy is scoped to the record for precisely
// this reason: a non-leader tab, an unsubscribed replication and an evicted
// store all produce the same screen and the app cannot tell them apart.
function defaultStore() {
  const db = window.HQSync && window.HQSync.db;
  if (db && db.conflict_records) return createRxdbConflictStore(db.conflict_records);
  return createMemoryConflictStore([]);
}

// `Restore mine` — an ordinary local edit through the live persistence path.
// It resurrects nothing: it writes the crew member's value AGAIN, NOW, against
// the current master state, so it matches the current compare-and-swap and
// pushes cleanly. If the server has moved again in between, that write
// conflicts in turn and lands back on this same row — keyed by document + field,
// so the loop closes rather than growing a duplicate row per retry.
async function applyRestore(row) {
  if (typeof window.submitOp !== 'function') {
    const e = new Error('no write path available');
    e.name = 'OfflineError';
    throw e;
  }
  const res = await window.submitOp('SET_FIELD', row.fieldId, 'field_response', {
    value: row.rawDiscarded !== undefined ? row.rawDiscarded : row.yours,
    field_id: row.fieldId,
  });
  if (res && res._conflict) {
    const e = new Error('the server value moved again');
    e.name = 'ConflictError';
    throw e;
  }
  return res;
}

window.HQConflictNotice = {
  // Exposed so a store can be INJECTED — by tests/states-sync-rxdb-conflict-notice.spec.js
  // today, and by `sync-hard-cutover` tomorrow when it has a real RxDB database
  // to hand over. A screen whose producer is not switched on yet can only be
  // verified by seeding it, and seeding it needs a seam.
  createMemoryStore: createMemoryConflictStore,
  mount(opts) {
    const o = opts || {};
    return mountConflictNotice({
      bannerRoot,
      sheetRoot,
      store: o.store || defaultStore(),
      applyRestore: o.applyRestore || applyRestore,
      copyValue: o.copyValue || ((t) => (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.resolve())),
      openChecklist: o.openChecklist || (() => { sheetRoot.style.display = 'none'; }),
      modelOpts: o.modelOpts || {},
    });
  },
};
// Mounted eagerly so the banner is live the moment a record exists. Fails soft
// for the same reason bootstrap.js does: nothing on this page depends on it.
try { window.HQConflictNotice.instance = window.HQConflictNotice.mount(); }
catch (err) { console.warn('[hq-sync] conflict notice did not mount; the page is unaffected', err); }
</script>

-->
<div id="sync-one-row" hidden data-source="rxdb" data-state="idle"
     style="margin:16px auto 32px;max-width:480px;padding:12px;border:1px dashed var(--brd,#ccc);border-radius:8px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt,#222)">
  <div style="opacity:.6;margin-bottom:6px">hq-sync · one row, served from RxDB (dev)</div>
  <div>id: <span id="sync-one-row-id"></span></div>
  <div>field: <span id="sync-one-row-field"></span></div>
  <div>value: <span id="sync-one-row-value"></span></div>
  <div id="sync-one-row-note" style="opacity:.6;margin-top:6px"></div>
</div>
<script type="module">
// The SAME module instance the <head> tag loaded — an ES module URL is
// evaluated once per document, so this import re-uses it rather than
// constructing a second client.
import HQSync from './sync-rxdb/bootstrap.js';

const root = document.getElementById('sync-one-row');

function setState(state, note) {
  root.setAttribute('data-state', state);
  document.getElementById('sync-one-row-note').textContent = note || '';
}

(async function mountOneRow() {
  // 🛑 THE FLAG GATE, FIRST AND SYNCHRONOUS. With it off we return before
  // touching HQSync.openSyncScope, so nothing here begins async database
  // creation — C1's B-88 guard (window.HQSync.db undefined at end of load, no
  // /rxdb|hq_sync/i IndexedDB database) stays green by construction, not by
  // timing. `openSyncScope()` refuses synchronously as well; both, deliberately.
  if (!HQSync.readEnabled) return;

  const q = new URLSearchParams(location.search);
  const checklistId = q.get('hq_sync_checklist');
  const templateId = q.get('hq_sync_template');
  const fieldId = q.get('hq_sync_field');
  // 🛑 REQUIRED since C3 (C2's G6 finding F-2) — the fill scope's identity.
  const userId = q.get('hq_sync_user');
  // A flag with no scope is not a scope. Replication is per-open-checklist and
  // is never pulled whole (ledger T-29 decision 105), so an absent scope mounts
  // nothing rather than defaulting to something wider.
  if (!checklistId || !templateId || !fieldId || !userId) return;

  root.hidden = false;
  document.getElementById('sync-one-row-field').textContent = fieldId;
  setState('opening', 'starting replication for this checklist scope…');

  let handle;
  try {
    handle = await HQSync.openSyncScope({ userId, checklistId, templateId, fieldIds: [fieldId] });
  } catch (err) {
    // Fails soft, for bootstrap.js's own reason: a dev surface that broke the
    // crew's checklist page would be strictly worse than no dev surface.
    setState('error', String((err && err.message) || err));
    return;
  }

  setState('waiting', 'replication live; waiting for the row…');

  // 🛑 THE READ. This is the ONLY source this panel has — one RxDB collection,
  // no REST fallback, no cached response body. If the row is on screen it came
  // out of `db.responses`, which is what makes "RxDB-served" a claim the DOM can
  // be checked against rather than an assertion in a document.
  handle.db.responses
    .findOne({ selector: { field_id: fieldId } })
    .$.subscribe((doc) => {
      if (!doc) return;
      document.getElementById('sync-one-row-id').textContent = doc.id;
      document.getElementById('sync-one-row-value').textContent = JSON.stringify(doc.value);
      setState('served', 'read from RxDB (collection `responses`).');
    });
})();
</script>
</body>
</html>
