<style>
/* Five variables added by `sync-rxdb-conflict-notice-ui` (C2) — the ok pair, the
   bad pair and skel. The signed mockup's palette needs a success colour (a
   restored row), a destructive one (a struck-through server value, the
   storage-error card) and a skeleton fill. Same values as the mockup's shared
   block, so the plates and the page cannot drift apart. */
:root{--bg:#f5f5f3;--card:#fff;--txt:#1a1a1a;--mut:#6b6b6b;--brd:rgba(0,0,0,0.08);--info-bg:#e6f1fb;--info-tx:#0c447c;--warn-bg:#faeeda;--warn-tx:#854f0b;--ok-bg:#dcfce7;--ok-tx:#166534;--bad-bg:#fee2e2;--bad-tx:#991b1b;--skel:rgba(0,0,0,0.07)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#262626;--txt:#f0f0f0;--mut:#999;--brd:rgba(255,255,255,0.1);--info-bg:#0c447c;--info-tx:#b5d4f4;--warn-bg:#633806;--warn-tx:#fac775;--sync-highlight:rgba(96,165,250,0.25);--ok-bg:#14532d;--ok-tx:#86efac;--bad-bg:#7f1d1d;--bad-tx:#fca5a5;--skel:rgba(255,255,255,0.09)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.app{max-width:480px;margin:0 auto;padding-top:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--info-tx);text-decoration:none;font-size:16px;font-weight:500;margin-bottom:12px;cursor:pointer;min-height:44px;padding:4px 8px 4px 0;-webkit-tap-highlight-color:transparent}
.back::before{content:'‹';font-size:20px;line-height:1;margin-top:-1px}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:none;padding:10px;font-size:13px;border-radius:7px;background:transparent;color:var(--txt);font-weight:500}
.tabs button.on{background:var(--info-bg);color:var(--info-tx)}
.card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px}
.hd{padding:14px 16px;border-bottom:0.5px solid var(--brd)}
.hd h1{font-size:15px;font-weight:500;margin:0}
.sub{font-size:12px;color:var(--mut);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.cat{position:sticky;top:0;background:var(--bg);padding:6px 16px;font-size:12px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px;z-index:1}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid var(--brd)}
.row:last-child{border-bottom:none}
.row .nm{font-size:14px}
.row .mt{font-size:12px;color:var(--mut)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.4px}
.field input,.field select{width:100%;padding:11px 12px;background:var(--bg);border:0.5px solid var(--brd);border-radius:8px;font-size:14px;color:var(--txt);font-family:inherit;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--info-tx)}
.btn-primary{width:100%;padding:12px;background:var(--info-bg);color:var(--info-tx);border:none;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;margin-bottom:10px;cursor:pointer}
.btn-primary:active{opacity:0.8}
.btn-secondary{width:100%;padding:11px;background:transparent;color:var(--mut);border:0.5px solid var(--brd);border-radius:8px;font-size:13px;font-weight:500;font-family:inherit;margin-bottom:8px;cursor:pointer}
.btn-danger{width:100%;padding:11px;background:transparent;color:#c0392b;border:0.5px solid #c0392b;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid var(--brd)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .lbl{font-size:13px;font-weight:500}
.toggle-row .sub{font-size:11px;color:var(--mut);margin-top:1px}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--brd);border-radius:24px;transition:background .2s}

.sec-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg);font-size:12px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px}

.field-type-picker .row{cursor:pointer}

.skip-logic-row select:focus{border-color:var(--info-tx)}
.meta-card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}

.fill-field{padding:12px 16px;border-bottom:0.5px solid var(--brd)}

.sub-step-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 12px 24px;border-bottom:0.5px solid var(--brd)}
.sub-step-row:last-child{border-bottom:none}
.sub-step-label-text{font-size:13px;flex:1}

.submit-confirm{display:block;text-align:center;font-size:14px;color:var(--mut);margin-top:8px}

/* ═══ OVERWRITTEN ANSWERS — the conflict banner + sheet ══════════════════════
   Card `sync-rxdb-conflict-notice-ui` (overnight-20260801, C2). Ledger T-22
   decision 50 (the user-visible half), T-26 82 (A-1, A-2), T-28 95/96/97.

   Lifted from the SIGNED mockup at
   `.planning/phases/sync-rxdb-conflict-notice/mockup.html` revision 2, class
   names unchanged ON PURPOSE — the mockup and the implementation are compared
   plate against screenshot, and renaming everything on the way in would make
   that comparison a translation exercise.

   Three properties in here are load-bearing rather than cosmetic and are named
   because the first draft of the mockup broke on the third:
     * nothing is `nowrap` and nothing is ellipsised on a banner line — a line
       that does not fit must WRAP and grow the banner (A-1's PARK trigger);
     * every interactive control is a >=44px target in both dimensions,
       including Undo, which is the only escape from a mis-tapped Restore and
       is deliberately a bordered control rather than an inline text link;
     * the value is WRAPPED, never truncated. A fixed 88px label column inside a
       `display:flex` row needs all three of `min-width:0` on the row, the same
       on the value, and `overflow-wrap:anywhere` on the value — a flex item's
       default `min-width:auto` refuses to shrink below its longest unbreakable
       word, and a pasted 90-character reference is a real free-text answer. */
#conflict-sheet{position:fixed;inset:0;z-index:9998;overflow-y:auto;background:var(--bg);padding:12px}
#conflict-sheet .sc-sheet{max-width:480px;margin:0 auto}
.sc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:44px}
.sc-title{font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sc-close{font-size:14px;color:var(--info-tx);font-weight:600;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;flex-shrink:0;cursor:pointer}
.cn-banner{display:flex;align-items:flex-start;gap:10px;background:var(--warn-bg);color:var(--warn-tx);border-radius:12px;padding:12px 14px;margin-bottom:12px;min-height:44px}
.cn-banner-ico{font-size:17px;line-height:1.25;flex-shrink:0}
.cn-banner-body{flex:1;min-width:0}
.cn-banner-hd{display:block;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}

<!-- ══ RxDB sync layer — IMPORT + CONSTRUCTION ONLY ══════════════════════════
     Card `sync-rxdb-replication-and-conflict-handler` (overnight-20260801, C1).

     This is the line decision 59 was waiting for: a production page finally
     IMPORTS `vendor/rxdb.bundle.js`, which is what earns the bundle its
     `globPatterns` precache entry in build-sw.js — and which is why
     backend/Dockerfile copies `vendor/` and `sync-rxdb/` into the image in the
     SAME change set. A precached URL that 404s fails the ENTIRE service-worker
     install for every returning client.

     🛑 NO WRITE PATH IS SWAPPED HERE. `debouncedSaveField` ->
     `submitOp('SET_FIELD')` -> POST /ops -> DRAFT_RESPONSES ->
     hydrateFieldState is untouched and remains the live persistence path
     (CLAUDE.md's Workflows Data Persistence Rule). This comment used to name
     `autoSaveField` -> POST /saveResponse; neither half was true — the function
     is defined nowhere and the frontend posts no /saveResponse (B-65). The swap is
     `sync-hard-cutover`. sync-rxdb/bootstrap.js constructs the client and
     nothing else: it creates no RxDB database, starts no replication, and makes
     no network request — the /sync door answers 503 until HQ_SYNC_REST_URL is
     set, which must not happen until row-visibility RLS lands.

     `defer`-equivalent by nature: a module script does not block parsing, and
     bootstrap.js fails soft, so nothing on this page depends on it loading.
-->
<script type="module" src="sync-rxdb/bootstrap.js"></script>

<script>
// ─── Per-field debounced save using submitOp (D-08) ──────────────────────────

const FIELD_DEBOUNCE = {};

// ─── Unsaved-field state ─────────────────────────────────────────────────────
// A field whose SET_FIELD op did not reach the server (no signal, or a server
// error). The answer is NOT thrown away and NOT quietly presented as saved: it
// stays counted in progress, is written to draftResponses so reopening the
// checklist restores it (hydrateFieldState reads drafts), carries a visible
// "Unsaved" mark, and is retried on reconnect.
//
// 🛑 VOCABULARY — this chip and sync.js's row badge are two different states and
// must never read the same (ledger T-25 decision 71, item 4; they both read
// "Pending sync" between 2026-07-28 and this card and were reachable on the same
// screen):
//
//   "Unsaved"          — ONE field answer has not reached the server.
//                        Scope: a field. Class `.unsaved-mark`, this file.
//   "Queued"           — a WHOLE submitted checklist is sitting in the offline
//                        submitQueue waiting to be sent.
//                        Scope: a checklist. Class `.sync-badge`, sync.js.
//
// The names are chosen so the scope is readable without the legend: a field is
// "unsaved"; a submission you already pressed Submit on is "queued". If either
// string changes, change the other so they still cannot collide.
//
// LIMIT, stated so nobody over-reads this: the draft store is in memory
// (sync.js `new Store()`), so a reload or app kill while still offline loses
// the queue. Durable survival needs SET_FIELD ops in the IndexedDB queue that
// today holds submissions only (sync.js:51) — that is the separate card.
const PENDING_SYNC = new Set();
const PENDING_VALUES = {};
let _pendingRetryTimer = null;
let _pendingToastTimer = null;

function debouncedSaveField(fieldId, value) {
  if (FIELD_DEBOUNCE[fieldId]) { clearTimeout(FIELD_DEBOUNCE[fieldId]); updateSaveStatus(-1); }
  updateSaveStatus(1);
  FIELD_DEBOUNCE[fieldId] = setTimeout(async () => {
    FIELD_DEBOUNCE[fieldId] = null;
    const indicator = document.querySelector(`[data-field-id="${fieldId}"] .save-indicator`);
    try {
      var saveValue = value;
      var fn = store.get('failNotes', fieldId);
      var cp = CORRECTION_PHOTOS[fieldId];
      if ((fn && (fn.note || fn.severity || fn.photo)) || cp) {
        saveValue = { _v: value };
        if (fn && (fn.note || fn.severity || fn.photo)) saveValue._fail_note = { note: fn.note, severity: fn.severity, photo: fn.photo || null };
        if (cp) saveValue._correction_photo = cp;
      }
      const result = await submitOp('SET_FIELD', fieldId, 'field_response', { value: saveValue, field_id: fieldId });
      if (result && result._conflict) {
        // LWW loss (FR-9, INV-1): the DB rejected our optimistic value. Converge
        // the rendered field to the WINNING value so the screen never keeps
        // showing a value the DB rejected. The 409 body carries the winning op
        // (`winner.payload` — same {field_id, value, ...} shape our own SET_FIELD
        // uses), so apply it through the exact path a live remote op takes: the
        // loser converges identically to every observer. Silent — we surface our
        // own "Conflict resolved" toast below instead of applyOp's "updated by".
        // api() (sync.js:26-28) returns { _conflict, winner: <409-body> } and the
        // body itself is { _conflict, winner: { device_id, lamport_ts, payload } },
        // so the winning-op descriptor is nested one level in. Tolerate either
        // shape defensively.
        const body = result.winner || {};
        const winner = body.winner || body;
        if (winner.payload && typeof winner.payload === 'object') {
          applyOp({
            op_type: 'SET_FIELD',
            device_id: winner.device_id,
            lamport_ts: winner.lamport_ts,
            server_ts: new Date().toISOString(),
            payload: winner.payload,
          }, true);
        } else {
          // Defensive: winning value absent from the body — re-fetch the
          // checklist's current field state via the existing mechanism and
          // re-render so the rejected optimistic value cannot survive.
          await loadMyChecklists();
        }
        renderFieldResponse(fieldId);
        flashField(fieldId);
        enqueueSyncToast(null, 'Conflict resolved', [fieldId]);
        updateSaveStatus(-1);
        return;
      }
      var drafts = store.get('draftResponses');
      if (saveValue === null || saveValue === undefined) {
        var idx = drafts.findIndex(function(d) { return d.field_id === fieldId; });
        if (idx !== -1) drafts.splice(idx, 1);
      } else {
        var existing = drafts.find(function(d) { return d.field_id === fieldId; });
        if (existing) { existing.value = saveValue; existing.answered_at = new Date().toISOString(); }
        else drafts.push({ field_id: fieldId, value: saveValue, answered_at: new Date().toISOString() });
      }
      store._notify('draftResponses');
      if (indicator) { indicator.textContent = 'Saved'; indicator.className = 'save-indicator saved'; setTimeout(() => { indicator.textContent = ''; indicator.className = 'save-indicator'; }, 800); }
      clearFieldPending(fieldId);
    } catch (e) {
      if (e && e.error === 'unknown_field') {
        // Field was cut from the template by an edit (FR-3, INV-4). No optimistic
        // checkmark survives a rejected save — drop the optimistic state and
        // re-render so the field visibly returns to not-saved.
        store.delete('fieldResponses', fieldId);
        var drafts3 = store.get('draftResponses');
        if (Array.isArray(drafts3)) {
          var di = drafts3.findIndex(function(d) { return d.field_id === fieldId; });
          if (di !== -1) { drafts3.splice(di, 1); store._notify('draftResponses'); }
        }
        renderFieldResponse(fieldId);
        clearFieldPending(fieldId);
        if (typeof fillState !== 'undefined' && fillState.activeTemplate && typeof updateProgress === 'function') updateProgress();
        showSyncToast('That field was removed from this checklist — your change was not saved.');
      } else {
        markFieldPending(fieldId, value, saveValue);
      }
    }
    updateSaveStatus(-1);
  }, 400);
}

// markFieldPending — the save did not reach the server. Keep the answer (it is
// real work the crew did), record it as a draft so reopening restores it rather
// than clearing it, say so on the field, and arrange a retry.
//
// `value` is the raw answer (re-bundled with fail notes on retry); `saveValue`
// is the bundled shape the success path writes to drafts, so a pending draft
// and a saved draft are byte-identical and hydrate through the same branch.
function markFieldPending(fieldId, value, saveValue) {
  PENDING_SYNC.add(fieldId);
  PENDING_VALUES[fieldId] = value;
  var drafts = store.get('draftResponses');
  if (Array.isArray(drafts)) {
    var idx = drafts.findIndex(function(d) { return d.field_id === fieldId; });
    if (saveValue === null || saveValue === undefined) {
      if (idx !== -1) drafts.splice(idx, 1);
    } else if (idx !== -1) {
      drafts[idx].value = saveValue;
      drafts[idx].answered_at = new Date().toISOString();
    } else {
      drafts.push({ field_id: fieldId, value: saveValue, answered_at: new Date().toISOString() });
    }
    store._notify('draftResponses');
  }
  paintPendingMark(fieldId);
  if (typeof updateProgress === 'function') updateProgress();
  queuePendingToast();
  schedulePendingRetry();
}

function clearFieldPending(fieldId) {
  PENDING_SYNC.delete(fieldId);
  delete PENDING_VALUES[fieldId];
  const mark = document.querySelector(`[data-field-id="${fieldId}"] .unsaved-mark`);
  if (mark) mark.remove();
  if (typeof updateProgress === 'function') updateProgress();
}

// Painted imperatively at failure time (the row is deliberately NOT re-rendered
// — that would drop the caret out of a textarea mid-typing). renderRunnerField
// re-emits the mark from PENDING_SYNC, so it also survives a full re-render.
function paintPendingMark(fieldId) {
  const row = document.querySelector(`[data-field-id="${fieldId}"]`);
  if (!row || row.querySelector('.unsaved-mark')) return;
  const mark = document.createElement('span');
  mark.className = 'unsaved-mark';
  mark.textContent = 'Unsaved';
  row.appendChild(mark);
}

// One message per failure burst — two fields failing 40ms apart is one event to
// the crew member, not two.
function queuePendingToast() {
  if (_pendingToastTimer) return;
  _pendingToastTimer = setTimeout(function() {
    _pendingToastTimer = null;
    showToast(navigator.onLine
      ? 'Save didn’t go through — retrying.'
      : 'Saved on this device — will sync when you’re back online.');
  }, 300);
}

function retryPendingFields() {
  if (!PENDING_SYNC.size || !navigator.onLine) return;
  Array.from(PENDING_SYNC).forEach(function(fieldId) {
    debouncedSaveField(fieldId, PENDING_VALUES[fieldId]);
  });
}

// Reconnect is the main trigger; the timer covers a server-side failure while
// online, where no 'online' event will ever fire.
function schedulePendingRetry() {
  if (_pendingRetryTimer || !PENDING_SYNC.size) return;
  _pendingRetryTimer = setTimeout(function() {
    _pendingRetryTimer = null;
    retryPendingFields();
    schedulePendingRetry();
  }, 15000);
}

window.addEventListener('online', retryPendingFields);

function renderSkeletons(container, count) {
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const row = document.createElement('div');
    row.className = 'skeleton-row';
    row.innerHTML = '<div class="skeleton skeleton-bar"></div><div class="skeleton skeleton-bar short"></div>';
    container.appendChild(row);
  }
}

function renderError(container, message, retryFn) {
  const div = document.createElement('div');
  div.className = 'inline-error';
  div.innerHTML = message + ' <button class="retry-btn" aria-label="Retry">Retry</button>';
  div.querySelector('.retry-btn').onclick = retryFn;
  container.appendChild(div);
}

// ─── Module-level API state ───────────────────────────────────────────────────

// Register all workflow state collections in the reactive store
store.register({
  myChecklists: [],
  mySubmissions: [],
  draftResponses: [],
  fieldResponses: {},
  failNotes: {},
  pending: [],
  templates: [],
});

// Convenience aliases — reads from store, keeps existing code working
let MY_CHECKLISTS = store.get('myChecklists');
let MY_SUBMISSIONS = store.get('mySubmissions');
let DRAFT_RESPONSES = store.get('draftResponses');
const FIELD_RESPONSES = store.get('fieldResponses');

async function loadTemplates() {
  const container = document.getElementById('builder-list');
  if (!container) return;
  if (TEMPLATES && TEMPLATES.length > 0) renderBuilderList();
  else renderSkeletons(container, 3);
  try {
    store.setAll('templates', (await api('GET', 'templates')).map(fromApiTemplate));
    TEMPLATES = store.get('templates');
    // subscriber handles renderBuilderList
  } catch (e) {
    container.innerHTML = '';
    renderError(container, "Couldn't load templates.", () => loadTemplates());
  }
}

async function loadMyChecklists() {
  const container = document.getElementById('checklist-list');
  if (MY_CHECKLISTS && MY_CHECKLISTS.length > 0) { if (!fillState.activeTemplate && container) renderMyChecklists(); }
  else if (container) renderSkeletons(container, 3);
  try {
    const data = await api('GET', 'myChecklists?dow=' + new Date().getDay());
    store.batch(function() {
      store.setAll('myChecklists', (data.templates || []).map(function(t) {
        if (!t.sections) t.sections = [];
        t.sections.forEach(function(s) { if (!s.fields) s.fields = []; });
        return t;
      }));
      store.setAll('mySubmissions', data.submissions || []);
      store.setAll('draftResponses', data.drafts || []);
    });
    MY_CHECKLISTS = store.get('myChecklists');
    MY_SUBMISSIONS = store.get('mySubmissions');
    DRAFT_RESPONSES = store.get('draftResponses');
    hydrateFieldState();
    // Re-render with fresh MY_SUBMISSIONS data (subscriber fires before hydrateFieldState)
    if (!fillState.activeTemplate && container) renderMyChecklists();
    // If runner is open, update the stale activeTemplate reference and re-render
    if (fillState.activeTemplate) {
      var updated = MY_CHECKLISTS.find(function(t) { return t.id === fillState.activeTemplate.id; });
      if (updated) fillState.activeTemplate = updated;
      var tplFieldIds = new Set((fillState.activeTemplate.sections || []).flatMap(function(s) { return (s.fields || []).flatMap(function(f) { return [f.id].concat((f.sub_steps || []).map(function(ss) { return ss.id; })); }); }));
      hydrateFieldState(tplFieldIds);
      var fillBody = document.getElementById('fill-body');
      if (fillBody) fillBody.innerHTML = renderRunner();
    }
  } catch (e) {
    console.error('loadMyChecklists error:', e);
    if (container) { container.innerHTML = ''; renderError(container, "Couldn't load checklists.", () => loadMyChecklists()); }
  }
}

async function loadPendingApprovals() {
  const container = document.getElementById('approvals-list');
  if (!container) return;

  else renderSkeletons(container, 3);

}

function fireworks(){
  var canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;pointer-events:none';
  canvas.width=window.innerWidth*2;canvas.height=window.innerHeight*2;
  document.body.appendChild(canvas);
  var ctx=canvas.getContext('2d');
  ctx.scale(2,2);
  var W=window.innerWidth,H=window.innerHeight;
  var particles=[];
  var colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6eb4','#a66cff','#ff9f43','#00d2d3'];
  function burst(x,y){
    for(var i=0;i<40;i++){
      var angle=Math.random()*Math.PI*2;
      var speed=2+Math.random()*5;
      particles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:colors[Math.floor(Math.random()*colors.length)],size:2+Math.random()*3,gravity:0.06+Math.random()*0.04});
    }
  }
  // Launch 5 bursts with staggered timing
  burst(W*0.5,H*0.3);
  setTimeout(function(){burst(W*0.25,H*0.4)},200);
  setTimeout(function(){burst(W*0.75,H*0.35)},350);
  setTimeout(function(){burst(W*0.4,H*0.25)},500);
  setTimeout(function(){burst(W*0.6,H*0.45)},650);
  var frame;
  function animate(){
    ctx.clearRect(0,0,W,H);
    var alive=false;
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      if(p.life<=0)continue;
      alive=true;
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;
      p.life-=0.015;p.vx*=0.99;
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.size*p.life),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(alive){frame=requestAnimationFrame(animate)}
    else{cancelAnimationFrame(frame);canvas.remove()}
  }
  animate();
}

function openCamera(onCapture) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.style.cssText = 'position:fixed;top:-100px;left:-100px;opacity:0;pointer-events:none';
  document.body.appendChild(inp);
  var cleanup = setTimeout(function() { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 30000);
  inp.addEventListener('change', function() {
    clearTimeout(cleanup);
    var file = inp.files && inp.files[0];
    if (inp.parentNode) inp.parentNode.removeChild(inp);
    if (file) onCapture(file);
  });
  inp.click();
}

let state = {
  view: 'list',
  activeTemplate: null,
  originalTemplate: null,
  expandedField: null,
  fieldPickerSection: null
};
function wfBuilderHasUnsavedChanges() {
  if (!state.activeTemplate) return false;
  if (!state.originalTemplate) return true;
  return JSON.stringify(state.activeTemplate) !== JSON.stringify(state.originalTemplate);
}

// wfCollectFieldIds walks a template's sections → fields (+ sub-steps) and
// returns every field id it contains.
function wfCollectFieldIds(tpl) {
  var ids = [];
  (tpl && tpl.sections || []).forEach(function(sec) {
    (sec.fields || []).forEach(function(f) {
      if (f.id) ids.push(f.id);
      (f.sub_steps || []).forEach(function(s) { if (s.id) ids.push(s.id); });
    });
  });
  return ids;
}

// A persisted field carries a real UUID; a freshly-added Builder field carries a
// generated `fld_…` id and can never hold a crew draft, so only UUIDs matter.
function wfIsPersistedId(id) { return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id); }

// wfDestructiveSaveCheck (INV-6, §4/§5) diffs the edited template against the
// loaded original to decide whether the pending save is destructive: it CUTS a
// persisted field, or its schedule DROPS today. Returns the set of field ids
// whose crew drafts would be discarded (the removed fields, or — when today is
// dropped — every persisted field, since the whole checklist leaves the device),
// plus a dropsToday flag. An empty checkIds set means the save needs no warning
// (INV-1 non-destructive branch, incl. the §5 corollary of ADDING a day).
function wfDestructiveSaveCheck() {
  if (!state.originalTemplate) return { checkIds: [], dropsToday: false };
  var origIds = wfCollectFieldIds(state.originalTemplate).filter(wfIsPersistedId);
  var editSet = {};
  wfCollectFieldIds(state.activeTemplate).forEach(function(id) { editSet[id] = 1; });
  var removed = origIds.filter(function(id) { return !editSet[id]; });
  var dow = new Date().getDay();
  var oDays = state.originalTemplate.active_days || [];
  var nDays = state.activeTemplate.active_days || [];
  var dropsToday = oDays.indexOf(dow) !== -1 && nDays.indexOf(dow) === -1;
  // Dropping today discards ALL of today's answers on the checklist; a plain cut
  // discards only the removed fields'.
  var checkIds = dropsToday ? origIds : removed;
  return { checkIds: checkIds, dropsToday: dropsToday };
}

function generateId(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
}

function getDefaultConfig(type) {
  if (type === 'temperature') return { unit: '°F', min: 0, max: 500 };
  if (type === 'photo') return {};
  return {};
}

function createNewTemplate() {
  return {
    id: generateId('tpl'),
    name: '',
    active_days: null,
    requires_approval: true,
    assigned_to: { roles: ['team_member'], users: [] },
    approver: { roles: ['manager'], users: [] },
    sections: []
  };
}

// Transform frontend template shape to backend API shape for save
function toApiTemplate(tpl) {
  // Ensure sub-steps have type set (defaults to checkbox)
  (tpl.sections || []).forEach(function(sec) {
    (sec.fields || []).forEach(function(fld) {
      (fld.sub_steps || []).forEach(function(s) { if (!s.type) s.type = 'checkbox'; });
    });
  });
  var out = { name: tpl.name, requires_approval: !!tpl.requires_approval, sections: tpl.sections };
  var assignments = [];
  if (tpl.assigned_to) {
    (tpl.assigned_to.roles || []).forEach(function(r){ assignments.push({ assignee_type: 'role', assignee_id: r, assignment_role: 'assignee' }); });
    (tpl.assigned_to.users || []).forEach(function(u){ assignments.push({ assignee_type: 'user', assignee_id: u, assignment_role: 'assignee' }); });
  }
  if (tpl.approver) {
    (tpl.approver.roles || []).forEach(function(r){ assignments.push({ assignee_type: 'role', assignee_id: r, assignment_role: 'approver' }); });
    (tpl.approver.users || []).forEach(function(u){ assignments.push({ assignee_type: 'user', assignee_id: u, assignment_role: 'approver' }); });
  }
  out.assignments = assignments;
  if (tpl.active_days && tpl.active_days.length) {
    out.schedules = [{ active_days: tpl.active_days }];
  }
  return out;
}

// Transform backend API template to frontend shape after load
function fromApiTemplate(t) {
  if (!t.sections) t.sections = [];
  t.sections.forEach(function(s) { if (!s.fields) s.fields = []; });
  t.assigned_to = { roles: [], users: [] };
  t.approver = { roles: [], users: [] };
  (t.assignments || []).forEach(function(a) {
    var bucket = a.assignment_role === 'approver' ? t.approver : t.assigned_to;
    var list = a.assignee_type === 'role' ? bucket.roles : bucket.users;
    if (list.indexOf(a.assignee_id) === -1) list.push(a.assignee_id);
  });
  t.active_days = null;
  if (t.schedules && t.schedules.length) {
    t.active_days = t.schedules[0].active_days || null;
  }
  return t;
}

function createNewSection(title) {
  return {
    id: generateId('sec'),
    title: title,
    order: state.activeTemplate ? state.activeTemplate.sections.length : 0,
    condition: null,
    fields: []
  };
}

function createNewField(type) {
  const field = {
    id: generateId('fld'),
    type: type,
    label: '',
    required: false,
    order: 0,
    config: getDefaultConfig(type),
    fail_trigger: null,
    corrective_action: null,
    condition: null
  };
  if (type === 'temperature') {
    field.fail_trigger = { type: 'out_of_range', min: 0, max: 500 };
    field.corrective_action = { label: 'Corrective action taken', type: 'text', required: true };
  }
  return field;
}

function renderBuilder() {
  const body = document.getElementById('builder-body');
  if (!body) return;
  if (state.view === 'list') {
    // Check admin/superadmin restriction (D-11)
    var isAdmin = CURRENT_USER && ((CURRENT_USER.roles||[]).includes('admin') || (CURRENT_USER.roles||[]).includes('superadmin') || CURRENT_USER.is_superadmin);
    if (!isAdmin) {
      body.innerHTML = '<div id="builder-list"><div class="inline-error">' + ADMIN_RESTRICTED + '</div></div>';
      return;
    }
    body.innerHTML = '<div id="builder-list"></div>';
    renderBuilderList();
  } else {
    body.innerHTML = renderEditor();
  }
  if (state.view === 'editor') initSortable();
}

function renderBuilderList() {
  const container = document.getElementById('builder-list');
  if (!container) return;
  if (!TEMPLATES || TEMPLATES.length === 0) {
    container.innerHTML = '<div class="empty-state"><h2>' + EMPTY_BUILDER.h + '</h2><p>' + EMPTY_BUILDER.p + '</p></div>' +
      '<div style="padding:0 0 8px"><button class="btn-primary">+ New checklist</button></div>';
    return;
  }
  const rows = TEMPLATES.map(tpl => {
    const secCount = tpl.sections ? tpl.sections.length : 0;
    const secLabel = secCount === 1 ? '1 section' : secCount + ' sections';
    var assignLabel = tpl.assigned_to ? (tpl.assigned_to.roles.join(', ') + (tpl.assigned_to.users.length ? ' + ' + tpl.assigned_to.users.length + ' user(s)' : '')) : 'everyone';
    return `<div class="row" data-template-id="${tpl.id}" style="cursor:pointer"><div><div class="nm">${tpl.name || '(Untitled)'}</div><div class="mt">${secLabel} · assigned: ${assignLabel}</div></div></div>`;
  }).join('');
  container.innerHTML = `<div class="cat">Checklists</div>
<div class="card">${rows}</div>
<button class="btn-primary">+ New checklist</button>`;
}

function renderAssignmentPicker(assignment, prefix, label) {
  if (!assignment) assignment = { roles: [], users: [] };
  var rolesHtml = ALL_ROLES.map(function(r) {
    var on = assignment.roles.includes(r);
    return '<button class="day-chip ' + (on ? 'on' : '') + '" data-action="toggle-' + prefix + '-role" data-role="' + r + '">' + r + '</button>';
  }).join('');
  // Users list not loaded in this phase — role-based assignment only
  return '<div style="padding:10px 16px;border-bottom:0.5px solid var(--brd)">' +
    '<div class="lbl">' + label + '</div>' +
    '<div class="sub" style="margin-bottom:6px">By role</div>' +
    '<div class="day-chips-row">' + rolesHtml + '</div>' +
    '</div>';
}

  }).join('');
  return '<div style="padding:12px 16px;border-top:1px solid var(--brd)">' +

      <div class="field" style="flex:1">

      </div>
    </div>`;

    typeControls = `<div class="toggle-row" style="padding:10px 0;border:none">

        <div class="lbl">Required</div>
        <div class="sub">Crew must upload a photo before submitting</div>

               ${fld.required ? 'checked' : ''}

        <span class="slider"></span>
      </label>
    </div>`;
  }
  if (fld.type === 'checkbox') {
    var subs = fld.sub_steps || [];
    var subsHtml = subs.map(function(s, i) {
      return '<div style="display:flex;gap:8px;align-items:center;margin-top:6px">' +
        '<input type="text" class="sub-step-label" name="sub-' + fld.id + '-' + i + '" value="' + escapeAttr(s.label) + '" data-field-id="' + fld.id + '" data-section-id="' + secId + '" data-sub-idx="' + i + '" placeholder="Sub-step label" style="flex:1;padding:8px 10px;background:var(--bg);border:0.5px solid var(--brd);border-radius:8px;font-size:13px;color:var(--txt);font-family:inherit;outline:none">' +
        '<button class="field-delete" data-action="delete-sub-step" data-field-id="' + fld.id + '" data-section-id="' + secId + '" data-sub-idx="' + i + '" aria-label="Remove sub-step" style="font-size:14px">✕</button></div>';
    }).join('');
    typeControls = '<div style="margin-top:12px"><label style="display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.4px">SUB-STEPS</label>' +
      (subs.length > 0 ? subsHtml : '<div style="font-size:13px;color:var(--mut);margin-bottom:4px">No sub-steps</div>') +
      '<button data-action="add-sub-step" data-field-id="' + fld.id + '" data-section-id="' + secId + '" style="margin-top:8px;padding:6px 12px;background:var(--info-bg);color:var(--info-tx);border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer">+ Add sub-step</button></div>';
  }
  // yes_no, text: no type-specific controls beyond the label input
  return `<div class="field-settings">
    <div class="field">
      <label>LABEL</label>
      <input type="text" class="fld-label" name="fld-label-${fld.id}" value="${escapeAttr(fld.label)}"
             data-field-id="${fld.id}" data-section-id="${secId}"
             placeholder="Enter field label">
    </div>
    ${typeControls}
    ${renderDayChips(fld.condition && fld.condition.days ? fld.condition.days : null, fld.id, 'field', !!(fld.condition && fld.condition.days))}
    ${renderSkipLogic(fld, secId)}
  </div>`;
}

function renderField(fld, secId) {
  const isExpanded = state.expandedField === fld.id;
  return `<div class="field-row ${isExpanded ? 'expanded' : ''}" data-field-id="${fld.id}" data-section-id="${secId}">
    <span class="drag-handle" aria-label="Drag to reorder">☰</span>
    <span class="field-row-tap">${escapeHtml(fld.label || fld.type)}</span>
    <span class="field-type-pill">${fld.type.replace('_',' ')}</span>
    <button class="field-delete" aria-label="Delete field" data-field-id="${fld.id}" data-section-id="${secId}">✕</button>
    ${isExpanded ? renderFieldExpanded(fld, secId) : ''}
  </div>`;
}

function toggleFieldExpanded(fldId) {
  state.expandedField = state.expandedField === fldId ? null : fldId;
  renderBuilder();
}

function toggleFieldPicker(secId) {
  state.fieldPickerSection = state.fieldPickerSection === secId ? null : secId;
  renderBuilder();
}

function addField(secId, type) {
  const sec = state.activeTemplate.sections.find(s => s.id === secId);
  if (!sec) return;
  const field = createNewField(type);
  field.order = sec.fields.length;
  sec.fields.push(field);
  state.fieldPickerSection = null;
  state.expandedField = field.id;
  renderBuilder();
}

function deleteField(secId, fldId) {
  const sec = state.activeTemplate.sections.find(s => s.id === secId);
  if (!sec) return;
  sec.fields = sec.fields.filter(f => f.id !== fldId);
  sec.fields.forEach((f, i) => { f.order = i; });
  if (state.expandedField === fldId) state.expandedField = null;
  renderBuilder();
}

function updateField(secId, fldId, patch) {
  const sec = state.activeTemplate.sections.find(s => s.id === secId);
  const fld = sec.fields.find(f => f.id === fldId);
  Object.assign(fld, patch);
  // Do NOT call renderBuilder() for text input changes (causes cursor jump)
  // Only re-render for toggle changes
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escapeAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openEditor(tplId) {
  if (tplId) {
    state.activeTemplate = TEMPLATES.find(t => t.id === tplId) || null;
    if (!state.activeTemplate) return;
    // Deep copy to avoid mutating the source array while editing
    state.activeTemplate = JSON.parse(JSON.stringify(state.activeTemplate));
    state.originalTemplate = JSON.parse(JSON.stringify(state.activeTemplate));
  } else {
    state.activeTemplate = createNewTemplate();
    state.originalTemplate = null;
  }
  state.view = 'editor';
  renderBuilder();
}

function backToList() {
  if (wfBuilderHasUnsavedChanges() && !confirm('You have unsaved changes. Leave without saving?')) return;
  state.view = 'list';
  state.activeTemplate = null;
  state.originalTemplate = null;
  state.expandedField = null;
  state.fieldPickerSection = null;
  renderBuilder();
}

const DAYS = ['M','T','W','T','F','Sa','Su'];
const DAY_INDICES = [1, 2, 3, 4, 5, 6, 0]; // Mon=1, Tue=2, ..., Sat=6, Sun=0

function renderDayChips(activeDays, targetId, targetType, hasCustomDays) {
  const days = activeDays || [];
  const isCustom = targetType === 'section' ? (activeDays !== null) : !!hasCustomDays;
  const inheritLabel = targetType === 'section' ? 'Same as schedule' : 'When section is visible';
  return `
    <div class="field" style="margin-top:12px">
      <label>SHOW ON DAYS</label>
      <div style="margin-bottom:8px">
        <button class="day-inherit-btn ${!isCustom ? 'on' : ''}" data-target-id="${targetId}" data-target-type="${targetType}" data-action="inherit" style="padding:6px 12px;border-radius:8px;border:0.5px solid var(--brd);background:${!isCustom ? 'var(--info-bg)' : 'transparent'};color:${!isCustom ? 'var(--info-tx)' : 'var(--mut)'};font-size:12px;font-weight:500;margin-right:6px;cursor:pointer">${inheritLabel}</button>
        <button class="day-inherit-btn ${isCustom ? 'on' : ''}" data-target-id="${targetId}" data-target-type="${targetType}" data-action="custom" style="padding:6px 12px;border-radius:8px;border:0.5px solid var(--brd);background:${isCustom ? 'var(--info-bg)' : 'transparent'};color:${isCustom ? 'var(--info-tx)' : 'var(--mut)'};font-size:12px;font-weight:500;cursor:pointer">Custom days</button>
      </div>
      <div class="day-chips-row" ${!isCustom ? 'style="display:none"' : ''}>
        ${DAYS.map((label, i) => `
          <button class="day-chip ${days.includes(DAY_INDICES[i]) ? 'on' : ''}"
                  data-day="${DAY_INDICES[i]}" data-target-id="${targetId}"
                  data-target-type="${targetType}">${label}</button>
        `).join('')}
      </div>
    </div>`;
}

function getPrecedingFields(template, sectionId, fieldId) {
  const fields = [];
  for (const sec of template.sections) {
    for (const fld of sec.fields) {
      if (sec.id === sectionId && fld.id === fieldId) return fields;
      fields.push({ id: fld.id, label: fld.label || fld.type, type: fld.type, sectionTitle: sec.title });
    }
  }
  return fields;
}

function getValuesForFieldType(type) {
  if (type === 'checkbox') return [{value: true, label: 'Checked'}, {value: false, label: 'Unchecked'}];
  if (type === 'yes_no') return [{value: true, label: 'Yes'}, {value: false, label: 'No'}];
  if (type === 'text') return [{value: '', label: 'Empty'}, {value: '_notempty', label: 'Not empty'}];
  if (type === 'temperature') return [{value: '_in_range', label: 'In range'}, {value: '_out_of_range', label: 'Out of range'}];
  if (type === 'photo') return [{value: true, label: 'Uploaded'}, {value: false, label: 'Not uploaded'}];
  return [];
}

function renderSkipLogic(fld, secId) {
  const preceding = getPrecedingFields(state.activeTemplate, secId, fld.id);
  if (preceding.length === 0) return '';

  const selectedFieldId = fld.condition && fld.condition.field_id ? fld.condition.field_id : '';
  const selectedValue = fld.condition && fld.condition.value !== undefined ? fld.condition.value : '';

  const selectedField = preceding.find(f => f.id === selectedFieldId);
  const valueOptions = selectedField ? getValuesForFieldType(selectedField.type) : [];

  return `
    <div class="skip-logic-row">
      <label style="display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.4px">SHOW THIS FIELD ONLY WHEN</label>
      <select class="skip-field-select" data-field-id="${fld.id}" data-section-id="${secId}"
              style="width:100%;padding:11px 12px;background:var(--bg);border:0.5px solid var(--brd);border-radius:8px;font-size:14px;color:var(--txt);margin-bottom:8px">
        <option value="">select a field...</option>
        ${preceding.map(f => `<option value="${f.id}" ${f.id === selectedFieldId ? 'selected' : ''}>${escapeHtml(f.sectionTitle)}: ${escapeHtml(f.label)}</option>`).join('')}
      </select>
      ${selectedFieldId ? `
        <select class="skip-value-select" data-field-id="${fld.id}" data-section-id="${secId}"
                style="width:100%;padding:11px 12px;background:var(--bg);border:0.5px solid var(--brd);border-radius:8px;font-size:14px;color:var(--txt)">
          <option value="">select a value...</option>
          ${valueOptions.map(v => `<option value="${JSON.stringify(v.value).replace(/"/g, '&quot;')}" ${JSON.stringify(v.value) === JSON.stringify(selectedValue) ? 'selected' : ''}>${v.label}</option>`).join('')}
        </select>
      ` : ''}
      ${selectedFieldId ? `<button class="skip-clear" data-field-id="${fld.id}" data-section-id="${secId}" style="margin-top:8px;background:none;border:none;color:#c0392b;font-size:12px;cursor:pointer;padding:4px 0">Remove condition</button>` : ''}
    </div>`;
}

let sortableInstances = [];

function initSortable() {
  sortableInstances.forEach(s => s.destroy());
  sortableInstances = [];
  document.querySelectorAll('.field-list').forEach(el => {
    const secId = el.dataset.sectionId;
    sortableInstances.push(Sortable.create(el, {
      handle: '.drag-handle',
      animation: 150,
      onEnd(evt) {
        const sec = state.activeTemplate.sections.find(s => s.id === secId);
        const moved = sec.fields.splice(evt.oldIndex, 1)[0];
        sec.fields.splice(evt.newIndex, 0, moved);
        sec.fields.forEach((f, i) => f.order = i);
        // No re-render — SortableJS already moved the DOM node
      }
    }));
  });
}

function addSection() {
  const title = prompt('Section name:');
  if (title && title.trim()) {
    const sec = createNewSection(title.trim());
    state.activeTemplate.sections.push(sec);
    renderBuilder();
  }
}

function deleteSection(secId) {
  state.activeTemplate.sections = state.activeTemplate.sections.filter(s => s.id !== secId);
  renderBuilder();
}

function updateTemplateName(name) {
  state.activeTemplate.name = name;
}

function toggleApproval() {
  state.activeTemplate.requires_approval = !state.activeTemplate.requires_approval;
  renderBuilder();
}

// Event delegation — attached ONCE, not inside render
document.getElementById('builder-body').addEventListener('click', function(e) {
  // Template row -> open editor
  const tplRow = e.target.closest('[data-template-id]');
  if (tplRow && !e.target.closest('.sec-delete') && !e.target.closest('.field-delete') && !e.target.closest('.day-inherit-btn') && !e.target.closest('.day-chip')) {
    openEditor(tplRow.dataset.templateId);
    return;
  }

  // Editor back button
  if (e.target.closest('.editor-back')) {
    backToList();
    return;
  }

  // Delete section
  const secDelete = e.target.closest('.sec-delete');
  if (secDelete) {
    deleteSection(secDelete.dataset.sectionId);
    return;
  }

  // Add section
  if (e.target.closest('.add-section-btn')) {
    addSection();
    return;
  }

  // Add field — toggle field type picker
  const addFieldBtn = e.target.closest('.add-field-btn');
  if (addFieldBtn) {
    toggleFieldPicker(addFieldBtn.dataset.sectionId);
    return;
  }

  // Field type picker row — add field of selected type
  const pickerRow = e.target.closest('.field-type-picker .row');
  if (pickerRow) {
    addField(pickerRow.dataset.sectionId, pickerRow.dataset.type);
    return;
  }

  // Assignment toggle actions
  var assignAction = e.target.closest('[data-action^="toggle-assign-"]') || e.target.closest('[data-action^="toggle-approver-"]');
  if (assignAction && state.activeTemplate) {
    var act = assignAction.dataset.action;
    var tpl = state.activeTemplate;
    if (act === 'toggle-assign-role') {
      if (!tpl.assigned_to) tpl.assigned_to = { roles: [], users: [] };
      var role = assignAction.dataset.role;
      var idx = tpl.assigned_to.roles.indexOf(role);
      if (idx === -1) tpl.assigned_to.roles.push(role); else tpl.assigned_to.roles.splice(idx, 1);
    } else if (act === 'toggle-assign-user') {
      if (!tpl.assigned_to) tpl.assigned_to = { roles: [], users: [] };
      var uid = assignAction.dataset.userId;
      var idx = tpl.assigned_to.users.indexOf(uid);
      if (idx === -1) tpl.assigned_to.users.push(uid); else tpl.assigned_to.users.splice(idx, 1);
    } else if (act === 'toggle-approver-role') {
      if (!tpl.approver) tpl.approver = { roles: [], users: [] };
      var role = assignAction.dataset.role;
      var idx = tpl.approver.roles.indexOf(role);
      if (idx === -1) tpl.approver.roles.push(role); else tpl.approver.roles.splice(idx, 1);
    } else if (act === 'toggle-approver-user') {
      if (!tpl.approver) tpl.approver = { roles: [], users: [] };
      var uid = assignAction.dataset.userId;
      var idx = tpl.approver.users.indexOf(uid);
      if (idx === -1) tpl.approver.users.push(uid); else tpl.approver.users.splice(idx, 1);
    }
    renderBuilder();
    return;
  }

  // Day schedule toggle
  var dayToggle = e.target.closest('[data-action="toggle-day"]');
  if (dayToggle && state.activeTemplate) {
    var day = parseInt(dayToggle.dataset.day, 10);
    if (!state.activeTemplate.active_days) state.activeTemplate.active_days = [];
    var idx = state.activeTemplate.active_days.indexOf(day);
    if (idx === -1) state.activeTemplate.active_days.push(day); else state.activeTemplate.active_days.splice(idx, 1);
    renderBuilder();
    return;
  }

  // Sub-step actions (must be before generic field-delete)
  var subAction = e.target.closest('[data-action="add-sub-step"]') || e.target.closest('[data-action="delete-sub-step"]');
  if (subAction) {
    var fldId = subAction.dataset.fieldId;
    var secId = subAction.dataset.sectionId;
    var sec = state.activeTemplate.sections.find(function(s){return s.id===secId});
    var fld = sec ? sec.fields.find(function(f){return f.id===fldId}) : null;
    if (fld) {
      if (!fld.sub_steps) fld.sub_steps = [];
      if (subAction.dataset.action === 'add-sub-step') {
        fld.sub_steps.push({ id: generateId('sub'), type: 'checkbox', label: '' });
      } else {
        fld.sub_steps.splice(+subAction.dataset.subIdx, 1);
      }
      renderBuilder();
    }
    return;
  }

  // Delete field
  const fieldDelete = e.target.closest('.field-delete');
  if (fieldDelete) {
    deleteField(fieldDelete.dataset.sectionId, fieldDelete.dataset.fieldId);
    return;
  }

  // Tap field row to expand/collapse settings
  const fieldRowTap = e.target.closest('.field-row-tap');
  if (fieldRowTap) {
    const fieldRow = e.target.closest('.field-row');
    if (fieldRow) {
      toggleFieldExpanded(fieldRow.dataset.fieldId);
    }
    return;
  }

  // Skip logic — clear condition
  if (e.target.closest('.skip-clear')) {
    const btn = e.target.closest('.skip-clear');
    const fldId = btn.dataset.fieldId;
    const secId = btn.dataset.sectionId;
    const sec = state.activeTemplate.sections.find(s => s.id === secId);
    const fld = sec.fields.find(f => f.id === fldId);
    if (fld.condition) {
      delete fld.condition.field_id;
      delete fld.condition.operator;
      delete fld.condition.value;
      if (!fld.condition.days) fld.condition = null;
    }
    renderBuilder();
    return;
  }

  // Day inherit/custom toggle for fields
  if (e.target.closest('.day-inherit-btn')) {
    const btn = e.target.closest('.day-inherit-btn');
    const targetId = btn.dataset.targetId;
    const targetType = btn.dataset.targetType;
    const action = btn.dataset.action;
    if (targetType === 'section') {
      const sec = state.activeTemplate.sections.find(s => s.id === targetId);
      if (sec) {
        if (action === 'inherit') {
          sec.condition = null; // inherit from schedule
        } else {
          if (!sec.condition) sec.condition = { days: [] };
          else if (!sec.condition.days) sec.condition.days = [];
        }
      }
    } else {
      const sec = state.activeTemplate.sections.find(s =>
        s.fields.some(f => f.id === targetId));
      const fld = sec.fields.find(f => f.id === targetId);
      if (action === 'inherit') {
        if (fld.condition) { delete fld.condition.days; if (!fld.condition.field_id) fld.condition = null; }
      } else {
        if (!fld.condition) fld.condition = { days: [] };
        else if (!fld.condition.days) fld.condition.days = [];
      }
    }
    renderBuilder();
    return;
  }

  // Day chip toggle
  if (e.target.closest('.day-chip')) {
    const chip = e.target.closest('.day-chip');
    const dayIndex = +chip.dataset.day;
    const targetId = chip.dataset.targetId;
    const targetType = chip.dataset.targetType;

    if (targetType === 'section') {
      const sec = state.activeTemplate.sections.find(s => s.id === targetId);
      if (!sec.condition) sec.condition = { days: [] };
      const idx = sec.condition.days.indexOf(dayIndex);
      if (idx === -1) sec.condition.days.push(dayIndex);
      else sec.condition.days.splice(idx, 1);
      if (sec.condition.days.length === 0) sec.condition = null;
    } else {
      const sec = state.activeTemplate.sections.find(s =>
        s.fields.some(f => f.id === targetId));
      const fld = sec.fields.find(f => f.id === targetId);
      if (!fld.condition) fld.condition = { days: [] };
      else if (fld.condition.field_id) {
        // Already has skip logic — add days alongside
        if (!fld.condition.days) fld.condition.days = [];
      }
      const days = fld.condition.days || (fld.condition.days = []);
      const idx = days.indexOf(dayIndex);
      if (idx === -1) days.push(dayIndex);
      else days.splice(idx, 1);
      if (days.length === 0) delete fld.condition.days;
      if (!fld.condition.days && !fld.condition.field_id) fld.condition = null;
    }
    renderBuilder();
    return;
  }

  // Save template via API
  if (e.target.closest('#save-btn')) {
    var btn = e.target.closest('#save-btn');
    var tpl = state.activeTemplate;
    if (!tpl) return;
    var isNew = !TEMPLATES.find(function(t){return t.id===tpl.id});

    function doSaveTemplate() {
      btn.textContent = 'Saving\u2026';
      btn.disabled = true;
      var endpoint = isNew ? 'createTemplate' : ('updateTemplate/' + tpl.id);
      var method = isNew ? 'POST' : 'PUT';
      updateSaveStatus(1);
      api(method, endpoint, toApiTemplate(tpl)).then(function(result) {
        updateSaveStatus(-1);
        if (isNew && result && result.id) tpl.id = result.id;
        showToast('Checklist saved \u2713');
        state.view = 'list';
        state.activeTemplate = null;
        state.originalTemplate = null;
        state.expandedField = null;
        state.fieldPickerSection = null;
        renderBuilder();
        loadTemplates();
      }).catch(function(err) {
        updateSaveStatus(-1);
        btn.textContent = 'Save checklist';
        btn.disabled = false;
        if (err && err.status === 403) {
          showToast(ADMIN_RESTRICTED);
        } else if (err && err.error === 'requires_approver') {
          showToast('Select at least one approver when approval is required.');
        } else if (err && err.error === 'duplicate_name') {
          showToast('A checklist with this name already exists.');
        } else {
          showToast(navigator.onLine ? 'Save failed. Please try again.' : 'Save failed. Check your connection.');
        }
      });
    }

    // INV-6 / \u00a74-\u00a75: a save that CUTS a field or DROPS today from the schedule
    // discards other crew's unsubmitted answers. Warn the admin naming the count
    // and proceed only on explicit confirm \u2014 the INV-1 "loss is only ever a
    // warned operator action" branch. Non-destructive saves (incl. ADDING a day)
    // skip the check entirely.
    var destr = !isNew ? wfDestructiveSaveCheck() : { checkIds: [], dropsToday: false };
    if (destr.checkIds.length) {
      updateSaveStatus(1);
      api('GET', 'draftHolderCount?field_ids=' + destr.checkIds.join(',')).then(function(res) {
        updateSaveStatus(-1);
        var n = (res && res.count) || 0;
        if (n > 0) {
          var msg = destr.dropsToday
            ? n + ' crew have this open today \u2014 saving removes it from their devices and discards their unsubmitted answers. Save anyway?'
            : n + ' crew have unsubmitted answers on fields you\u2019re removing \u2014 saving discards them. Save anyway?';
          if (!confirm(msg)) return; // admin cancelled \u2014 abort the save
        }
        doSaveTemplate();
      }).catch(function() {
        // The warning is best-effort; a count failure must not block a save.
        updateSaveStatus(-1);
        doSaveTemplate();
      });
      return;
    }
    doSaveTemplate();
    return;
  }

  // Archive template (inline confirm)
  if (e.target.closest('[data-action="archive-confirm"]')) {
    var tplId = e.target.closest('[data-action="archive-confirm"]').dataset.tplId;
    updateSaveStatus(1);
    api('DELETE', 'archiveTemplate/' + tplId).then(function() {
      updateSaveStatus(-1);
      showToast('Template archived');
      state.view = 'list';
      state.activeTemplate = null;
      state.originalTemplate = null;
      state.expandedField = null;
      state.fieldPickerSection = null;
      renderBuilder();
      loadTemplates();
    }).catch(function() {
      updateSaveStatus(-1);
      showToast('Archive failed. Try again.');
    });
    return;
  }

  // Archive button — confirm via native dialog, then archive directly
  if (e.target.closest('[data-action="archive-template"]')) {
    var el = e.target.closest('[data-action="archive-template"]');
    var tplId = el.dataset.tplId;
    if (!confirm('Archive this checklist? Existing submissions will not be affected.')) return;
    updateSaveStatus(1);
    api('DELETE', 'archiveTemplate/' + tplId).then(function() {
      updateSaveStatus(-1);
      showToast('Template archived');
      state.view = 'list';
      state.activeTemplate = null;
      state.originalTemplate = null;
      state.expandedField = null;
      state.fieldPickerSection = null;
      renderBuilder();
      loadTemplates();
    }).catch(function() {
      updateSaveStatus(-1);
      showToast('Archive failed. Try again.');
    });
    return;
  }

  // New template button
  if (e.target.closest('.btn-primary') && state.view === 'list') {
    openEditor(null);
    return;
  }
});

// Input delegation — real-time field text updates without cursor jump
document.getElementById('builder-body').addEventListener('input', function(e) {
  const secId = e.target.dataset.sectionId;
  const fldId = e.target.dataset.fieldId;
  if (!secId || !fldId) return;

  if (e.target.classList.contains('fld-label')) {
    updateField(secId, fldId, { label: e.target.value });
    return;
  }

  if (e.target.classList.contains('sub-step-label')) {
    var sec = state.activeTemplate.sections.find(function(s){return s.id===secId});
    var fld = sec && sec.fields.find(function(f){return f.id===fldId});
    if (fld && fld.sub_steps && e.target.dataset.subIdx !== undefined) {
      fld.sub_steps[+e.target.dataset.subIdx].label = e.target.value;
    }
    return;
  }

  if (e.target.classList.contains('fld-temp-min')) {
    const sec = state.activeTemplate.sections.find(s => s.id === secId);
    const fld = sec && sec.fields.find(f => f.id === fldId);
    if (fld) {
      updateField(secId, fldId, {
        config: Object.assign({}, fld.config, { min: +e.target.value }),
        fail_trigger: fld.fail_trigger ? Object.assign({}, fld.fail_trigger, { min: +e.target.value }) : fld.fail_trigger
      });
    }
    return;
  }

  if (e.target.classList.contains('fld-temp-max')) {
    const sec = state.activeTemplate.sections.find(s => s.id === secId);
    const fld = sec && sec.fields.find(f => f.id === fldId);
    if (fld) {
      updateField(secId, fldId, {
        config: Object.assign({}, fld.config, { max: +e.target.value }),
        fail_trigger: fld.fail_trigger ? Object.assign({}, fld.fail_trigger, { max: +e.target.value }) : fld.fail_trigger
      });
    }
    return;
  }
});

// Change delegation — attached ONCE
document.getElementById('builder-body').addEventListener('change', function(e) {
  // Template name input
  if (e.target.id === 'tpl-name-input') {
    updateTemplateName(e.target.value);
    return;
  }

  // Requires approval toggle
  if (e.target.id === 'approval-toggle') {
    toggleApproval();
    return;
  }

  // Photo required toggle
  if (e.target.classList.contains('fld-photo-required')) {
    const secId = e.target.dataset.sectionId;
    const fldId = e.target.dataset.fieldId;
    if (secId && fldId) {
      updateField(secId, fldId, { required: e.target.checked });
      renderBuilder();
    }
    return;
  }

  // Skip logic — field selector
  if (e.target.classList.contains('skip-field-select')) {
    const select = e.target;
    const fldId = select.dataset.fieldId;
    const secId = select.dataset.sectionId;
    const sec = state.activeTemplate.sections.find(s => s.id === secId);
    const fld = sec.fields.find(f => f.id === fldId);
    if (select.value) {
      if (!fld.condition) fld.condition = {};
      fld.condition.field_id = select.value;
      fld.condition.operator = 'equals';
      delete fld.condition.value; // Reset value when field changes
    } else {
      // Clear skip logic but preserve days
      if (fld.condition) {
        delete fld.condition.field_id;
        delete fld.condition.operator;
        delete fld.condition.value;
        if (!fld.condition.days) fld.condition = null;
      }
    }
    renderBuilder();
    return;
  }

  // Skip logic — value selector
  if (e.target.classList.contains('skip-value-select')) {
    const select = e.target;
    const fldId = select.dataset.fieldId;
    const secId = select.dataset.sectionId;
    const sec = state.activeTemplate.sections.find(s => s.id === secId);
    const fld = sec.fields.find(f => f.id === fldId);
    fld.condition.value = JSON.parse(select.value);
    // No re-render needed — just state update
    return;
  }
});

// FIELD_RESPONSES and FAIL_NOTES are registered in store above and aliased at the top.
// Unwrap values that were double-stringified by an old bug.
// e.g. '"true"' → true, '"\"hey\""' → 'hey', '400' → 400
function unwrapValue(v) {
  if (typeof v !== 'string') return v;
  try {
    var parsed = JSON.parse(v);
    // If parsing a string produced another string, that's a double-wrapped value — unwrap it
    if (typeof parsed === 'string') return parsed;
    return parsed;
  } catch (e) {
    return v;
  }
}

// applyResponseRow unpacks ONE `submission_responses`-shaped row into
// FIELD_RESPONSES / FAIL_NOTES / CORRECTION_PHOTOS.
//
// Extracted verbatim from hydrateFieldState's draft loop on card
// `activate-fill-view-reads` (C3, run 20260808-2) so the RxDB overlay below
// cannot drift from it. The rows RxDB replicates into `db.responses` ARE
// `submission_responses` rows — a second copy of this unpack would be a second,
// drifting definition of one wire shape, which is how `_correction_photo` or
// `_fail_note` ends up honoured on one read path and silently dropped on the
// other. Behaviour is unchanged: same early returns, same order, same bundles.
function applyResponseRow(fieldId, rawValue, answeredByName, answeredAt) {
  if (rawValue === null || rawValue === undefined) return; // unchecked — no entry
  var val = unwrapValue(rawValue);
  var subSteps = null;
  // Unpack bundled fail note + correction photo if present
  if (val && typeof val === 'object' && val._v !== undefined) {
    if (val._fail_note) FAIL_NOTES[fieldId] = { note: val._fail_note.note || '', severity: val._fail_note.severity || '', photo: val._fail_note.photo || null };
    if (val._correction_photo) CORRECTION_PHOTOS[fieldId] = val._correction_photo;
    val = val._v;
  }
  // Unpack sub-step objects: { value: bool, sub_steps: {...} }
  if (val && typeof val === 'object' && val.sub_steps !== undefined) {
    subSteps = val.sub_steps;
    val = val.value;
  }
  // A photo-only correction draft ({_v:null, _correction_photo}) records the
  // photo (above) but must NOT mark the field answered — the crew still owes
  // the actual answer.
  if (val === null || val === undefined) return;
  var entry = { value: val, answeredBy: answeredByName || getUserName(), answeredAt: new Date(answeredAt) };
  if (subSteps) entry.sub_steps = subSteps;
  FIELD_RESPONSES[fieldId] = entry;
}

// hydrateFieldState rebuilds FIELD_RESPONSES and FAIL_NOTES from all server sources.
// Priority: RxDB (open checklist only, flag-gated) > submission responses > draft responses.
// Called once after loadMyChecklists and when opening a checklist runner.
function hydrateFieldState(filterFieldIds) {
  // Clear existing state
  Object.keys(FIELD_RESPONSES).forEach(function(k) { delete FIELD_RESPONSES[k]; });
  Object.keys(FAIL_NOTES).forEach(function(k) { delete FAIL_NOTES[k]; });
  Object.keys(REJECTION_FLAGS).forEach(function(k) { delete REJECTION_FLAGS[k]; });
  Object.keys(FEEDBACK_NOTES).forEach(function(k) { delete FEEDBACK_NOTES[k]; });
  Object.keys(CORRECTION_PHOTOS).forEach(function(k) { delete CORRECTION_PHOTOS[k]; });
  // 1. Draft responses (in-progress, not yet submitted)
  (DRAFT_RESPONSES || []).forEach(function(d) {
    if (!filterFieldIds || filterFieldIds.has(d.field_id)) {
      applyResponseRow(d.field_id, d.value, d.answered_by_name, d.answered_at);
    }
  });
  // 2. Submitted responses (highest priority — overwrites drafts)
  (MY_SUBMISSIONS || []).forEach(function(sub) {
    (sub.responses || []).forEach(function(r) {
      if (!filterFieldIds || filterFieldIds.has(r.field_id)) {
        var val = unwrapValue(r.value);
        var subSteps = null;
        // A resubmitted field may carry the `_correction_photo` (and/or `_fail_note`)
        // value bundle; unwrap it the same way the draft path does.
        if (val && typeof val === 'object' && val._v !== undefined) {
          if (val._fail_note) FAIL_NOTES[r.field_id] = { note: val._fail_note.note || '', severity: val._fail_note.severity || '', photo: val._fail_note.photo || null };
          if (val._correction_photo) CORRECTION_PHOTOS[r.field_id] = val._correction_photo;
          val = val._v;
        }
        if (val && typeof val === 'object' && val.sub_steps !== undefined) {
          subSteps = val.sub_steps;
          val = val.value;
        }
        var entry = { value: val, answeredBy: r.answered_by_name || r.answeredBy || getUserName(), answeredAt: new Date(r.answered_at) };
        if (subSteps) entry.sub_steps = subSteps;
        FIELD_RESPONSES[r.field_id] = entry;
      }
    });
    // Restore fail notes from the submission's canonical fail-note array. On submit
    // the corrective action is written to submission_fail_notes (returned here as
    // sub.fail_notes) — NOT bundled into the response value the way a draft's is
    // (submitChecklistToAPI sends it as separate columns + the fail_notes array, and
    // bundles only _correction_photo into the value). The response-value unwrap above
    // therefore never sees a submitted fail note, so without this it is silently
    // dropped on reopen even though the approver never rejected it — the "honoured on
    // one read path, dropped on the other" the applyResponseRow comment warns about,
    // here on the submission read path. Guarded by FLD-15b.
    (sub.fail_notes || []).forEach(function(fn) {
      if (!filterFieldIds || filterFieldIds.has(fn.field_id)) {
        FAIL_NOTES[fn.field_id] = { note: fn.note || '', severity: fn.severity || '', photo: fn.photo_url || null };
      }
    });
    // 3. Load rejection flags — only from the LATEST submission per template
    //    (a resubmission creates a new pending submission; the old rejected one should not clear new responses)
    // Load feedback notes from approved submissions
    if (sub.status === 'approved' && sub.rejections && sub.rejections.length > 0) {
      sub.rejections.forEach(function(rej) {
        if (!filterFieldIds || filterFieldIds.has(rej.field_id)) {
          FEEDBACK_NOTES[rej.field_id] = { comment: rej.comment || '', by: rej.rejected_by_name || '', at: rej.rejected_at || '' };
        }
      });
    }
    if (sub.status === 'rejected' && sub.rejections && sub.rejections.length > 0) {
      var hasNewerSubmission = (MY_SUBMISSIONS || []).some(function(other) {
        return other.template_id === sub.template_id && other.id !== sub.id &&
          new Date(other.submitted_at) > new Date(sub.submitted_at);
      });
      if (!hasNewerSubmission) {
        sub.rejections.forEach(function(rej) {
          if (!filterFieldIds || filterFieldIds.has(rej.field_id)) {
            REJECTION_FLAGS[rej.field_id] = { comment: rej.comment || '', requirePhoto: !!rej.require_photo };
            delete FIELD_RESPONSES[rej.field_id]; // uncheck a top-level field so crew must redo
            // A rejected SUB-STEP's done-state lives in its PARENT's sub_steps
            // map (not FIELD_RESPONSES[subId]); clear it there too so the crew
            // must redo it — and the parent auto-checkbox drops out of all-done.
            Object.keys(FIELD_RESPONSES).forEach(function(pid) {
              var pr = FIELD_RESPONSES[pid];
              if (pr && pr.sub_steps && Object.prototype.hasOwnProperty.call(pr.sub_steps, rej.field_id)) {
                delete pr.sub_steps[rej.field_id];
              }
            });
          }
        });
      }
    }
  });
  // 4. 🛑 THE RxDB OVERLAY — the OPEN CHECKLIST's fields, and nothing else.
  //    Card `activate-fill-view-reads` (C3, run 20260808-2), Activity 4.
  //
  //    RxDB SERVES READS; `/saveResponse` and `/submitChecklist` keep owning ALL
  //    writes — ledger T-32 decision 126, carried, not proposed. Nothing below
  //    writes: `debouncedSaveField` → `submitOp('SET_FIELD')` → `POST /ops` is
  //    byte-untouched and there is no `autoSaveField` (B-65).
  //
  //    🛑 THIS IS THE FILL VIEW ONLY. Ledger T-43(b): the My Checklists read
  //    path is DELIBERATELY OPEN and no card may decide it. RXDB_FILL_RESPONSES
  //    is keyed by field id and populated ONLY by a live per-open-checklist
  //    scope; `MY_CHECKLISTS`, `MY_SUBMISSIONS` and `PENDING` — the three stores
  //    the two list views render from — are never written here, so both lists
  //    stay on REST whether the flag is on or off.
  //
  //    🛑 EMPTY BY DEFAULT IN EVERY ENVIRONMENT. Populating it requires an open
  //    fill scope, which requires `HQSync.openSyncScope()`, which throws
  //    SYNCHRONOUSLY while the `hq_sync_read` flag is off — and it is off unless
  //    someone set it. With the flag off this loop iterates nothing and
  //    hydrateFieldState behaves exactly as it did before this card.
  //
  //    ORDER: LAST, so a live row beats the REST snapshot it is a newer view of.
  //    🛑 EXCEPT over a rejection. A field an approver bounced back is CLEARED by
  //    step 3 on purpose — the crew must redo it — and the replicated response
  //    row is precisely the stale answer that was rejected, so re-applying it
  //    would silently un-bounce the field. Skipping REJECTION_FLAGS keeps step
  //    3's ruling final.
  Object.keys(RXDB_FILL_RESPONSES).forEach(function(fid) {
    if (filterFieldIds && !filterFieldIds.has(fid)) return;
    if (REJECTION_FLAGS[fid]) return;
    var r = RXDB_FILL_RESPONSES[fid];
    applyResponseRow(fid, r.value, r.answered_by_name, r.answered_at);
  });
}

// FAIL_NOTES is registered in store above and aliased at the top.
// RXDB_FILL_RESPONSES is the OPEN CHECKLIST's rows as RxDB currently holds them
// — `{ [fldId]: {value, answered_by_name, answered_at} }`. Written only by
// HQFillSync's subscription (see the fill-view read lifecycle below), cleared
// when the last fill scope closes, and EMPTY in every environment where the
// `hq_sync_read` flag is off. Read only by hydrateFieldState's layer 4.
const RXDB_FILL_RESPONSES = {};
const REJECTION_FLAGS = {}; // { [fldId]: { comment, requirePhoto } } — TODO: load from submission.rejections[] on checklist open
const FEEDBACK_NOTES = {}; // { [fldId]: { comment, by, at } } — feedback from approved submissions
// CORRECTION_PHOTOS holds the crew's evidence photo for a field the approver
// bounced back with require_photo=true. It lives in a slot SEPARATE from the
// field's answer (a checkbox can't hold both its boolean and a photo URL), and
// is persisted by bundling `_correction_photo` into the field's saved value
// (mirrors the `_fail_note` bundle) — see debouncedSaveField/submit/hydrate.
const CORRECTION_PHOTOS = {}; // { [fldId]: httpsUrl }

// fieldHasRequiredPhoto reports whether a require-photo rejection is satisfied
// for a field: either a dedicated correction photo, or (photo-type fields) the
// answer value itself being a photo URL.
function fieldHasRequiredPhoto(fldId) {
  if (CORRECTION_PHOTOS[fldId]) return true;
  var resp = FIELD_RESPONSES[fldId];
  return !!(resp && typeof resp.value === 'string' && resp.value.startsWith('https://'));
}

// Named mutation helpers (used inline in event handlers and referenced by name for traceability)
function clearRejectionFlag(fldId) {
  if (!REJECTION_FLAGS[fldId]) return;
  // Keep the flag if photo is required but not yet provided
  if (REJECTION_FLAGS[fldId].requirePhoto && !fieldHasRequiredPhoto(fldId)) {
    return; // keep flag — photo still needed
  }
  delete REJECTION_FLAGS[fldId];
}

  return CURRENT_USER ? (CURRENT_USER.display_name || CURRENT_USER.name || 'User') : 'User';
}
function getUserInitials() {

  if (CURRENT_USER.initials) return CURRENT_USER.initials;

  return n ? n.split(' ').map(function(p){return p[0]}).join('').toUpperCase().slice(0,2) : '?';

function setYesNo(fldId, value) {

  debouncedSaveField(fldId, value);

var FAIL_NOTE_DEBOUNCE = {};
function autoSaveFailNote(fldId) {

function setFailNote(fldId, patch) {
