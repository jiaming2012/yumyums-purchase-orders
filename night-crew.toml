# night-crew.toml — target-repo configuration (scaffolded by `night-crew init`).
#
# Fill in the stanzas below and remove the comment markers. Parsing is strict:
# an incomplete [env] table fails loudly rather than half-configuring a run, so
# an unfilled config surfaces a named error instead of running against nothing.

# [env] declares the environment inventory (environment-tiers spec). An
# ephemeral env composes up a fresh stack per run, isolated by a Docker-assigned
# host port (production is never touched). Point compose_file at a repo-relative
# compose file and name the service + container port that is the env's public
# face; the host port is intentionally omitted — Docker assigns it.
[env.ephemeral]
compose_file = "docker-compose.nc.yml"
service = "app"
port = 8080

# [review] names the lens set the REVIEW stage applies (review-lenses spec). A
# repo may add its own lens (e.g. "security") on top of the defaults.
[review]
lenses = ["adversarial", "edge-case"]

# [e2e] declares the browser suite night-crew runs after each merge (e2e-execution
# spec). The suite runs against the ephemeral env above: the env module hands its
# base URL to the suite as NIGHTCREW_ENV_URL, and playwright.config.js targets that
# URL and skips its own webServer. `suite` is the full run; `timeout` defaults to
# 30m when omitted. `subset` + [e2e.seams] are an optimization — when every file a
# card changed sits under a declared seam, night-crew runs only that app's specs
# (the touched seams' tags are unioned, sorted, joined with `|`, and substituted
# for {tags}). Playwright reads a positional arg as a path regex, so an expansion
# like `inventory|recipes` selects tests/inventory.spec.js + tests/recipes.spec.js.
# Anything touching a shared or undeclared file falls back to the full suite.
[e2e]
suite = "npx playwright test"
subset = 'npx playwright test "{tags}"'

# Seams map HQ's five disjoint apps (roadmap "App footprints") to the specs their
# changes can affect. Keys are repo-relative path prefixes covering each app's
# backend package, its frontend page, and its own spec files; values are the spec
# name-stems Playwright should match. Under-listing a tag would let a confined card
# miss a regression, so each app maps to every spec its footprint owns — recipes
# folds into the Inventory app, persistence into Operations. Cross-app specs
# (multi-role, index) and shared/undeclared packages (auth, db, sync, receipt, …)
# are intentionally unmapped: touching them de-confines the card → full suite.
#
# ─────────────────────────────────────────────────────────────────────────────
# APP-SURFACE PROOF — footprint mapping (card `sync-live-in-dev-app-proof`,
# Activity 5 leg 3, run 20260810). NOT a seam key/token — a footprint NOTE.
#
# The app-surface red-first proof drives the REAL workflows.html in a real
# Chromium against a LIVE external substrate (Docker substrate + FDW repoint +
# ephemeral scratch HQ). It therefore CANNOT run inside this [e2e.seams] `:5434`
# `task test` harness at all — it is a STANDALONE harness gated on its OWN exit
# code (the browser-live/ precedent, B-345-aligned; see the merge-intent's
# gate-harness decision). Its files live OUTSIDE tests/, so they match no seam
# glob and add no roll-call name (the [e2e.seams] tables + tests/repo-hygiene.spec.js
# enumerate tests/*.spec.js only). This note is where "the app-surface test is in a
# card's footprint" is honored, without a new KEY or TOKEN (which would PARK):
#
#   footprint (card sync-live-in-dev-app-proof):
#     .night-crew/qa/spike-supabase/sync-app-proof.sh                     (the harness — gate on its exit code)
#     .night-crew/qa/spike-supabase/app-proof/workflows-live.spec.js      (promoted from browser-live/)
#     .night-crew/qa/spike-supabase/app-proof/playwright.app-proof.config.js
#     Taskfile.yml  sync:app-proof                                        (thin wrapper — GATE ON THE SCRIPT, B-163)
#
#   run it:  task sync:app-proof   (but grade `.night-crew/qa/spike-supabase/sync-app-proof.sh; echo EXIT=$?`)
# ─────────────────────────────────────────────────────────────────────────────
[e2e.seams]
"backend/internal/inventory"  = ["inventory", "recipes"]
"backend/internal/recipes"    = ["inventory", "recipes"]
# states-inventory-nav is the B-455 / WO-1 state table (tab bar, By dish view,
# More sheet, Setup). It reads the same page, so it rides every inventory.html
# change — a narrow entry here is exactly how a regression escapes a green gate.
"inventory.html"              = ["inventory", "recipes", "health", "states-inventory-nav", "states-trends", "states-cost"]
"tests/inventory.spec.js"     = ["inventory", "recipes"]
"tests/recipes.spec.js"       = ["inventory", "recipes"]
"tests/states-inventory-nav.spec.js" = ["states-inventory-nav"]
# bi.html hosts Trends + Food cost (B-455 / WO-2b), lifted out of inventory.html.
# Its state tables are the former Inventory tab specs; the launcher tile and
# inventory.html's #tab=5 / #tab=6 redirect are asserted there too, so a change
# to bi.html, to the redirect, or to the tile runs all of it.
"bi.html"                     = ["states-bi-hub", "states-trends", "states-cost", "inventory", "index"]
"tests/states-bi-hub.spec.js" = ["states-bi-hub"]
"tests/states-trends.spec.js" = ["states-trends"]
"tests/states-cost.spec.js"   = ["states-cost"]
# tab.js paints the active slot before every page's own script boots; a change
# to it is a change to every tabbed page. (Gained data-home for the Inventory
# hub, B-455 / WO-2a.)
"tab.js"                      = ["inventory", "recipes", "purchasing", "users", "onboarding", "workflows", "states-inventory-nav"]
# Operations carries two MORE specs than its name suggests. sync.spec.js and
# repro-cut-task.spec.js both drive the workflows runner end-to-end, so a change to
# the workflow package or to workflows.html can break them — and under the old
# two-tag list neither ever ran. That is not hypothetical: card F1 (run 20260725)
# was confined by this seam, went green on workflows+persistence, and merged a
# change that left exactly those two specs RED on dev. Card A, run 20260726, is
# the repair.
#
# 🛑 THESE FOUR TOKENS SELECT NINE SPEC FILES, NOT FOUR. This comment claimed
# they selected "exactly workflows / persistence / sync / repro-cut-task .spec.js
# and nothing else — no other spec filename in tests/ contains any of them
# (re-verified at landing)". That was false when written and is false now: the
# `sync` token alone matches SIX files, because Playwright reads the positional
# argument as a path REGEX, not as a filename. The real roll-call, machine-
# checked by tests/repo-hygiene.spec.js so it cannot drift again silently:
#
#   selects: persistence.spec.js, repro-cut-task.spec.js, states-sync-rxdb-conflict-notice.spec.js, sync-fill-view.spec.js, sync-one-row.spec.js, sync-rxdb-client.spec.js, sync-rxdb-conflict-notice.spec.js, sync-rxdb-conflict.spec.js, sync-schema.spec.js, sync.spec.js, workflows.spec.js
#
# 🛑 ELEVEN FILES SINCE run 20260808-2, NOT NINE — and the count moved TWICE in
# that one run. `tests/sync-one-row.spec.js` (card `skeleton-one-row-end-to-end`,
# C2) is the walking skeleton's end-to-end test and took it 9 -> 10;
# `tests/sync-fill-view.spec.js` (card `activate-fill-view-reads`, C3) is the fill
# view's RxDB read + open/cancel lifecycle test and takes it 10 -> 11. Both drive
# `workflows.html` + `sync-rxdb/*`, so both BELONG to this seam, and both names
# contain the `sync` token, which is why they appear above. The guard in
# tests/repo-hygiene.spec.js fired exactly as designed ("adding a spec whose name
# contains a seam token reds this test rather than quietly inflating a 'confined'
# gate") and this line plus that test's count are the response it asks for. NO KEY
# AND NO TOKEN CHANGED — only this roll-call. 🛑 Naming either spec to dodge the
# `sync` token would have hidden a spec this seam exists to select; the count is
# the honest price. Cost, since slates price legs off this list: an
# Operations-confined card now pays for ELEVEN spec files.
#
# 🛑 WHAT IS WRONG HERE IS THE COST, NOT THE COVERAGE. Per B-87 the Playwright
# CLI filters are OR'd, so a card confined by this seam OVER-runs — it can never
# run the wrong specs, and no regression escapes through this. What it does is
# mis-price the night: a card that budgets for four specs pays for eleven, and
# `sync.spec.js` is the load-sensitive one that must not share a box. Anyone
# estimating a confined Operations leg should cost it off the list above, and
# the token VALUES below are correct as they stand — do not "fix" them.
# Corrected on card `repo-hygiene-preconditions`, run 20260806.
# health-banner.js and the pages that mount it. A change to the shared module
# can break the banner on any of the five, so the footprint fans out to the
# health spec plus each page's own suite — a narrow entry here is exactly how a
# regression escapes a green gate.
"health-banner.js"            = ["health", "storage-banner", "inventory", "onboarding", "workflows", "marketing"]
# item-name.js is the shared "what do we call this item?" resolver, referenced
# by inventory.html and purchasing.html. Same fan-out reasoning as
# health-banner.js above: a change to the module can mislabel an item on the
# Stock, Reorder, Recipes, PO and shopping-list screens at once, so the
# footprint names every spec that renders one. A narrower entry here is exactly
# how a mislabelling regression escapes a green gate.
"item-name.js"                = ["inventory", "recipes", "purchasing"]
"tests/health-banner.spec.js" = ["health"]
"index.html"                  = ["health"]
"backend/internal/sync/health.go" = ["health", "sync"]
"backend/internal/workflow"   = ["workflows", "persistence", "sync", "repro-cut-task"]
"workflows.html"              = ["workflows", "persistence", "sync", "repro-cut-task", "health"]
"tests/workflows.spec.js"     = ["workflows", "persistence"]
"tests/persistence.spec.js"   = ["workflows", "persistence"]
"backend/internal/onboarding" = ["onboarding"]
"onboarding.html"             = ["onboarding", "health"]
"tests/onboarding.spec.js"    = ["onboarding"]
"backend/internal/users"      = ["users"]
"users.html"                  = ["users"]
"tests/users.spec.js"         = ["users"]
"backend/internal/purchasing" = ["purchasing"]
"purchasing.html"             = ["purchasing"]
"tests/purchasing.spec.js"    = ["purchasing"]
# The launcher shell. index.html writes the identity token the service worker
# partitions api-cache by (sw-api-cache-partition) and paints tiles from
# /api/v1/me/apps (grant-enforcement-parity) — both suites drive it directly.
# Added on fix/sticky-launcher-header (2026-09-28): the row was missing.
"index.html"                  = ["index", "storage-banner", "version-badge", "sw-api-cache-partition", "grant-enforcement-parity"]
"tests/index.spec.js"         = ["index"]
# ─────────────────────────────────────────────────────────────────────────────
# THE SYNC CLIENT SEAM — B-154 rider (card `client-guard-coverage`, run 20260901,
# the FIRST sync-touching card). Before this row, `sync-rxdb/**` was one of the
# "shared/undeclared" paths named in the header block above — touching it
# de-confined the card to the full ~22 min suite. Later sync cards
# (`cdc-single-fire` touches backend/, but `app-slug-association`,
# `sync-doc-honesty`, `sync-dev-one-command` and any client-JS change) confine
# their gate leg to the specs that actually EXERCISE the sync client through it.
#
# The value is authored against the sync footprint, not guessed. A change under
# `sync-rxdb/` is a change to `client.js` / `bootstrap.js` / `conflict-handler.js`
# / the schema — every spec that imports the client bundle or drives a real
# `workflows.html` against it can break. Those SEVEN, and only those, are the
# roll-call (single line, machine-readable — the Operations `#   selects:` marker
# above is the one tests/repo-hygiene.spec.js reads; this one documents THIS seam):
#
# sync-rxdb-selects: states-sync-rxdb-conflict-notice, sync-fill-view, sync-one-row, sync-rxdb-client, sync-rxdb-conflict, sync-rxdb-conflict-notice, sync-schema
#
#   token → files (Playwright reads each as a path REGEX, OR'd — B-87):
#     "sync-rxdb"      → states-sync-rxdb-conflict-notice, sync-rxdb-client,
#                        sync-rxdb-conflict-notice, sync-rxdb-conflict  (4)
#     "sync-schema"    → sync-schema        (1)
#     "sync-one-row"   → sync-one-row       (1)
#     "sync-fill-view" → sync-fill-view     (1)
#
# 🛑 `sync.spec.js` is DELIBERATELY NOT selected. It drives the workflow/relay
# substrate end-to-end and imports NOTHING from `sync-rxdb/` (grep: zero refs to
# sync-rxdb / HQSync / client.js / bootstrap). It is also the load-sensitive spec
# the Operations seam block above warns "must not share a box". A `sync-rxdb/`
# client-JS change does not touch its subject, so pulling it in would over-run
# AND mis-price. The bare `sync` token (which the Operations seam uses) WOULD pull
# it in — that is exactly why this seam lists four narrow tokens instead. Anyone
# adding a NEW sync-rxdb-exercising spec whose name contains none of these four
# tokens must extend this value; tests/repo-hygiene.spec.js guards the count.
"sync-rxdb"                   = ["sync-rxdb", "sync-schema", "sync-one-row", "sync-fill-view"]
# ─────────────────────────────────────────────────────────────────────────────
# THE MARKETING SEAM — added by card `redemption-submit-flow` (run 20260905),
# the slate-homed call, now that tests/marketing.spec.js carries the app's
# coverage (tile/seed, scanner decode/resolution, submit flow/machine). The
# `marketing` token as a Playwright path regex selects exactly
# tests/marketing.spec.js (verified at landing: no other spec filename and no
# feature file contains the token). The key `marketing` is a path PREFIX, so
# it covers marketing.html AND marketing/ (scan-page, scanner, submit-*,
# sync/*) — the whole app footprint. Honest confinement: `marketing/sync/`'s
# substrate mechanisms are gated by their own standalone harnesses
# (marketing/sync/harness/*, B-345 — graded on their exit codes, not
# Playwright), and ANY card that moves the precache touches sw.js/build-sw.js
# (undeclared seams) and still de-confines to the full suite — the B-37
# posture. A future spec whose name contains `marketing` joins this seam's
# selection automatically; that is the intended growth, not drift.
"marketing"                   = ["marketing"]
"tests/marketing.spec.js"     = ["marketing"]
