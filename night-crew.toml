# night-crew.toml — target-repo configuration (scaffolded by `night-crew init`).
#
# Fill in the stanzas below and remove the comment markers. Parsing is strict:
# an incomplete [env] table fails loudly rather than half-configuring a run, so
# an unfilled config surfaces a named error instead of running against nothing.

# [env] declares the environment inventory (environment-tiers spec). An
# ephemeral env composes up a fresh stack per run, isolated by a Docker-assigned
# host port (production is never touched). Point compose_file at a repo-relative
# compose file and name the service + container port that is the env's public
# face; the host port is intentionally omitted — Docker assigns it.
[env.ephemeral]
compose_file = "docker-compose.nc.yml"
service = "app"
port = 8080

# [review] names the lens set the REVIEW stage applies (review-lenses spec). A
# repo may add its own lens (e.g. "security") on top of the defaults.
[review]
lenses = ["adversarial", "edge-case"]

# [e2e] declares the browser suite night-crew runs after each merge (e2e-execution
# spec). The suite runs against the ephemeral env above: the env module hands its
# base URL to the suite as NIGHTCREW_ENV_URL, and playwright.config.js targets that
# URL and skips its own webServer. `suite` is the full run; `timeout` defaults to
# 30m when omitted. `subset` + [e2e.seams] are an optimization — when every file a
# card changed sits under a declared seam, night-crew runs only that app's specs
# (the touched seams' tags are unioned, sorted, joined with `|`, and substituted
# for {tags}). Playwright reads a positional arg as a path regex, so an expansion
# like `inventory|recipes` selects tests/inventory.spec.js + tests/recipes.spec.js.
# Anything touching a shared or undeclared file falls back to the full suite.
[e2e]
suite = "npx playwright test"
subset = 'npx playwright test "{tags}"'

# Seams map HQ's five disjoint apps (roadmap "App footprints") to the specs their
# changes can affect. Keys are repo-relative path prefixes covering each app's
# backend package, its frontend page, and its own spec files; values are the spec
# name-stems Playwright should match. Under-listing a tag would let a confined card
# miss a regression, so each app maps to every spec its footprint owns — recipes
# folds into the Inventory app, persistence into Operations. Cross-app specs
# (multi-role, index) and shared/undeclared packages (auth, db, sync, receipt, …)
# are intentionally unmapped: touching them de-confines the card → full suite.
[e2e.seams]
"backend/internal/inventory"  = ["inventory", "recipes"]
"backend/internal/recipes"    = ["inventory", "recipes"]
"inventory.html"              = ["inventory", "recipes"]
"tests/inventory.spec.js"     = ["inventory", "recipes"]
"tests/recipes.spec.js"       = ["inventory", "recipes"]
# Operations carries two MORE specs than its name suggests. sync.spec.js and
# repro-cut-task.spec.js both drive the workflows runner end-to-end, so a change to
# the workflow package or to workflows.html can break them — and under the old
# two-tag list neither ever ran. That is not hypothetical: card F1 (run 20260725)
# was confined by this seam, went green on workflows+persistence, and merged a
# change that left exactly those two specs RED on dev. Card A, run 20260726, is
# the repair.
#
# 🛑 THESE FOUR TOKENS SELECT NINE SPEC FILES, NOT FOUR. This comment claimed
# they selected "exactly workflows / persistence / sync / repro-cut-task .spec.js
# and nothing else — no other spec filename in tests/ contains any of them
# (re-verified at landing)". That was false when written and is false now: the
# `sync` token alone matches SIX files, because Playwright reads the positional
# argument as a path REGEX, not as a filename. The real roll-call, machine-
# checked by tests/repo-hygiene.spec.js so it cannot drift again silently:
#
#   selects: persistence.spec.js, repro-cut-task.spec.js, states-sync-rxdb-conflict-notice.spec.js, sync-one-row.spec.js, sync-rxdb-client.spec.js, sync-rxdb-conflict-notice.spec.js, sync-rxdb-conflict.spec.js, sync-schema.spec.js, sync.spec.js, workflows.spec.js
#
# 🛑 TEN FILES SINCE run 20260808-2, NOT NINE. `tests/sync-one-row.spec.js` (card
# `skeleton-one-row-end-to-end`, C2) is the walking skeleton's end-to-end test —
# it drives `workflows.html` + `sync-rxdb/*`, so it BELONGS to this seam and its
# name contains the `sync` token, which is why it appears above. The guard in
# tests/repo-hygiene.spec.js fired exactly as designed ("adding a spec whose name
# contains a seam token reds this test rather than quietly inflating a 'confined'
# gate") and this line plus that test's count are the response it asks for. NO KEY
# AND NO TOKEN CHANGED — only this roll-call. Cost, since slates price legs off
# this list: an Operations-confined card now pays for TEN spec files.
#
# 🛑 WHAT IS WRONG HERE IS THE COST, NOT THE COVERAGE. Per B-87 the Playwright
# CLI filters are OR'd, so a card confined by this seam OVER-runs — it can never
# run the wrong specs, and no regression escapes through this. What it does is
# mis-price the night: a card that budgets for four specs pays for nine, and
# `sync.spec.js` is the load-sensitive one that must not share a box. Anyone
# estimating a confined Operations leg should cost it off the list above, and
# the token VALUES below are correct as they stand — do not "fix" them.
# Corrected on card `repo-hygiene-preconditions`, run 20260806.
"backend/internal/workflow"   = ["workflows", "persistence", "sync", "repro-cut-task"]
"workflows.html"              = ["workflows", "persistence", "sync", "repro-cut-task"]
"tests/workflows.spec.js"     = ["workflows", "persistence"]
"tests/persistence.spec.js"   = ["workflows", "persistence"]
"backend/internal/onboarding" = ["onboarding"]
"onboarding.html"             = ["onboarding"]
"tests/onboarding.spec.js"    = ["onboarding"]
"backend/internal/users"      = ["users"]
"users.html"                  = ["users"]
"tests/users.spec.js"         = ["users"]
"backend/internal/purchasing" = ["purchasing"]
"purchasing.html"             = ["purchasing"]
"tests/purchasing.spec.js"    = ["purchasing"]
