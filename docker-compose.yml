services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: yumyums-purchase-orders:prod
    container_name: yumyums-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Point at yumyums-dev-pg on the shared yumyums_default network.
      # search_path=production isolates this app's tables under the production schema.
      DB_URL: "postgres://yumyums:yumyums@yumyums-dev-pg:5432/yumyums?sslmode=disable&search_path=production"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      SUPERADMIN_CONFIG: /app/config/superadmins.yaml
      TEMPLATE_CONFIG: /app/config/templates.yaml
    env_file:
      - path: .env.prod
        required: false
    networks:
      - yumyums

networks:
  yumyums:
    name: yumyums_default
    external: true
