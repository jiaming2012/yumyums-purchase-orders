version: '3'

# Production stack — local docker-compose for the Go backend.
#
# Builds the backend image (see ../Dockerfile), runs it on :8080, and joins
# the yumyums_default network so it can reach the existing yumyums-dev-pg
# container at hostname yumyums-dev-pg:5432. The app's tables live under
# the `production` schema (search_path is set on the DB URL in compose).
#
# Invoke from repo root via the include in ../Taskfile.yml:
#   task prod:up
#   task prod:logs
#   task prod:psql
#
# Or standalone from anywhere:
#   task -t prod/Taskfile.yml up

vars:
  PG_CONTAINER: yumyums-dev-pg
  PG_USER: yumyums
  PG_DB: yumyums
  PG_SCHEMA: production

tasks:
  build:
    desc: Build the prod backend image
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - docker compose build backend

  up:
    desc: Start the prod backend (build + run, detached)
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - docker compose up -d --build backend

  down:
    desc: Stop the prod backend
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - docker compose down

  logs:
    desc: Tail prod backend logs
    cmds:
      - docker logs -f yumyums-prod

  restart:
    desc: Restart the prod backend
    cmds:
      - docker restart yumyums-prod

  ps:
    desc: Show prod container status
    cmds:
      - docker ps --filter name=yumyums-prod --format "table {{`{{.Names}}\t{{.Status}}\t{{.Ports}}`}}"

  health:
    desc: Probe the local backend on :8080
    cmds:
      - cmd: curl -fsS -o /dev/null -w "GET / -> HTTP %{http_code}\n" http://localhost:8080/
        platforms: [linux, darwin]
      - cmd: curl -fsS -o NUL -w "GET / -> HTTP %{http_code}\n" http://localhost:8080/
        platforms: [windows]

  psql:
    desc: One-shot psql against the production schema (prints schema info)
    cmds:
      - >-
        docker exec {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d {{.PG_DB}}
        -c "SET search_path TO {{.PG_SCHEMA}}, public; \dt"

  psql:shell:
    desc: Interactive psql shell scoped to the production schema
    cmds:
      - >-
        docker exec -it -e PGOPTIONS='-c search_path={{.PG_SCHEMA}},public'
        {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d {{.PG_DB}}

  tables:
    desc: List tables in the production schema
    cmds:
      - >-
        docker exec {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d {{.PG_DB}}
        -c "\dt {{.PG_SCHEMA}}.*"

  migrations:
    desc: Show migration version currently applied in production schema
    cmds:
      - >-
        docker exec {{.PG_CONTAINER}} psql -U {{.PG_USER}} -d {{.PG_DB}}
        -c "SELECT version_id, is_applied, tstamp FROM {{.PG_SCHEMA}}.goose_db_version ORDER BY id DESC LIMIT 10;"

  tunnel:
    desc: Show the cloudflared command to publish localhost:8080
    cmds:
      - 'echo "Run: cloudflared tunnel --url http://localhost:8080"'
      - 'echo "Or with a named tunnel: cloudflared tunnel run <tunnel-name>"'
