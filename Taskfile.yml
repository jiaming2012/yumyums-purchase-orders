  version:
    desc: Compare backend + frontend versions across local source, dev server, and prod
    cmds:
      - |
        echo "── Local source ──────────────────────────────────────"
        echo "  Frontend (package.json):  $(jq -r .version package.json)"
        echo "  Frontend (version.json):  $(jq -r .frontend version.json 2>/dev/null || echo missing — run task sw)"
        echo "  Backend  (version.go):    $(grep -E 'Backend\s*=' backend/internal/version/version.go | head -1 | sed 's/.*"\(.*\)".*/\1/')"
        echo ""
        echo "── Dev server (localhost:{{.PROD_PORT}}) ─────────────────────────"
        curl -fsS --max-time 2 http://localhost:{{.PROD_PORT}}/api/v1/health | jq . 2>/dev/null || echo "  (not running)"
        echo ""
        echo "── Production ({{.PROD_URL}}) ─────────────────────────"
        curl -fsS --max-time 5 {{.PROD_URL}}/api/v1/health | jq . 2>/dev/null || echo "  (unreachable)"

  health:dev:
    desc: Check /api/v1/health on the local dev server
    cmd: curl -fsS http://localhost:{{.PROD_PORT}}/api/v1/health | jq .

  health:prod:
    desc: Check /api/v1/health on production
    cmd: curl -fsS {{.PROD_URL}}/api/v1/health | jq .

  prod:ship:
    desc: Ship dev → main — publish dev, merge → main, push. Guarded (ff-only, version mirror, clean tree); restores your starting branch.
    cmds:
      - |
        set -euo pipefail
        # The missing half of the release flow. `task prod:deploy` only ever
        # BUILDS origin/main; THIS is what ADVANCES origin/main to dev. Skipping
        # it is how prod shipped 9-day-old code on 2026-09-02 while reporting ok.
        git diff --quiet && git diff --cached --quiet \
          || { echo "ERROR: working tree not clean — commit or stash first (this task switches branches)." >&2; exit 1; }
        START="$(git rev-parse --abbrev-ref HEAD)"
        echo "── fetch origin dev + main ──────────"
        git fetch origin dev main
        # package.json "version" MUST mirror version.go Frontend (CLAUDE.md rule).
        PKG="$(grep -m1 '"version"' package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        VGO="$(grep -oE 'Frontend[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' backend/internal/version/version.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        [ "$PKG" = "$VGO" ] || { echo "ERROR: package.json ($PKG) != version.go Frontend ($VGO) — fix the version mirror before shipping." >&2; exit 1; }
        # Publish dev as part of shipping, so origin/dev IS what you're promoting.
        # Guarded: only when you're ON dev and it fast-forwards origin/dev — never
        # a force-push, never publishing a stray branch. Closes the "forgot to push
        # dev, silently shipped a stale origin/dev" hole (same class as the deploy
        # stale-guard). If local dev is behind origin/dev, refuse and say so.
        echo "── publish dev → origin (ff-only) ──────────"
        if [ "$START" = "dev" ]; then
          git merge-base --is-ancestor origin/dev dev \
            || { echo "ERROR: local dev is behind origin/dev — 'git pull' dev before shipping." >&2; exit 1; }
          git push origin dev
        else
          echo "  (on '$START', not dev — promoting origin/dev as already published; push your dev work first)"
        fi
        echo "── merge origin/dev → main ──────────"
        git checkout -B main origin/main
        git merge --no-edit origin/dev
        git merge-base --is-ancestor origin/dev HEAD \
          || { echo "ERROR: dev not fully merged into main — resolve and retry." >&2; exit 1; }
        echo "── push main ($(git rev-parse --short HEAD)) ──"
        git push origin main
        git checkout "$START"
        echo "  shipped: origin/main now carries dev. Deploy with 'task prod:deploy'."

  prod:release:
    desc: One-command release — ship dev → main, then deploy to prod (prod:ship + prod:deploy)
    cmds:
      - task: prod:ship
      - task: prod:deploy

  prod:deploy:
    desc: Deploy to prod — sync the prod clone to origin/main, rebuild + restart the compose stack
    cmds:
      - task: prod:deploy-backend

  prod:deploy-backend:
    desc: Hard-sync the prod clone to origin/main, tag the current image for rollback, rebuild + restart, health-check
    cmds:
      - |
        set -euo pipefail
        cd "{{.PROD_REPO}}"
        echo "── prod clone: $(pwd) ───────────────"
        # The prod clone is a deploy artifact that must EXACTLY mirror
        # origin/main. It lives on a Windows filesystem and was checked out by
        # Windows Git, so from WSL the working tree shows spurious line-ending
        # drift — a plain `git pull` would refuse. We therefore fetch + hard
        # reset. Guard: refuse only if HEAD carries commits not on origin/main
        # (a reset would silently discard real local work). Untracked files —
        # notably the git-ignored .env.prod secrets — survive `reset --hard`.
        echo "── git fetch origin main ────────────"
        git fetch origin main
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "ERROR: prod clone HEAD has commits not on origin/main; refusing to hard-reset." >&2
          echo "       Reconcile the prod clone manually before deploying." >&2
          exit 1
        fi
        # Fail-loud stale-deploy guard. This task ONLY ever builds origin/main.
        # If origin/dev carries commits not yet merged to main, deploying here
        # silently ships stale code — exactly the 2026-09-02 incident, where prod
        # rebuilt 9-day-old main and still reported status:ok. Refuse unless the
        # operator has shipped (task prod:ship / prod:release), or explicitly
        # overrides with ALLOW_STALE=1 for a deliberate same-main rebuild
        # (e.g. redeploy after placing the Toast SFTP key).
        echo "── guard: main must be current with dev ─────"
        git fetch origin dev
        if ! git merge-base --is-ancestor origin/dev origin/main; then
          echo "ERROR: origin/dev has commits not on origin/main — prod would ship STALE code." >&2
          echo "       Run 'task prod:ship' (or 'task prod:release') first, or set ALLOW_STALE=1 to override." >&2
          [ "${ALLOW_STALE:-0}" = "1" ] || exit 1
        fi
        echo "── git reset --hard origin/main ─────"
        git reset --hard origin/main
        git checkout -B main origin/main >/dev/null 2>&1 || true
        echo "  HEAD now: $(git rev-parse --short HEAD)"
        echo "── tag current image for rollback ───"
        docker image tag {{.PROD_IMAGE}} {{.PROD_IMAGE}}-rollback 2>/dev/null \
          && echo "  {{.PROD_IMAGE}} → {{.PROD_IMAGE}}-rollback" \
          || echo "  (no current image to tag — first deploy)"
        echo "── docker compose build ─────────────"
        export GIT_SHA="$(git rev-parse --short HEAD)"
        export BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "  GIT_SHA=$GIT_SHA  BUILT_AT=$BUILT_AT"
        docker compose -f {{.PROD_COMPOSE}} build
        echo "── docker compose up -d ─────────────"
        docker compose -f {{.PROD_COMPOSE}} up -d
        echo "── health check ─────────────────────"
        sleep 3
        curl -fsS http://localhost:{{.PROD_PORT}}/api/v1/health; echo

  prod:rollback:
    desc: Restore the previous prod image (the :-rollback tag from the last deploy) and restart
    cmds:
      - |
        set -euo pipefail
        cd "{{.PROD_REPO}}"
        echo "── restoring {{.PROD_IMAGE}}-rollback → {{.PROD_IMAGE}} ──"
        docker image tag {{.PROD_IMAGE}}-rollback {{.PROD_IMAGE}}
        docker compose -f {{.PROD_COMPOSE}} up -d --no-build
        sleep 3
        curl -fsS http://localhost:{{.PROD_PORT}}/api/v1/health; echo

  prod:logs:
    desc: Tail logs from the production container
    cmd: docker logs --tail 100 -f {{.PROD_CONTAINER}}

  prod:backup:
    desc: pg_dump the prod database + cluster globals to the Windows-side disk (outside every Docker volume); keeps last 14
    # B-143/B-145: prod had NO backup of any kind when the database was dropped
    # on 2026-08-06. This target is the floor. The dump goes to the Windows
    # filesystem so it survives WSL resets, container rebuilds and volume
    # removal. Scheduled by the Windows task "YumyumsProdBackup" (schtasks),
    # NOT by in-WSL cron — WSL idles out (see the KeepWSLAlive task).
    # The globals dump exists because roles (hq_sync_fdw) are cluster-level:
    # restoring the database dump alone onto a fresh cluster loses grants
    # (measured: 5 restore errors without it).
    vars:
      BACKUP_DIR: '{{.BACKUP_DIR | default "/mnt/c/Users/jcole/yumyums-backups"}}'
      PROD_PG_CONTAINER: '{{.PROD_PG_CONTAINER | default "yumyums-dev-pg"}}'
    cmds:
      - |
        set -euo pipefail
        mkdir -p "{{.BACKUP_DIR}}"
        ts=$(date +%Y%m%d-%H%M%S)
        dump="{{.BACKUP_DIR}}/yumyums-$ts.dump"
        globals="{{.BACKUP_DIR}}/globals-$ts.sql"
        log() { echo "$(date -Is) $1" >> "{{.BACKUP_DIR}}/backup.log"; echo "$1"; }
        if ! docker exec {{.PROD_PG_CONTAINER}} pg_dump -U yumyums -Fc yumyums > "$dump"; then
          log "FAIL pg_dump exited non-zero (container {{.PROD_PG_CONTAINER}})"
          exit 1
        fi
        docker exec {{.PROD_PG_CONTAINER}} pg_dumpall -U yumyums --globals-only > "$globals"
        size=$(stat -c%s "$dump")
        # An empty/truncated dump must not silently rotate out good ones.
        if [ "$size" -lt 10000 ]; then
          log "FAIL dump suspiciously small ($size bytes): $dump — keeping, not pruning"
          exit 1
        fi
        ls -1t "{{.BACKUP_DIR}}"/yumyums-*.dump | tail -n +15 | xargs -r rm --
        ls -1t "{{.BACKUP_DIR}}"/globals-*.sql | tail -n +15 | xargs -r rm --
        # PITR base (decision 159): pg_basebackup + the WAL archive in
        # {{.BACKUP_DIR}}/wal (archive_mode=on, see infra/docker/yumyums
        # compose) recover the CLUSTER to any point ≤5min before a disaster —
        # including a dropped database, which pg_dump alone cannot do without
        # losing everything since the last nightly. -X none is deliberate:
        # WAL comes from the archive, not the backup.
        base="{{.BACKUP_DIR}}/basebackup-$ts.tar.gz"
        if docker exec {{.PROD_PG_CONTAINER}} pg_basebackup -U yumyums -c fast -Ft -z -X none -D - > "$base" 2>/dev/null; then
          ls -1t "{{.BACKUP_DIR}}"/basebackup-*.tar.gz | tail -n +15 | xargs -r rm --
          # WAL older than the oldest kept base backup is unusable; prune it.
          find "{{.BACKUP_DIR}}/wal" -type f -mtime +15 -delete 2>/dev/null || true
        else
          rm -f "$base"
          log "WARN pg_basebackup failed — nightly dump succeeded, PITR base is stale"
        fi
        log "OK $dump ($size bytes)"
