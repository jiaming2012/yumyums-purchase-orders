version: '3'

dotenv: ['backend/.env']

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend

vars:
  # Production deploy target. Prod runs in Docker on THIS box (Docker Desktop),
  # served to the public via Cloudflare Tunnel. It builds from a separate clone
  # pinned to origin/main (the "prod clone"), so prod only ever runs pushed
  # code. `task prod:deploy` pulls main there and rebuilds the compose stack.
  PROD_REPO: '{{.PROD_REPO | default "/mnt/c/Users/jcole/projects/yumyums-purchase-orders"}}'
  PROD_COMPOSE: '{{.PROD_COMPOSE | default "docker-compose.prod.yml"}}'
  PROD_CONTAINER: '{{.PROD_CONTAINER | default "yumyums-prod"}}'
  PROD_IMAGE: '{{.PROD_IMAGE | default "yumyums-purchase-orders:prod"}}'
  PROD_PORT: '{{.PROD_PORT | default "8080"}}'
  PROD_URL: '{{.PROD_URL | default "https://hq.yumyums.kitchen"}}'

  # ─────────────────────────────────────────────────────────────────────────────
  # THE TEST CLUSTER — ledger decision 155, closing B-141's structural half.
  #
  # 🛑 These are the ONLY Postgres coordinates any `test:*` task may resolve to.
  # They name `yumyums-test-pg` (docker-compose.test.yml), a container that
  # exists for no purpose but running this repo's suites.
  #
  # They are NOT :5433. :5433 is `yumyums-dev-pg` — the cluster that serves
  # https://hq.yumyums.kitchen, dev and prod alike (prod is the `production`
  # search_path on the same instance). Until 2026-08-07 every test default in
  # this repo pointed there, which is how an adversarial probe of a name guard
  # dropped the production database on 2026-08-06 with no backup (B-141, B-143).
  #
  # They are NOT :5432 either — that is infra-postgres-1 (slack-trading).
  #
  # 🛑 The role is `hqtest`, not `yumyums`, ON PURPOSE. Port-only separation
  # leaves a stale default one typo from production; a distinct role name makes
  # a missed site fail closed (`role "hqtest" does not exist`) instead of
  # authenticating against prod. Do not "simplify" these back to yumyums.
  #
  # Override for a throwaway cluster elsewhere via TEST_DB_HOST / TEST_DB_PORT /
  # TEST_DB_USER / TEST_DB_PASS. `task test:targets` prints what they resolve to.
  # ─────────────────────────────────────────────────────────────────────────────
  TEST_DB_HOST: '{{.TEST_DB_HOST | default "localhost"}}'
  TEST_DB_PORT: '{{.TEST_DB_PORT | default "5434"}}'
  TEST_DB_USER: '{{.TEST_DB_USER | default "hqtest"}}'
  TEST_DB_PASS: '{{.TEST_DB_PASS | default "hqtest"}}'
  TEST_COMPOSE: '{{.TEST_COMPOSE | default "docker-compose.test.yml"}}'
  TEST_PROJECT: '{{.TEST_PROJECT | default "yumyums-test"}}'
  TEST_CONTAINER: '{{.TEST_CONTAINER | default "yumyums-test-pg"}}'

tasks:
  sw:
    desc: Rebuild service worker with Workbox (content-hashed precache)
    cmds:
      - node build-sw.js

  # ─────────────────────────────────────────────────────────────────────────────
  # Test cluster lifecycle (decision 155). `test:db:up` is a dependency of every
  # test target, so `task test` / `task test:go` / `task test:all` bring the test
  # Postgres up themselves and no one has to remember to.
  # ─────────────────────────────────────────────────────────────────────────────
  test:db:up:
    desc: Start the test-only Postgres (yumyums-test-pg on :{{.TEST_DB_PORT}}) — idempotent, waits for healthy
    cmds:
      - docker compose -p {{.TEST_PROJECT}} -f {{.TEST_COMPOSE}} up -d
      - |
        # Wait on the container's OWN healthcheck (pg_isready) rather than
        # opening a psql connection from here: the wait must not depend on a
        # host psql being installed, and `docker inspect` cannot accidentally
        # resolve against some other cluster the way a bare `psql` can.
        for i in $(seq 1 60); do
          s=$(docker inspect -f '{{`{{.State.Health.Status}}`}}' {{.TEST_CONTAINER}} 2>/dev/null || echo missing)
          if [ "$s" = "healthy" ]; then
            echo "{{.TEST_CONTAINER}} healthy — {{.TEST_DB_HOST}}:{{.TEST_DB_PORT}} (role {{.TEST_DB_USER}})"
            exit 0
          fi
          sleep 1
        done
        echo "{{.TEST_CONTAINER}} did not become healthy within 60s (last status: ${s:-unknown})" >&2
        exit 1

  test:db:down:
    desc: Destroy the test Postgres AND its volume (deliberate — the only target here that destroys data)
    cmd: docker compose -p {{.TEST_PROJECT}} -f {{.TEST_COMPOSE}} down --volumes --remove-orphans

  test:targets:
    desc: Print every resolved test-database coordinate (READ-ONLY — opens no connection)
    cmds:
      - |
        echo "── Taskfile test cluster ────────────────────────────────"
        echo "  host:port   {{.TEST_DB_HOST}}:{{.TEST_DB_PORT}}"
        echo "  role        {{.TEST_DB_USER}}"
        echo "  container   {{.TEST_CONTAINER}}  ({{.TEST_COMPOSE}}, project {{.TEST_PROJECT}})"
        echo "  DB_TEST_URL postgres://{{.TEST_DB_USER}}:{{.TEST_DB_PASS}}@{{.TEST_DB_HOST}}:{{.TEST_DB_PORT}}/hq_test_go?sslmode=disable"
        echo ""
        echo "── Playwright e2e (scripts/reset-e2e-db.js, resolved) ───"
        node -e 'const{resolveE2eDb}=require("./scripts/reset-e2e-db");const d=resolveE2eDb({});console.log("  adminUrl    "+d.adminUrl);console.log("  testUrl     "+d.testUrl)'
        echo ""
        echo "── internal/sync RLS suite defaults ─────────────────────"
        grep -n 'defaultHQAdminURL = \|defaultFDWPort = ' backend/internal/sync/rowvisibility_rls_test.go
        echo ""
        echo "── scripts/verify-test-harness.sh probe URL ─────────────"
        grep -n "DEAD_URL='postgres" scripts/verify-test-harness.sh

  test:
    desc: Run Playwright E2E tests (set HEADED=1 for visible browser)
    # bdd:gen is NOT optional. playwright.config.js defines TWO projects —
    # `chromium` (./tests) and `bdd` (the .features-gen/ dir playwright-bdd
    # writes). Without the generation step, .features-gen/ does not exist on a
    # fresh worktree, and Playwright resolves the `bdd` project to ZERO spec
    # files: 19 of 20 run, with no error and no skip line, and the suite reports
    # success. `bdd:` (:78) and the CI task already carried this dep; `test:`
    # was the sole omission, and every card leg reported a full suite in good
    # faith while a whole project contributed nothing. BACKLOG B-09, ledger
    # T-25 decision 73; fixed by card `test-harness-fail-loud`.
    # Guarded by scripts/verify-test-harness.sh — do not remove it.
    #
    # test:db:up brings the TEST cluster (:{{.TEST_DB_PORT}}) up first, and
    # backend:db-test is handed that cluster's coordinates explicitly — without
    # the vars it would fall back to its own :5433 defaults and create the test
    # databases on the cluster serving hq.yumyums.kitchen (decision 155).
    deps:
      - test:db:up
      - task: backend:db-test
        vars:
          DB_HOST: '{{.TEST_DB_HOST}}'
          DB_PORT: '{{.TEST_DB_PORT}}'
          DB_USER: '{{.TEST_DB_USER}}'
          DB_PASS: '{{.TEST_DB_PASS}}'
      - sw
      - bdd:gen
    # These reach scripts/reset-e2e-db.js — which playwright.config.js's
    # webServer.command runs, and which DROPs the database it resolves. They
    # also override anything `dotenv: ['backend/.env']` injects.
    env:
      DB_HOST: '{{.TEST_DB_HOST}}'
      DB_PORT: '{{.TEST_DB_PORT}}'
      DB_USER: '{{.TEST_DB_USER}}'
      DB_PASS: '{{.TEST_DB_PASS}}'
    cmds:
      # The hq_test_e2e reset is NOT here any more, and its absence is the fix,
      # not an omission. It lives in playwright.config.js's `webServer.command`
      # (`node scripts/reset-e2e-db.js && …`), so EVERY `npx playwright test`
      # invocation resets — including the bare `npx playwright test` and the
      # `npx playwright test "<regex>"` subset that night-crew.toml's [e2e] stanza
      # runs directly, neither of which ever came through this task. That was
      # B-76: no night-crew gate leg, full or subset, had ever reset the database,
      # so a red could be an artifact of a previous run and so could a GREEN.
      # Keeping a second copy here would be a second source of truth for a
      # destructive operation. Guarded by tests/db-isolation.spec.js.
      - npx playwright test {{if eq (.HEADED | default "0") "1"}}--headed{{end}}

  test:ui:
    desc: Open Playwright UI mode for interactive debugging (isolated clean stack on :8091 / hq_test_ui)
    deps:
      - test:db:up
      - task: backend:db-test
        vars:
          DB_HOST: '{{.TEST_DB_HOST}}'
          DB_PORT: '{{.TEST_DB_PORT}}'
          DB_USER: '{{.TEST_DB_USER}}'
          DB_PASS: '{{.TEST_DB_PASS}}'
      - sw
    env:
      DB_HOST: '{{.TEST_DB_HOST}}'
      DB_PORT: '{{.TEST_DB_PORT}}'
      DB_USER: '{{.TEST_DB_USER}}'
      DB_PASS: '{{.TEST_DB_PASS}}'
    cmds:
      # Run UI mode on its OWN port + OWN freshly-reset database (hq_test_ui) so
      # it NEVER (a) reuses a dev server you have running on :8089 —
      # reuseExistingServer would attach to it and run the suite against, and
      # mutate, your live dev data — or (b) collides with a `task test` run using
      # hq_test on :8199. TEST_PORT + TEST_DB_NAME make playwright.config.js spawn
      # a dedicated server on :8091 backed by hq_test_ui.
      #
      # The inline psql reset that used to sit here is gone for the same reason as
      # `test:`'s — playwright.config.js's webServer.command resets whatever
      # TEST_DB_NAME names, so hq_test_ui is reset by the same single code path.
      # Its DB_PORT default was ALSO 5432 here while every other site in the repo
      # pointed at 5433; host :5432 is infra-postgres-1, which has no `yumyums`
      # role, so that block could only ever have failed. Deleting it removes the
      # inconsistency rather than perpetuating it. (Both of those ports are now
      # wrong for a test run either way — the test cluster is :{{.TEST_DB_PORT}},
      # decision 155.)
      - TEST_DB_NAME=hq_test_ui TEST_PORT=8091 TEST_OUTPUT_DIR=test-results-ui npx playwright test --ui

  bdd:gen:
    desc: Generate Playwright tests from Gherkin feature files
    cmds:
      - npx bddgen

  bdd:
    desc: Run BDD/Gherkin tests (uses the test-only Postgres; set HEADED=1 for visible browser)
    deps: [test:db:up, sw, bdd:gen]
    # Was `DB_PORT: '5432'` — infra-postgres-1, which has no `yumyums` role, so
    # this target could only ever black-hole on the reset (BACKLOG B-85). It now
    # points at the test cluster like every other test target (decision 155).
    env:
      DB_HOST: '{{.TEST_DB_HOST}}'
      DB_PORT: '{{.TEST_DB_PORT}}'
      DB_USER: '{{.TEST_DB_USER}}'
      DB_PASS: '{{.TEST_DB_PASS}}'
    cmds:
      - npx playwright test --project=bdd {{if eq (.HEADED | default "0") "1"}}--headed{{end}}

  test:go:
    desc: Run Go backend unit tests (against hq_test_go on the test cluster)
    deps:
      - test:db:up
      - task: backend:db-test
        vars:
          DB_HOST: '{{.TEST_DB_HOST}}'
          DB_PORT: '{{.TEST_DB_PORT}}'
          DB_USER: '{{.TEST_DB_USER}}'
          DB_PASS: '{{.TEST_DB_PASS}}'
    env:
      # Was postgres://yumyums:yumyums@…:5433 — the cluster serving
      # hq.yumyums.kitchen. Decision 155 moved it to the test-only container;
      # the coordinates live in ONE place (the TEST_DB_* vars at the top).
      DB_TEST_URL: 'postgres://{{.TEST_DB_USER}}:{{.TEST_DB_PASS}}@{{.TEST_DB_HOST}}:{{.TEST_DB_PORT}}/hq_test_go?sslmode=disable'
      DB_HOST: '{{.TEST_DB_HOST}}'
      DB_PORT: '{{.TEST_DB_PORT}}'
      DB_USER: '{{.TEST_DB_USER}}'
      DB_PASS: '{{.TEST_DB_PASS}}'
      # Explicitly unset any external DATABASE_URL that leaks in from the user's shell.
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
    cmds:
      # -p 1 forces packages to run serially. Multiple packages share hq_test_go
      # and each TestMain truncates tables; parallel package execution makes
      # them stomp on each other's data mid-test. (Playwright owns hq_test_e2e,
      # so the two suites can no longer collide — audit surface #3.)
      - cd backend && go test -p 1 ./...

  test:all:
    desc: Run all tests (Go unit, Playwright E2E, BDD/Gherkin) against the test-only Postgres. Resets both test DBs after the run completes.
    deps: [test:db:up, sw, bdd:gen]
    env:
      # Was localhost:5433 (yumyums-dev-pg — dev AND prod). Decision 155.
      DB_HOST: '{{.TEST_DB_HOST}}'
      DB_PORT: '{{.TEST_DB_PORT}}'
      DB_USER: '{{.TEST_DB_USER}}'
      DB_PASS: '{{.TEST_DB_PASS}}'
      # Same env scoping as test:go — see comments there.
      DB_TEST_URL: 'postgres://{{.TEST_DB_USER}}:{{.TEST_DB_PASS}}@{{.TEST_DB_HOST}}:{{.TEST_DB_PORT}}/hq_test_go?sslmode=disable'
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
    cmds:
      - |
        set +e
        # Reset hq_test on whichever DB the tests just ran against. Fires AFTER
        # Playwright (and Go) finish printing their reports, regardless of exit
        # status, so the next run starts clean (no accumulated users/sessions/
        # templates from prior runs). The CREATE is a no-op on the very next
        # boot because the server runs goose migrations on startup.
        trap '
          status=$?
          echo ""
          # 🛑 $DB_HOST/$DB_PORT/$DB_USER/$DB_PASS come from the env: block above
          # and name the TEST cluster. This psql issues DROP DATABASE; before
          # decision 155 the literal here was yumyums:yumyums@…:5433, i.e. admin
          # credentials to the cluster serving hq.yumyums.kitchen.
          echo "── resetting hq_test_go + hq_test_e2e on $DB_HOST:$DB_PORT ──"
          psql "postgres://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/postgres?sslmode=disable" \
            -c "DROP DATABASE IF EXISTS hq_test_go;" \
            -c "CREATE DATABASE hq_test_go;" \
            -c "DROP DATABASE IF EXISTS hq_test_e2e;" \
            -c "CREATE DATABASE hq_test_e2e;" >/dev/null
          exit $status
        ' EXIT
        cd backend && go test -p 1 ./... || exit $?
        cd ..
        npx playwright test

  # ─────────────────────────────────────────────────────────────────────────────
  # Production deploy — one container (backend embeds frontend), served to the
  # public via Cloudflare Tunnel at {{.PROD_URL}}. Prod runs in Docker on THIS
  # box and builds from the prod clone ({{.PROD_REPO}}), pinned to origin/main.
  # sw.js is a committed artifact, so the prod clone needs only git + docker.
  # Override repo/compose/container/image via PROD_REPO, PROD_COMPOSE,
  # PROD_CONTAINER, PROD_IMAGE env vars.
  #
  # Release flow: commit a fresh sw.js on dev → merge dev→main → push →
  # `task prod:deploy` (pulls main in the prod clone, rebuilds, restarts).
  # ─────────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────────
  # Sync spike environment (night-crew card C1 `spike-a-environment-up`).
  #
  # These are THIN WRAPPERS on purpose. All logic lives in
  # .night-crew/qa/spike-supabase/env-up.sh so the verdict reproduces without
  # `task` installed, and so the exit status the card is graded on comes from
  # one place. Do not move logic up here.
  #
  # ⚠ LOCAL THROWAWAY STACK ONLY. Compose project `spike-supabase`; never HQ
  #   prod, never docker-compose.nc.yml, never the dev Postgres on :5433.
  #
  # 🛑 `spike:down` is the ONLY target that destroys data, and that is true only
  #   because two defects were fixed on run 20260806: PGDATA now lives on the
  #   `spike-db-data` named volume (it used to live in the container's writable
  #   layer, so ANY recreate wiped it), and env-up.sh pins a stable compose
  #   `--project-directory` (the relative initdb bind mounts otherwise put the
  #   caller's absolute path into the container config hash, so `up -d` from a
  #   worktree recreated the db container). Undo either and `spike:up` becomes
  #   destructive again — silently, with `docker ps` still reading green.
  # ─────────────────────────────────────────────────────────────────────────────

  spike:up:
    desc: Bring the Supabase+RxDB spike environment up and verify it (idempotent; exit status IS the verdict)
    cmd: ./.night-crew/qa/spike-supabase/env-up.sh

  spike:up:fresh:
    desc: Destroy the spike stack's volumes, then bring it up from nothing and verify (the clean-machine test)
    cmd: ./.night-crew/qa/spike-supabase/env-up.sh --fresh

  spike:health:
    desc: Verify the spike environment WITHOUT touching it — schema, RLS, Realtime, RxDB
    cmd: ./.night-crew/qa/spike-supabase/env-up.sh --health

  spike:down:
    desc: Destroy the spike stack and the spike-db-data volume (deliberate, separate act — the only target that destroys data)
    cmd: docker compose -p spike-supabase -f docker-compose.supabase.yml down --volumes --remove-orphans

  # ─────────────────────────────────────────────────────────────────────────────
  # PERSISTENT SYNC DATA PLANE — card `sync-live-in-dev-substrate` (Activity 5,
  # run 20260810), legs 1+2 + FDW persistence.
  #
  # Where the spikes and `task demo:sync` stand the data plane up inside one script
  # run and tear it down, this family keeps it UP in the operator's dev
  # environment, BETWEEN runs, so the workflows.html /sync/* read path is live
  # whenever `task backend:dev:tailscale` is. It productionizes the PROVEN
  # mechanics (Spike A substrate GREEN, the LISTEN/NOTIFY relay GREEN in spikes
  # C/D/E) into a persistent dev SERVICE:
  #   * substrate — reconcile bring-up (never-destroy-on-restart; spike:down stays
  #     the ONLY data-destroying target)
  #   * relay — backend/cmd/spikec-relay run as a persistent background process
  #     (nohup, pidfile), LISTENing on the dev HQ and projecting into the substrate
  #   * FDW pointing — hq_pg repointed at the operator's live dev HQ, persistently
  #     (the spike's repoint+restore made permanent)
  #
  # 🛑 These are THIN WRAPPERS. All logic lives in
  #   .night-crew/qa/spike-supabase/sync-dev-up.sh — same rule as the spike family.
  #
  # 🛑 B-164 — sync:dev:up needs the operator's LIVE dev HQ, which on this box is
  #   :5433 (yumyums-dev-pg = dev AND prod). The script REFUSES a bare :5433 target
  #   unless HQ_SYNC_DEV_ALLOW_5433=1 is set knowingly. Never run it from an
  #   unattended run. The MECHANISM is proven WITHOUT :5433 by `task sync:dev:proof`
  #   (a fresh scratch HQ on an ephemeral port — the spike-f model). Required env:
  #     HQ_SYNC_DEV_HQ_DSN   the dev HQ Postgres DSN (relay LISTEN + FDW resolve)
  #     HQ_SYNC_DEV_FDW_HOST the host the substrate reaches that dev HQ at (Docker net)
  # ─────────────────────────────────────────────────────────────────────────────

  sync:dev:up:
    desc: Bring the PERSISTENT sync data plane up in dev (substrate reconcile + relay-as-service + FDW pointing). Requires HQ_SYNC_DEV_HQ_DSN + HQ_SYNC_DEV_FDW_HOST; refuses :5433 unless HQ_SYNC_DEV_ALLOW_5433=1 (B-164)
    cmd: ./.night-crew/qa/spike-supabase/sync-dev-up.sh

  sync:dev:status:
    desc: Report the persistent sync data plane — substrate, relay pid, and the hq_pg FDW pointing — touching nothing
    cmd: ./.night-crew/qa/spike-supabase/sync-dev-up.sh --status

  sync:dev:down:
    desc: Stop the persistent relay (the substrate stays UP; use task spike:down to destroy the substrate deliberately)
    cmd: ./.night-crew/qa/spike-supabase/sync-dev-up.sh --down

  sync:dev:env:
    desc: Print the four HQ_SYNC_* vars (resolving the live substrate ports) for sourcing when running the dev server by hand
    cmd: ./.night-crew/qa/spike-supabase/sync-dev-up.sh --env

  sync:dev:proof:
    desc: Prove Card 1's two done_when items WITHOUT touching :5433 (spike-f model — fresh scratch HQ, door 503→200 red-first, relay carries a real write). Exit status IS the verdict; 0 green / 1 red / 2 could-not-run — GRADE ON THE SCRIPT, not on `task` (B-163)
    cmd: ./.night-crew/qa/spike-supabase/sync-dev-proof.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # ONE-COMMAND DEV — `task sync:dev` (card `sync-dev-one-command`, run 20260901,
  # closing B-171). Convenience, NOT policy.
  #
  # The operator's daily `dev-complete-attestation` loop needs BOTH halves up: the
  # persistent sync data plane AND the dev server that reads it. Standing them up
  # was two commands (`task sync:dev:up` then `task backend:dev:tailscale`). This
  # composes them into ONE.
  #
  # It reuses the two existing targets verbatim — it adds no logic of its own:
  #   1. sync:dev:up          — substrate reconcile + relay-as-service + FDW pointing.
  #                             This is where the B-164 :5433 refusal lives
  #                             (sync-dev-up.sh); invoking it UNCHANGED preserves the
  #                             refusal by construction. There is NO bypass here, and
  #                             none must be added — B-171's whole point is that
  #                             safety rides on credential scoping (capability), not
  #                             on more coordinate guards (detection).
  #   2. backend:dev:tailscale — the dev server. That target ALREADY resolves and
  #                             exports the four HQ_SYNC_* vars itself (its `sh:` env
  #                             blocks read the live substrate ports — backend/
  #                             Taskfile.yml). We do NOT re-derive or duplicate the
  #                             credential wiring; `task sync:dev:env` remains the
  #                             hand-run path for anyone launching the server another
  #                             way. Step 2 is long-running (it IS the server) and is
  #                             deliberately last, so `task sync:dev` runs the data
  #                             plane up, then hands the terminal to the server.
  #
  # 🛑 Like sync:dev:up, this needs the operator's LIVE dev HQ (HQ_SYNC_DEV_HQ_DSN +
  #   HQ_SYNC_DEV_FDW_HOST) and REFUSES a bare :5433 target unless the operator
  #   knowingly sets HQ_SYNC_DEV_ALLOW_5433=1. NEVER run it from an unattended run —
  #   the mechanism is proven WITHOUT :5433 by `task sync:dev:proof`.
  # ─────────────────────────────────────────────────────────────────────────────

  sync:dev:
    desc: ONE command for daily dev — bring the persistent sync data plane up (sync:dev:up) AND launch the dev server (backend:dev:tailscale, which carries the 4 HQ_SYNC_* vars). Preserves the B-164 :5433 refusal; requires HQ_SYNC_DEV_HQ_DSN + HQ_SYNC_DEV_FDW_HOST. NEVER from an unattended run
    cmds:
      - task: sync:dev:up
      - task: backend:dev:tailscale

  # ─────────────────────────────────────────────────────────────────────────────
  # Sync spike B — migration rehearsal (night-crew card S
  # `spike-b-migration-rehearsal`). Disjoint from everything above and below it.
  #
  # Thin wrapper, same rule as the spike:up family: all logic lives in
  # .night-crew/qa/spike-supabase/spike-b-migration.sh so the verdict reproduces
  # without `task` installed and comes from exactly one place.
  #
  # 🛑 The HQ-shaped Postgres this stands up is a FRESH SCRATCH CONTAINER under
  #   its own compose project `spike-b-hq`, on a DOCKER-ASSIGNED EPHEMERAL host
  #   port — never :5433 (that cluster is PRODUCTION; a probe there destroyed the
  #   prod database on 2026-08-06), never :5434 (`yumyums-test-pg`), never 5432.
  #   The script asserts that before it starts anything. It creates the container
  #   and destroys it again, so this target is re-runnable from nothing.
  #
  #   It calls env-up.sh in RECONCILE mode — it does not destroy spike A's stack.
  # ─────────────────────────────────────────────────────────────────────────────

  spike:migration:
    desc: Spike B — migrate HQ-shaped fixture data into the Supabase substrate and prove it surfaces in RxDB (exit status IS the verdict)
    cmd: ./.night-crew/qa/spike-supabase/spike-b-migration.sh

  spike:migration:keep:
    desc: Spike B, leaving the scratch HQ-shaped Postgres running afterwards for hand-debugging
    cmd: ./.night-crew/qa/spike-supabase/spike-b-migration.sh --keep

  # ─────────────────────────────────────────────────────────────────────────────
  # Sync spike C — the round trip (night-crew card C `spike-c-round-trip`).
  # Disjoint from everything above and below it.
  #
  # Thin wrapper, same rule as the spike:up and spike:migration families: all
  # logic lives in .night-crew/qa/spike-supabase/spike-c-roundtrip.sh so the
  # verdict reproduces without `task` installed and comes from exactly one place.
  #
  # 🛑 THE EXIT-CODE CONTRACT IS THE DELIVERABLE, and "could not run" is NOT a
  #   verdict:
  #     0   GREEN — a row written through the REAL /saveResponse reached a
