<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c447c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yumyums">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<title>Yumyums Marketing</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--txt:#1a1a1a;--mut:#6b6b6b;--brd:rgba(0,0,0,0.08);--info-bg:#e6f1fb;--info-tx:#0c447c;--warn-bg:#faeeda;--warn-tx:#854f0b;--ok-bg:#dcfce7;--ok-tx:#14532d;--bad-bg:#fee2e2;--bad-tx:#7f1d1d}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#262626;--txt:#f0f0f0;--mut:#999;--brd:rgba(255,255,255,0.1);--info-bg:#0c447c;--info-tx:#b5d4f4;--warn-bg:#633806;--warn-tx:#fac775;--ok-bg:#14532d;--ok-tx:#dcfce7;--bad-bg:#7f1d1d;--bad-tx:#fecaca}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.app{max-width:480px;margin:0 auto;padding-top:12px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--info-tx);text-decoration:none;font-size:16px;font-weight:500;margin-bottom:12px;cursor:pointer;min-height:44px;padding:4px 8px 4px 0;-webkit-tap-highlight-color:transparent}
.back::before{content:'‹';font-size:20px;line-height:1;margin-top:-1px}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:none;padding:10px 4px;font-size:13px;border-radius:7px;background:transparent;color:var(--txt);font-weight:500}
.tabs button.on{background:var(--info-bg);color:var(--info-tx)}
.card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px}
.hd{padding:14px 16px;border-bottom:0.5px solid var(--brd)}
.hd h1{font-size:15px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--mut);margin-top:4px}
.bd{padding:16px;font-size:13px;color:var(--mut);line-height:1.5}
.soon-card{position:relative;opacity:0.7}
.badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:500;padding:2px 7px;border-radius:8px;background:var(--brd);color:var(--mut);letter-spacing:0.2px}
#scanner-host{display:flex;flex-direction:column;gap:10px}
.scan-status{font-size:12px;color:var(--mut)}
.scan-status [data-boot-fail]{color:var(--txt);line-height:1.5}
.scan-status [data-boot-fail] a{color:var(--info-tx)}
.scan-status details{margin-top:4px;color:var(--mut)}
.scan-status summary{cursor:pointer}
.scan-status code{display:block;margin-top:4px;font-size:11px;word-break:break-word;white-space:pre-wrap}
#scan-camera-wrap{border:1.5px dashed var(--brd);border-radius:10px;min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scan-camera-wrap.live{border-style:solid;min-height:220px}
#scan-camera-view{width:100%}
#scan-camera-view video{width:100%;border-radius:10px;display:block}
.cam-error{background:var(--bad-bg);color:var(--bad-tx);border-radius:10px;padding:12px;font-size:13px;line-height:1.45}
#scan-controls{display:flex;gap:8px;flex-wrap:wrap}
#scan-controls button,#scan-controls .btn-file{flex:1;min-height:44px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:var(--info-bg);color:var(--info-tx);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:10px 12px}
#scan-controls .btn-file{background:var(--card);border:1px solid var(--brd);color:var(--txt);font-weight:500}
#scan-controls [hidden]{display:none}
.rc{border-radius:12px;padding:14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.rc-ok{background:var(--ok-bg);color:var(--ok-tx)}
.rc-warn{background:var(--warn-bg);color:var(--warn-tx)}
.rc-bad{background:var(--bad-bg);color:var(--bad-tx)}
.rc-head{font-size:17px;font-weight:700}
.badge-inline{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,0.12);vertical-align:middle;letter-spacing:0.3px}
.offer-row{background:rgba(255,255,255,0.55);border-radius:8px;padding:10px 12px;margin-top:6px}
@media(prefers-color-scheme:dark){.offer-row{background:rgba(0,0,0,0.25)}}
.offer-main{font-weight:600}
.offer-sub{font-size:12px;opacity:0.85;margin-top:2px}
.offer-sub.struck{text-decoration:line-through}
.result-note{font-size:12px;opacity:0.9;line-height:1.45}
.scan-again{min-height:44px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:rgba(255,255,255,0.7);color:var(--txt);cursor:pointer}
@media(prefers-color-scheme:dark){.scan-again{background:rgba(0,0,0,0.3);color:#f0f0f0}}
/* ── redemption submit flow (card redemption-submit-flow) ── */
#scan-conn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--card);border:1px solid var(--brd)}
#scan-conn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
#scan-conn[data-conn=online]{color:var(--ok-tx);background:var(--ok-bg)}
#scan-conn[data-conn=online]::before{background:currentColor}
#scan-conn[data-conn=offline]{color:var(--bad-tx);background:var(--bad-bg)}
#scan-conn[data-conn=offline]::before{background:currentColor}
#scan-conn[data-conn=stale]{color:var(--warn-tx);background:var(--warn-bg)}
#scan-conn[data-conn=stale]::before{background:currentColor}
#ms-flow{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ms-field{display:flex;flex-direction:column;gap:4px}
.ms-field label{font-size:12px;font-weight:600}
.ms-req{font-weight:400;opacity:0.75}
#ms-order{min-height:44px;border:1px solid var(--brd);border-radius:10px;padding:8px 12px;font-size:17px;background:var(--card);color:var(--txt);width:100%}
.ms-err{font-size:12px;color:var(--bad-tx);background:var(--bad-bg);border-radius:8px;padding:6px 10px}
.ms-btn{min-height:44px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 12px;width:100%}
.ms-btn[disabled]{opacity:0.45;cursor:default}
.ms-btn-go{background:var(--info-bg);color:var(--info-tx)}
.ms-btn-warn{background:var(--warn-bg);color:var(--warn-tx);border:1px solid rgba(0,0,0,0.12)}
.ms-btn-quiet{background:rgba(255,255,255,0.7);color:var(--txt)}
@media(prefers-color-scheme:dark){.ms-btn-quiet{background:rgba(0,0,0,0.3);color:#f0f0f0}}
.ms-note{font-size:12px;opacity:0.9;line-height:1.45}
.ms-auto{opacity:0.7;font-style:italic}
#ms-gate,#ms-confirm{display:flex;flex-direction:column;gap:8px;border-radius:10px;padding:12px;background:rgba(255,255,255,0.55)}
@media(prefers-color-scheme:dark){#ms-gate,#ms-confirm{background:rgba(0,0,0,0.25)}}
.ms-gate-head{font-size:15px;font-weight:700}
.ms-warn-line{font-size:13px;color:var(--bad-tx);background:var(--bad-bg);border-radius:8px;padding:8px 10px}
.ms-card{display:flex;flex-direction:column;gap:8px;border-radius:10px;padding:12px}
.ms-card-ok{background:var(--ok-bg);color:var(--ok-tx)}
.ms-card-warn{background:var(--warn-bg);color:var(--warn-tx)}
.ms-card-bad{background:var(--bad-bg);color:var(--bad-tx)}
.ms-head{font-size:17px;font-weight:700}
/* finish-first prompt: a real modal — overlay controls stay clear of native
   chrome (UI-R1), the way out is labeled and 44px (UI-R2) */
#scan-prompt{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(env(safe-area-inset-bottom) + 40px);z-index:60}
#scan-prompt .ms-sheet{background:var(--card);color:var(--txt);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:360px;width:100%}
.warnbanner{max-width:480px;margin:12px auto 0;padding:9px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-tx);font-size:13px;font-weight:500;text-align:center;line-height:1.4}
.warnbanner-admin{max-width:480px;margin:8px auto 0;padding:9px 14px;border-radius:10px;border:0.5px solid var(--warn-tx);color:var(--warn-tx);font-size:12px;font-weight:500;text-align:center;line-height:1.4}
.warnbanner-diag{margin:6px 0 0;padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.18);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400;text-align:left;white-space:pre-wrap;user-select:all;-webkit-user-select:all}
</style>
</head>
<body>
<!-- Scan & redeem runs on the sync substrate; if it is down, codes cannot be verified. Rendered by health-banner.js. -->
<div id="health-banners" hidden></div>

<div class="app">
  <a class="back" href="index.html">HQ &nbsp;&#183;&nbsp; Marketing</a>

  <div class="tabs">
    <button id="t1" class="on" onclick="show(1)">Scan</button>
    <button id="t2" onclick="show(2)">Campaigns</button>
    <button id="t3" onclick="show(3)">Subscribers</button>
    <button id="t4" onclick="show(4)">Stats</button>
  </div>

  <!-- ═══ SECTION 1: SCAN — the live sub-section ═══ -->
  <div id="s1">
    <div class="card">
      <div class="hd"><h1>Scan to Redeem</h1><div class="sub">Point the camera at a customer's QR code</div></div>
      <div class="bd">
        <!-- #scanner-host is the contract with camera-scanner-decode /
             redemption-submit-flow: the camera view, offer display and submit
             flow mount HERE. Keep the id stable.
             Card 5 (camera-scanner-decode) populated it; Card 6
             (redemption-submit-flow) mounts the order-number + submit flow
             into #scan-submit-slot inside #scan-result (see
             marketing/scan-page.js and the card's merge-intent for the full
             DOM + window.MarketingScan contract). -->
        <div id="scanner-host">
          <div id="scan-status" class="scan-status"></div>
          <div id="scan-camera-wrap"><div id="scan-camera-view"></div></div>
          <div id="scan-cam-error" class="cam-error" hidden></div>
          <div id="scan-controls">
            <button data-action="start-camera">&#x1f4f7; Start camera</button>
            <label class="btn-file" for="scan-file">Scan from photo</label>
            <input type="file" id="scan-file" accept="image/*" hidden>
          </div>
          <!-- file-scan work surface: offscreen, NOT display:none — html5-qrcode
               owns this element during scanFile and a rendered box is the shape
               the spike proved. -->
          <div id="scan-file-surface" style="position:absolute;left:-9999px;width:320px;height:320px;overflow:hidden" aria-hidden="true"></div>
          <div id="scan-result" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ SECTION 2: CAMPAIGNS — card h2-campaigns-tab-ui (run 20261002) ═══
       Design of record: *Current Campaigns 1–8*. Contract: the handoff
       docs/handoffs/HANDOFF-marketing-campaigns-subscribers-stats.md §5,
       served by backend/internal/marketing (card H1).

       🛑 THIS CARD OWNS #s2 AND ONLY #s2. The style block and the module tag
       below live INSIDE this wrapper on purpose: #s3 (Subscribers, card H5)
       and #s4 (the reconciliation queue, card H4) are two other cards' and
       must not lose theirs at merge. Every class here is `mc-`-prefixed and
       every selector campaigns.js reads is under #mc-root, so three sections
       can carry three style blocks in one file without reaching each other.

       #mc-root is the ONE delegation container (one click + one input
       listener, routed by data-action / data-field) and the ONE state
       projection: data-view ∈ list|create|ready|detail|code, data-status ∈
       idle|loading|ok|empty|error|offline|locked. The specs read both. ═══ -->
  <div id="s2" style="display:none">
    <style>
#mc-root{display:flex;flex-direction:column;gap:8px}
#mc-root .card{margin-bottom:0}
.mc-chrome{display:flex;gap:8px;align-items:stretch}
.mc-seg{flex:1;display:flex;gap:2px;background:var(--card);border-radius:10px;padding:3px}
.mc-seg button{flex:1;border:none;background:transparent;color:var(--txt);font-size:13px;font-weight:500;border-radius:7px;min-height:38px;padding:4px 2px}
.mc-seg button.on{background:var(--info-bg);color:var(--info-tx)}
.mc-btn{min-height:44px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 12px;width:100%;display:flex;align-items:center;justify-content:center;gap:4px}
.mc-btn[disabled]{opacity:.45;cursor:default}
.mc-btn-go{background:var(--info-bg);color:var(--info-tx)}
.mc-btn-quiet{background:var(--card);color:var(--txt);border:1px solid var(--brd)}
.mc-icon{width:48px;flex:none;font-size:19px;padding:0}
.mc-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--info-tx);font-size:16px;font-weight:500;min-height:44px;padding:4px 8px 4px 0;cursor:pointer;align-self:flex-start}
.mc-back::before{content:'\2039';font-size:20px;line-height:1}
.mc-banner{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.45}
.mc-banner-warn{background:var(--warn-bg);color:var(--warn-tx)}
.mc-banner-bad{background:var(--bad-bg);color:var(--bad-tx)}
.mc-banner-t{font-size:15px;font-weight:700}
.mc-banner-s{opacity:.9}
.mc-banner .mc-btn{background:rgba(255,255,255,.7);color:var(--txt);border:none}
@media(prefers-color-scheme:dark){.mc-banner .mc-btn{background:rgba(0,0,0,.3);color:#f0f0f0}}
.mc-cards{display:flex;flex-direction:column;gap:8px}
.mc-card{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:30px;cursor:pointer}
.mc-name{font-size:16px;font-weight:700;line-height:1.25;flex:1;min-width:0;overflow-wrap:anywhere}
.mc-pills{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.mc-pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.mc-pill-ok{background:var(--ok-bg);color:var(--ok-tx)}
.mc-pill-warn{background:var(--warn-bg);color:var(--warn-tx)}
.mc-pill-info{background:var(--info-bg);color:var(--info-tx)}
.mc-pill-mut{background:var(--brd);color:var(--mut)}
.mc-pill-np{background:var(--warn-bg);color:var(--warn-tx)}
/* .mc-pill is nowrap because a status chip must never break; the BLOCK variant
   is a sentence, so it has to undo that or it clips at the card edge — which is
   exactly what the first states screenshot of the "N codes ready" screen
   showed. */
.mc-pill-block{display:block;text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;padding:8px 10px;line-height:1.4;text-align:left;margin:4px 0 0;white-space:normal;overflow-wrap:anywhere}
.mc-offer{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.mc-offer-tap{cursor:pointer}
.mc-more{font-size:12px;font-weight:600;color:var(--info-tx);margin-left:6px;white-space:nowrap}
.mc-meta{font-size:12px;color:var(--mut);line-height:1.5}
.mc-funnel{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:10px;padding:10px 6px}
.mc-leg{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mc-leg .mc-n{font-size:19px;font-weight:700;line-height:1}
.mc-leg .mc-l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.mc-arrow{color:var(--mut);font-size:15px;flex:none}
.mc-money{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.mc-cell{display:flex;flex-direction:column;gap:1px;min-width:0}
.mc-cell .mc-l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.mc-cell .mc-v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mc-per{margin-left:auto;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--info-bg);color:var(--info-tx);white-space:nowrap}
.mc-basis{font-size:11px;color:var(--mut)}
.mc-skel{height:118px;border-radius:12px;background:var(--card);position:relative;overflow:hidden}
.mc-skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--brd),transparent);animation:mc-sh 1.1s infinite}
@keyframes mc-sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.mc-empty-h{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:6px}
.mc-form{display:flex;flex-direction:column;gap:12px}
.mc-field{display:flex;flex-direction:column;gap:5px}
.mc-field>label{font-size:12px;font-weight:700;letter-spacing:.2px}
.mc-field input,.mc-field select{min-height:44px;border:1px solid var(--brd);border-radius:10px;padding:8px 12px;font-size:16px;background:var(--card);color:var(--txt);width:100%;font-family:inherit}
.mc-field select[disabled],.mc-field input[disabled]{opacity:.6}
.mc-two{display:flex;gap:10px}
.mc-two>.mc-field{flex:1;min-width:0}
.mc-money-in{display:flex;align-items:center;gap:6px}
.mc-money-in span{font-size:15px;color:var(--mut);flex:none}
.mc-hint{font-size:11px;color:var(--mut);line-height:1.45}
.mc-chips{display:flex;flex-wrap:wrap;gap:6px}
.mc-chip{min-height:38px;border:1px solid var(--brd);border-radius:19px;background:var(--card);color:var(--txt);font-size:13px;font-weight:500;padding:6px 13px;cursor:pointer}
.mc-chip.on{background:var(--info-bg);color:var(--info-tx);border-color:transparent;font-weight:700}
.mc-preview{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.mc-preview-row{display:flex;align-items:baseline;gap:8px;font-size:12px}
.mc-preview-row.mut{color:var(--mut)}
.mc-preview-ch{font-weight:700;flex:none}
.mc-preview-row code{font-size:11px;color:var(--mut);word-break:break-all}
.mc-err{background:var(--bad-bg);color:var(--bad-tx);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.45}
.mc-ready{text-align:center}
.mc-ready .bd{display:flex;flex-direction:column;gap:10px;color:var(--txt)}
.mc-ready-tick{width:52px;height:52px;margin:4px auto 0;border-radius:50%;background:var(--ok-bg);color:var(--ok-tx);font-size:28px;line-height:52px;font-weight:700}
.mc-ready-h{font-size:22px;font-weight:700}
.mc-ready-s{font-size:13px;color:var(--mut);line-height:1.45}
.mc-ready-list{display:flex;flex-direction:column;gap:6px;text-align:left}
.mc-ready-row,.mc-code-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:11px 12px;min-height:48px;cursor:pointer}
.mc-ready-ch,.mc-code-ch{font-size:14px;font-weight:600;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mc-code-pl{font-size:11px;font-weight:400;color:var(--mut)}
.mc-short{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700;letter-spacing:1px}
.mc-code-sc{font-size:11px;color:var(--mut);white-space:nowrap}
.mc-go{color:var(--mut);font-size:17px;flex:none}
.mc-codes{display:flex;flex-direction:column;gap:6px;padding:12px 16px 16px}
.mc-money-card{display:flex;flex-direction:column;gap:0;color:var(--txt)}
.mc-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:.5px solid var(--brd)}
.mc-row:last-child{border-bottom:none}
.mc-row .mc-l{font-size:13px;color:var(--mut)}
.mc-row .mc-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc-row.mc-strong .mc-v{font-size:19px;font-weight:700}
.mc-code-sheet{display:flex;flex-direction:column;gap:10px}
.mc-qr{width:100%;max-width:280px;aspect-ratio:1;align-self:center;background:#fff;border-radius:12px;padding:10px;display:block}
.mc-payload{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--mut);text-align:center;word-break:break-all;line-height:1.5}
.mc-note{background:var(--info-bg);color:var(--info-tx);border-radius:8px;padding:9px 11px;font-size:13px;text-align:center;line-height:1.45}
/* A failed WRITE is loud but NOT destructive — it sits above the card it
   failed on, it never replaces it (G6 F2). */
.mc-note-bad{background:var(--bad-bg);color:var(--bad-tx);text-align:left;font-weight:600}
.mc-actions{display:flex;gap:6px}

  <!-- ═══ SECTION 3: SUBSCRIBERS — card H5 `subscribers-tab` (run 20261002) ═══
       Design "Current Subscribers 1–2"; wire shapes HANDOFF §5.
       #subs-root is the contract with marketing/subscribers.js: that module
       owns everything inside it, holds the ONE delegated click listener and the
       ONE delegated input listener, and renders from state. Keep the id stable.
       The <style> below lives INSIDE this section deliberately — a style
       element applies document-wide wherever it sits, and keeping it here means

  <div id="s3" style="display:none">
    <style>
    .subs-counts{display:flex;border-top:0.5px solid var(--brd)}
    .subs-stat{flex:1;padding:12px 8px;text-align:center;border-right:0.5px solid var(--brd)}
    .subs-stat:last-child{border-right:none}
    .subs-stat b{display:block;font-size:19px;font-weight:700;line-height:1.2}
    .subs-stat span{font-size:11px;color:var(--mut)}
    .subs-banner{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.45;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    .subs-banner-bad{background:var(--bad-bg);color:var(--bad-tx)}
    .subs-banner-warn{background:var(--warn-bg);color:var(--warn-tx)}
    .subs-refused{display:block;width:100%;line-height:1.45}
    .subs-retry{margin-left:auto;min-height:36px;padding:6px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;background:rgba(0,0,0,0.12);color:inherit;cursor:pointer}
    .subs-controls{padding:12px;display:flex;flex-direction:column;gap:8px}
    #subs-q,#subs-source{min-height:44px;width:100%;border:1px solid var(--brd);border-radius:10px;padding:8px 12px;font-size:16px;background:var(--bg);color:var(--txt);-webkit-appearance:none}
    .subs-chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .subs-chip{flex:none;min-height:36px;padding:7px 13px;border:1px solid var(--brd);border-radius:18px;background:transparent;color:var(--txt);font-size:13px;font-weight:500;cursor:pointer}
    .subs-chip.on{background:var(--info-bg);color:var(--info-tx);border-color:transparent;font-weight:600}
    .subs-row{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:60px;padding:12px 14px;border:none;border-bottom:0.5px solid var(--brd);background:transparent;color:var(--txt);text-align:left;font-family:inherit;cursor:pointer}
    .subs-row:last-child{border-bottom:none}
    .subs-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    /* long content: the name and the contact line clamp to one line each with
       an ellipsis; the full value is on the detail sheet, which is what the tap
       opens. Nothing is ever hidden with no way to read it. */
    .subs-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .subs-meta{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .subs-dot{margin:0 5px}
    .subs-none{opacity:0.75;font-style:italic}
    .subs-row-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
    .subs-consent{font-size:10px;font-weight:700;letter-spacing:0.3px;padding:2px 7px;border-radius:8px}
    .subs-pill-ok{background:var(--ok-bg);color:var(--ok-tx)}
    .subs-pill-info{background:var(--info-bg);color:var(--info-tx)}
    .subs-pill-bad{background:var(--bad-bg);color:var(--bad-tx)}
    .subs-pill-mut{background:var(--brd);color:var(--mut)}
    .subs-joined,.subs-visits{font-size:11px;color:var(--mut)}
    .subs-empty .bd{color:var(--txt)}
    .subs-empty .bd b{display:inline-block;margin-bottom:4px}
    .subs-skel{display:inline-block;height:13px;width:60%;border-radius:4px;background:var(--brd)}
    .subs-skel-sm{width:35%;height:11px}
    .subs-skel-lg{height:19px;width:45%;margin-bottom:8px}
    .subs-row-skel{flex-direction:column;gap:6px;align-items:flex-start}
    /* The sheet is a real modal. Its bottom padding clears the home indicator
       and its way out is labeled and 44px (UI-R1 / UI-R2). */
    .subs-sheet{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:70;padding:24px 0 0}
    .subs-sheet-card{background:var(--card);color:var(--txt);border-radius:14px 14px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .subs-close{float:right;min-height:44px;padding:8px 14px;border:none;border-radius:10px;background:var(--brd);color:var(--txt);font-size:14px;font-weight:600;cursor:pointer}
    .subs-sheet-name{font-size:19px;font-weight:700;margin:4px 0 6px}
    .subs-block{margin-top:16px;padding-top:12px;border-top:0.5px solid var(--brd)}
    .subs-block h3{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:0.4px;margin:0 0 8px}
    .subs-block>div{font-size:14px;line-height:1.55}
    .subs-sub{font-size:12px;color:var(--mut);line-height:1.45;margin-top:4px}
    #subs-resend{margin-top:10px;width:100%;min-height:44px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:var(--info-bg);color:var(--info-tx);cursor:pointer}
    #subs-resend[disabled]{opacity:0.45;cursor:default}
    .subs-evidence,.subs-stop{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.45}
    .subs-stop{color:var(--bad-tx);font-weight:600}
    .subs-event{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--brd);font-size:13px}
    .subs-event:last-child{border-bottom:none}
    .subs-event-at{flex:none;color:var(--mut);font-size:12px}
    .subs-offer{display:flex;flex-direction:column;padding:7px 0;border-bottom:0.5px solid var(--brd);font-size:13px}
    .subs-offer:last-child{border-bottom:none}
    .subs-offer span{color:var(--mut);font-size:12px}
    </style>
    <div id="subs-root" data-state="loading"></div>
  </div>

  <!-- ═══ SECTION 4: REDEMPTION STATS — labeled placeholder ═══ -->
  <div id="s4" style="display:none">

      <div class="hd"><h1>Redemption stats</h1><div class="sub">Counts and orphan rate</div></div>
      <div class="bd">Redemption counts and reconciliation health will live here. Manager-only.</div>
    </div>
  </div>
</div>
<script>
// Marketing — page shell (card marketing-tile-and-page, run 20260905; design
// docs/qr-offline-redemption-handoff.md §16). Scan is the only live sub-section
// tonight: cards camera-scanner-decode and redemption-submit-flow mount the
// camera + submit flow into #scanner-host. Campaigns / Subscribers / Stats are
// labeled placeholders. Their eventual backend gates are §16's permissions
// table (view/create campaigns & stats = manager tier), enforced INSIDE the
// handlers once those endpoints exist — the tab is not the gate. Meanwhile the
// slugs carry N/A-with-reason records in tests/grant-enforcement-parity.spec.js.
function show(n){
  [1,2,3,4].forEach(i=>{
    document.getElementById('s'+i).style.display=i===n?'block':'none';
    document.getElementById('t'+i).className=i===n?'on':'';
  });
}
// Auth probe — same convention as the other tool pages: 401 → login. Offline
// the shell stays usable (the launcher rule); data surfaces gate server-side.
(async function(){
  try{
    const res=await fetch('/api/v1/me');
    if(res.status===401){window.location.href='/login.html';}
  }catch(e){}
})();
document.addEventListener('dblclick',e=>e.preventDefault());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
<!-- The scanner (card camera-scanner-decode): html5-qrcode vendored as ONE
     single-file classic script (the spike's proven no-build pattern, 375,364 B,
     committed + precached in lib/ beside chart.umd.min.js), then the module
     entry point that wires decode → on-device hash → replica-first resolution.
     Order matters: defer + module scripts execute in insertion order, so
     Html5Qrcode is global before scan-page.js runs. -->
<script src="lib/html5-qrcode.min.js" defer></script>
<!-- The submit flow's statechart engine (card redemption-submit-flow): XState
     v5.32.6 vendored as ONE single-file classic UMD script (47,268 B, the
     SortableJS pattern; operator-resolved engine fork). Classic scripts with
     defer run before the module scripts below, so window.XState exists when
     marketing/submit-flow.js boots. -->
<script src="lib/xstate.umd.min.js" defer></script>
<script type="module" src="marketing/scan-page.js"></script>
<script type="module" src="marketing/submit-flow.js"></script>
<!-- The Subscribers tab (card H5): owns #s3 and nothing else. -->
<script type="module" src="marketing/subscribers.js"></script>
<script src="health-banner.js"></script>
<script>initHealthBanners('health-banners',["server", "substrate"]);</script>
<script src="log.js"></script><script src="ptr.js"></script>
