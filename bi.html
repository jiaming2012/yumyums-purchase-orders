<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c447c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<title>BI - Yumyums HQ</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--txt:#1a1a1a;--mut:#6b6b6b;--brd:rgba(0,0,0,0.08);--info-bg:#e6f1fb;--info-tx:#0c447c;--warn-bg:#faeeda;--warn-tx:#854f0b}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#262626;--txt:#f0f0f0;--mut:#999;--brd:rgba(255,255,255,0.1);--info-bg:#0c447c;--info-tx:#b5d4f4;--warn-bg:#633806;--warn-tx:#fac775}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.app{max-width:480px;margin:0 auto;padding-top:20px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--info-tx);text-decoration:none;font-size:16px;font-weight:500;margin-bottom:12px;cursor:pointer;min-height:44px;padding:4px 8px 4px 0;-webkit-tap-highlight-color:transparent}
.back::before{content:'‹';font-size:20px;line-height:1;margin-top:-1px}
/* Hub (B-455 / WO-2a, reused by WO-2b): the page opens on a list of destinations, each row
   carrying its own live status, in place of the tab bar. Every section is a
   full page with a back link to the hub (#back-hub). Copied from inventory.html; here the rows are
   #t1 Trends and #t2 Food cost. */
.hub{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.hub-row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;background:var(--card);border:0.5px solid var(--brd);border-radius:12px;color:var(--txt);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hub-row:active{opacity:.7}
.hub-row.dim .hub-ic,.hub-row.dim .hub-chev{opacity:.5}
.hub-row.dim .hub-t{color:var(--mut)}
.hub-ic{font-size:22px;width:30px;text-align:center;flex:none}
.hub-body{flex:1;min-width:0}
.hub-t{display:block;font-weight:600;font-size:15px}
.hub-s{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.hub-b{flex:none;max-width:45%;padding:2px 8px;border-radius:10px;background:var(--warn-bg);color:var(--warn-tx);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* :empty hides a badge with nothing to say; the loading skeleton is empty on
   purpose and must still paint, hence the :not. */
.hub-b:empty:not(.skel){display:none}
.hub-b.skel{display:inline-block;width:64px;height:18px;padding:0;background:var(--brd);animation:pulse 1.2s infinite}
.hub-chev{flex:none;color:var(--mut);font-size:18px;line-height:1}
.card{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:8px}
/* BI hub badges are READINGS (latest week's spend, average food cost), not
   warnings, so they take the muted variant rather than Inventory's warn tone. */
.hub-b.mut{background:var(--brd);color:var(--txt)}
.inline-error{font-size:13px;color:#c0392b;margin-top:8px;text-align:center}
.chart-wrap{position:relative;width:100%;height:220px}
/* ── Food cost (#s2, formerly Inventory's #s6) — FR-4. Inline CSS bars only, no charting dependency. ── */
.cost-window{font-size:12px;color:var(--mut);margin:0 0 12px}
.cost-empty{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;padding:32px 20px;text-align:center}
.cost-empty h3{font-size:16px;font-weight:600;color:var(--txt);margin:0 0 8px}
.cost-empty p{font-size:13px;color:var(--mut);margin:0 0 6px;line-height:1.5}
.cost-empty p:last-child{margin-bottom:0}
.cost-sparse-note{background:var(--info-bg);color:var(--info-tx);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.cost-sparse-note strong{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.cost-sparse-note span{font-size:12px;line-height:1.45;display:block;opacity:.85}
.cost-mover-strip{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.cost-mover-title{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:2px}
.cost-mover-sub{font-size:11px;color:var(--mut);margin-bottom:10px}
.cost-mover-side{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px}
.cost-mover-side:first-of-type{margin-top:0}
.cost-mover-row{margin-bottom:8px}
.cost-mover-row:last-child{margin-bottom:0}
.cost-mover-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:3px}
.cost-mover-name{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cost-mover-val{color:var(--txt);font-weight:600;white-space:nowrap}
.cost-mover-track{height:6px;border-radius:3px;background:var(--brd);overflow:hidden}
.cost-mover-fill{height:100%;border-radius:3px;background:var(--info-tx);display:block}
.cost-mover-fill.neg{background:#b91c1c}
@media(prefers-color-scheme:dark){.cost-mover-fill{background:var(--info-tx)}.cost-mover-fill.neg{background:#f87171}}
.cost-table-wrap{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cost-table{width:100%;border-collapse:collapse;font-size:12px}
.cost-table th{font-size:11px;font-weight:600;color:var(--mut);text-align:right;padding:10px 5px;border-bottom:0.5px solid var(--brd);white-space:nowrap;cursor:pointer;user-select:none}
.cost-table th:first-child{text-align:left;padding-left:12px}
.cost-table th:last-child{padding-right:12px}
.cost-table th .cost-arrow{opacity:.45;font-size:9px;margin-left:2px}
.cost-table th.sorted{color:var(--info-tx)}
.cost-table th.sorted .cost-arrow{opacity:1}
.cost-table td{padding:10px 5px;text-align:right;color:var(--txt);white-space:nowrap;border-bottom:0.5px solid var(--brd);vertical-align:top}
.cost-table td:first-child{text-align:left;padding-left:12px;white-space:normal}
.cost-table td:last-child{padding-right:12px}
.cost-table tbody tr:last-child td{border-bottom:none}
.cost-item-name{font-weight:500;color:var(--txt);min-width:92px;max-width:130px;overflow-wrap:break-word}
.cost-item-group{font-size:11px;color:var(--mut);margin-top:1px}
.cost-null{color:var(--mut)}
.cost-neg{color:#b91c1c}
@media(prefers-color-scheme:dark){.cost-neg{color:#f87171}}
.cost-unalloc{display:inline-block;font-size:10px;font-weight:600;background:var(--warn-bg);color:var(--warn-tx);padding:1px 6px;border-radius:4px;margin-top:3px}
/* ── Trends (#s1, formerly Inventory's #s5) ──────────────────────────────────────────────────────
   Categorical palette in FIXED slot order, never cycled. Both modes were run
   through the dataviz validator (adjacent pairlist, the correct list for a
   stacked column chart) and pass every hard gate:
     light  worst adjacent CVD dE 9.1 / normal-vision dE 19.6 -> ALL PASS
     dark   worst adjacent CVD dE 8.4 / normal-vision dE 19.3 -> ALL PASS
   Light mode carries a contrast WARN on three slots (magenta/yellow/aqua sit
   below 3:1 on the light surface). That WARN is an obligation, not a dismissal:
   the relief is discharged by the always-present legend labels AND the full
   data table rendered below every chart. Do not add a 9th hue -- past eight
   groups the render folds into "Other". */
:root{--tr-1:#2a78d6;--tr-2:#008300;--tr-3:#e87ba4;--tr-4:#eda100;--tr-5:#1baf7a;--tr-6:#eb6834;--tr-7:#4a3aa7;--tr-8:#e34948;--tr-unlinked:#8a8a83;--tr-grid:rgba(0,0,0,0.10)}
@media(prefers-color-scheme:dark){:root{--tr-1:#3987e5;--tr-2:#008300;--tr-3:#d55181;--tr-4:#c98500;--tr-5:#199e70;--tr-6:#d95926;--tr-7:#9085e9;--tr-8:#e66767;--tr-unlinked:#9a9a92;--tr-grid:rgba(255,255,255,0.14)}}
.tr-window{font-size:12px;color:var(--mut);margin:0 0 12px}
.tr-empty{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;padding:32px 20px;text-align:center}
.tr-empty h3{font-size:16px;font-weight:600;color:var(--txt);margin:0 0 8px}
.tr-empty p{font-size:13px;color:var(--mut);margin:0 0 6px;line-height:1.5}
.tr-empty p:last-child{margin-bottom:0}
.tr-recon{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;padding:14px;margin-bottom:12px}
.tr-hero{border-bottom:0.5px solid var(--brd);padding-bottom:10px;margin-bottom:10px}
.tr-hero-label{display:block;font-size:12px;color:var(--mut);font-weight:500}
.tr-hero-val{display:block;font-size:26px;font-weight:600;color:var(--txt);letter-spacing:-0.5px;margin-top:2px}
.tr-hero-note{display:block;font-size:11px;color:var(--mut);margin-top:3px;line-height:1.4}
.tr-recon-row{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:4px 0}
.tr-recon-key{color:var(--mut);flex:1;min-width:0;overflow-wrap:anywhere}
.tr-recon-val{color:var(--txt);font-weight:600;white-space:nowrap}
.tr-recon-sub{font-size:11px;color:var(--mut);font-weight:400}
.tr-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;display:inline-block}
.tr-drift{background:var(--warn-bg);color:var(--warn-tx);border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.45;margin-top:10px}
.tr-unitemized{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;padding:14px;margin-bottom:12px}
.tr-unitemized-head{display:flex;align-items:baseline;gap:8px}
.tr-unitemized-label{flex:1;min-width:0;font-size:12px;color:var(--mut);font-weight:500}
.tr-unitemized-val{font-size:16px;font-weight:600;color:var(--txt);white-space:nowrap}
.tr-unitemized-sub{font-size:11px;color:var(--mut);line-height:1.45;margin-top:4px}
.tr-disclose{margin-top:8px;padding:6px 10px;min-height:32px;background:var(--bg);border:0.5px solid var(--brd);border-radius:8px;font-size:11px;font-weight:500;color:var(--info-tx);cursor:pointer;font-family:inherit}
.tr-unitemized-detail{font-size:11px;color:var(--mut);line-height:1.5;margin-top:8px;border-left:2px solid var(--brd);padding-left:10px}
.tr-chart-card{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;padding:12px 10px 10px;margin-bottom:12px}
.tr-svg{display:block;width:100%;height:auto}
.tr-col{cursor:pointer}
.tr-axis{font-size:9px;fill:var(--mut)}
.tr-gridline{stroke:var(--tr-grid);stroke-width:1}
.tr-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.tr-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt);max-width:100%;min-width:0;overflow-wrap:anywhere}
/* nowrap: observed at 390px in edge-long-name.png — a long group name pushed
   overflow-wrap:anywhere onto the amount and split it as "$2,362." / "43". */
.tr-legend-total{color:var(--mut);white-space:nowrap}
.tr-zero-note{font-size:11px;color:var(--mut);line-height:1.45;margin:10px 0 0}
.tr-week-detail{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.tr-week-detail-hd{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:6px}
.tr-wd-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.tr-wd-name{flex:1;min-width:0;color:var(--txt);overflow-wrap:anywhere}
.tr-wd-val{color:var(--txt);font-weight:600;white-space:nowrap}
.tr-wd-none{color:var(--mut);font-weight:400;font-style:italic;white-space:nowrap}
.tr-table-wrap{background:var(--card);border:0.5px solid var(--brd);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tr-table{width:100%;border-collapse:collapse;font-size:12px}
.tr-table th{font-size:11px;font-weight:600;color:var(--mut);text-align:right;padding:9px 5px;border-bottom:0.5px solid var(--brd);white-space:nowrap}
.tr-table th:first-child,.tr-table td:first-child{text-align:left;padding-left:12px}
.tr-table th:last-child,.tr-table td:last-child{padding-right:12px}
.tr-table td{padding:9px 5px;text-align:right;color:var(--txt);white-space:nowrap;border-bottom:0.5px solid var(--brd)}
.tr-table tbody tr:last-child td{border-bottom:none}
.tr-table tfoot td{font-weight:600;border-top:0.5px solid var(--brd);border-bottom:none;color:var(--txt)}
.tr-table .tr-none{color:var(--mut)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<!-- BI reads Toast sales for food cost; a failing sync means the numbers on this page are stale. Rendered by health-banner.js. -->
<div id="health-banners" hidden></div>

<div class="app">
  <!-- Two back links, one visible at a time: on the hub, back is HQ; inside a
       section, back is the hub and the crumb names the section. Same shape as
       inventory.html (B-455 / WO-2a) so the crew learns one pattern. -->
  <a class="back" id="back-hq" href="index.html">HQ &nbsp;&#183;&nbsp; BI</a>
  <a class="back" id="back-hub" href="#" onclick="show(0);return false" style="display:none">BI &nbsp;&#183;&nbsp; <span id="back-hub-name"></span></a>
  <!-- The BI hub (B-455 / WO-2b). Two rows today; the next report lands as a
       row, not a redesign. Slot ids are this page's own: #t1/#s1 Trends,
       #t2/#s2 Food cost. inventory.html's legacy #tab=5 / #tab=6 redirect here. -->
  <nav id="s0" class="hub" style="display:none" aria-label="Business Intelligence">
    <button id="t1" class="hub-row" type="button" onclick="show(1)"><span class="hub-ic" aria-hidden="true">&#x1F4C8;</span><span class="hub-body"><span class="hub-t">Trends</span><span class="hub-s" id="hub-s1">Loading&hellip;</span></span><span class="hub-b skel" id="hub-b1"></span><span class="hub-chev" aria-hidden="true">&#x203A;</span></button>
    <button id="t2" class="hub-row" type="button" onclick="show(2)"><span class="hub-ic" aria-hidden="true">&#x1F4B5;</span><span class="hub-body"><span class="hub-t">Food cost</span><span class="hub-s" id="hub-s2">Loading&hellip;</span></span><span class="hub-b skel" id="hub-b2"></span><span class="hub-chev" aria-hidden="true">&#x203A;</span></button>
  </nav>
  <div id="s1" style="display:none">
    <div id="trends-container"><!-- populated by renderTrends from TRENDS_DATA / TRENDS_STATE --></div>
  </div>
  <div id="s2" style="display:none">
    <div id="cost-container"><!-- populated by renderCost from COST_DATA / COST_STATE --></div>
  </div>
</div>
<script src="tab.js" data-tabs="2" data-home="0"></script>
<script>
// bi.html — Business Intelligence (B-455 / WO-2b). Trends and Cost lifted
// VERBATIM out of inventory.html (the "── Trends tab" … cost-sort delegation
// region); the four helpers they call (api, escHtml, showSkeleton,
// showInlineError) are copied unchanged. Only the shell around them is new:
// the hub, the back links, show(), and the two hub badges.
//
// Gating: the launcher hides the BI tile for anyone without the `bi` grant, and
// the two endpoints 403 without it. Inside this page there is nothing left to
// gate — an un-granted user who pastes the URL sees the honest error cards.
function parseLocalDate(str){
  const [y,m,d]=str.split('-').map(Number);
  return new Date(y,m-1,d);
}

async function api(path,opts){
  const res=await fetch(path,opts);
  if(res.status===401){window.location.href='/login.html';throw new Error('unauthorized');}
  if(res.status===204)return null;
  const data=await res.json();
  if(!res.ok)throw Object.assign(new Error(data.error||'api_error'),{status:res.status,data});
  return data;
}

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function showSkeleton(containerId){
  document.getElementById(containerId).innerHTML='<div class="skeleton" style="background:var(--brd);border-radius:8px;height:64px;margin-bottom:8px;animation:pulse 1.2s infinite"></div>'.repeat(3);
}

function showInlineError(containerId,msg,retryFn){
  document.getElementById(containerId).innerHTML='<div class="card" style="text-align:center;padding:20px"><p style="color:var(--mut);font-size:13px;margin:0 0 10px">'+msg+'</p><button onclick="('+retryFn+')" style="padding:8px 16px;background:var(--info-bg);color:var(--info-tx);border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">Retry</button></div>';
}

let CURRENT_USER=null;
let ACTIVE_TAB=0;
var HUB_NAMES={1:'Trends',2:'Food cost'};

function show(n){
  if(!document.getElementById('s'+n))n=0;
  [0,1,2].forEach(function(i){
    var el=document.getElementById('s'+i); if(el)el.style.display=i===n?'':'none';
    var btn=document.getElementById('t'+i);
    if(btn){btn.classList.toggle('on',i===n);if(i===n)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current');}
  });
  ACTIVE_TAB=n;
  var backHq=document.getElementById('back-hq'),backHub=document.getElementById('back-hub');
  if(backHq)backHq.style.display=n===0?'':'none';
  if(backHub){backHub.style.display=n===0?'none':'';var nm=document.getElementById('back-hub-name');if(nm)nm.textContent=HUB_NAMES[n]||'';}
  // No hash is the hub; a section carries #tab=N so reloads and shared links
  // reopen it directly (with the back link, not the hub).
  if(n===0){if(location.hash)history.replaceState(null,'',location.pathname+location.search);renderHub();}
  else location.hash='tab='+n;
  // The hub loads both payloads at boot for its badges; a section re-uses that
  // answer when it is ready or in flight and fetches only after an error.
  if(n===1){if(TRENDS_STATE==='ready'||TRENDS_STATE==='loading')renderTrends();else loadTrends();}
  if(n===2){if(COST_STATE==='ready'||COST_STATE==='loading')renderCost();else loadCost();}
}

// With full-page sections the phone's back gesture is how the crew returns to
// the hub: show() pushes #tab=N, so popping it must show what the hash names.
window.addEventListener('hashchange',function(){
  var m=location.hash.match(/tab=(\d+)/);
  var n=m?+m[1]:0;
  if(n===ACTIVE_TAB)return;
  show(n);
});

// ── Hub status ──────────────────────────────────────────────────────────────
// Each row shows one reading drawn from the call its section makes anyway:
// Trends → the latest week's spend in the window; Food cost → the average food
// cost % across dishes that have one. Same contract as the Inventory hub: a key
// is undefined while loading, 'error' when its call failed, else a value; no
// data → no badge (never "$0 this wk"); error → "Status unavailable" in the
// subtitle and the row still opens.
var HUB={trends:undefined,cost:undefined};
function hubSet(key,val){HUB[key]=val;renderHub();}
function hubBadge(id,text,cls){
  var b=document.getElementById(id);if(!b)return;
  b.className='hub-b'+(cls?' '+cls:'');
  b.textContent=text||'';
}
function hubSub(id,text){var el=document.getElementById(id);if(el)el.textContent=text;}
function hubMoney(n){return '$'+Math.round(n).toLocaleString('en-US');}
// Plain-text window label for a subtitle. The report's own window label is
// built for innerHTML (entities) and leads with a week count, neither of which
// belongs in a textContent subtitle.
function hubDateRange(w){
  if(!w||!w.from||!w.to)return '';
  var a=parseLocalDate(w.from),b=parseLocalDate(w.to);
  var f=function(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});};
  // Same month reads "Sep 21\u201327" (the mockup's form); across months, "Sep 28 \u2013 Oct 4".
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())return f(a)+'\u2013'+b.getDate();
  return f(a)+' \u2013 '+f(b);
}

// The latest week's spend: cells plus the unlinked remainder for the newest
// week_start present. Null when the window holds no money at all.
function trendsLatestWeek(d){
  if(!d)return null;
  var cells=d.cells||[],unlinked=d.unlinked||[];
  var weeks=cells.map(function(c){return c.week_start;}).concat(unlinked.map(function(u){return u.week_start;}));
  // A known window with no money yet: no badge, but the subtitle keeps the count.
  if(!weeks.length)return {week:null,spend:null,weeks:d.window?d.window.weeks:null};
  var latest=weeks.sort().pop();
  var sum=0;
  cells.forEach(function(c){if(c.week_start===latest)sum+=Number(c.spend)||0;});
  unlinked.forEach(function(u){if(u.week_start===latest)sum+=Number(u.spend)||0;});
  return {week:latest,spend:sum,weeks:d.window?d.window.weeks:null};
}
// Average food cost % over the dishes that have one. Null when none does.
function costAverage(d){
  if(!d||!d.rows)return null;
  var vals=d.rows.map(function(r){return r.food_cost_pct;}).filter(function(v){return v!==null&&v!==undefined&&isFinite(v);});
  // Dishes without a % yet: no badge, but the subtitle keeps the window.
  if(!vals.length)return {avg:null,window:d.window||null};
  return {avg:vals.reduce(function(a,b){return a+Number(b);},0)/vals.length,window:d.window||null};
}

function renderHub(){
  if(!document.getElementById('s0'))return;
  var t=HUB.trends;
  if(t==='error'){hubBadge('hub-b1','');hubSub('hub-s1','Status unavailable');}
  else if(t===undefined){hubBadge('hub-b1','','skel');hubSub('hub-s1','Loading…');}
  else{hubBadge('hub-b1',t&&t.spend?hubMoney(t.spend)+' this wk':'','mut');hubSub('hub-s1','Spend by group'+(t&&t.weeks?' \u00b7 '+t.weeks+' weeks':', weekly'));}
  var c=HUB.cost;
  if(c==='error'){hubBadge('hub-b2','');hubSub('hub-s2','Status unavailable');}
  else if(c===undefined){hubBadge('hub-b2','','skel');hubSub('hub-s2','Loading…');}
  else{hubBadge('hub-b2',c&&c.avg!==null?Math.round(c.avg)+'% avg':'','mut');hubSub('hub-s2','Margin per dish'+(c&&c.window&&hubDateRange(c.window)?' \u00b7 '+hubDateRange(c.window):''));}
}

// The hub reads whatever the two loaders last fetched, so it is refreshed by
// EVERY load — boot, a section opening after an error, or the Retry button
// inside a report — never only by boot. hookHubLoaders() wraps the lifted
// loaders once the region below has declared them; the region's own Retry
// strings ('loadTrends()' / 'loadCost()') resolve the wrapped name at click
// time, so a Retry that succeeds un-sticks "Status unavailable" on the hub.
function hookHubLoaders(){
  var lt=loadTrends,lc=loadCost;
  loadTrends=async function(){await lt();hubSet('trends',TRENDS_STATE==='ready'?trendsLatestWeek(TRENDS_DATA):'error');};
  loadCost=async function(){await lc();hubSet('cost',COST_STATE==='ready'?costAverage(COST_DATA):'error');};
}
async function refreshHub(){
  await Promise.all([loadTrends(),loadCost()]);
}


// ── Trends (#s1, formerly Inventory's #s5) — FR-1 / FR-6b ─────────────────────────────────────────
//
// Renders GET /api/v1/inventory/trends (design §2.2 AS AMENDED 2026-07-20 —
// decisions 29/30/31). Three things this render path is deliberately careful
// about, all carried forward in writing by the endpoint's implementer and
// reviewer. None of them is taste; each is a way this chart could lie.
//
//  1. A ZERO CELL IS NOT A ZERO. trends.go drops any week×group bucket whose
//     lines net to exactly $0.00 (`if spend == 0 { continue }`) — a refund
//     cancelling a charge looks, on the wire, byte-identical to "that group
//     bought nothing that week". The chart cannot tell them apart, so it does
//     not pretend to: a missing cell is drawn as absent (never as a $0.00 bar
//     or table cell), the standing .tr-zero-note says so in words, and the
//     per-week drill-down labels the gap "no cell" rather than "$0.00".
//  2. THE UNITEMIZED REMAINDER IS A NET, AND NETS CANCEL. Amendment 3's figure
//     sums algebraically across the window: an over-itemized event contributes
//     negative. A reassuring $0.03 can therefore be two large offsetting
//     coverage gaps. The endpoint publishes no per-event count, so the number
//     genuinely cannot be decomposed here — the honest response is to label it
//     "(net)", say why in the disclosure, and never render it as an all-clear.
//     It is also NOT an addend to the payroll identity; period-summary does not
//     count it either, so it lives outside the reconciliation card entirely.
//  3. TWO TOTALS EXIST AND THEY ARE NOT INTERCHANGEABLE. The hero number is
//     completeness.reconciles_to_cogs_excl_tax — the exact, payroll-facing
//     figure computed from ONE window-wide sum rounded once, which matches
//     period-summary by construction (see trends.go's linesTotal comment). It
//     is NEVER Σ(display cells) + Σunlinked + pending: display cells are each
//     penny-rounded, prices are NUMERIC(10,4), and Σ(round) ≠ round(Σ), so that
//     sum can drift by up to half a cent per emitted cell. When the two do
//     disagree the chart does not quietly pick one — .tr-drift names the gap
//     and says which number payroll uses.
//
// The categorical palette is assigned by FIXED slot order (never cycled) and
// was validated with the dataviz validator in both modes — see the CSS block.
// Past eight groups the render folds the tail into "Other" rather than
// inventing a ninth hue; the per-week drill-down still lists every group
// unfolded, so folding hides nothing.
let TRENDS_DATA=null;
let TRENDS_STATE='idle'; // 'idle' | 'loading' | 'error' | 'ready'
let TRENDS_WEEK=null;    // week_start currently drilled into, or null
let TRENDS_UNITEMIZED_OPEN=false;
const TRENDS_MAX_SERIES=8;
const TRENDS_HUES=['var(--tr-1)','var(--tr-2)','var(--tr-3)','var(--tr-4)',
                   'var(--tr-5)','var(--tr-6)','var(--tr-7)','var(--tr-8)'];
const TRENDS_UNLINKED_ID='__unlinked';
const TRENDS_OTHER_ID='__other';

async function loadTrends(){
  TRENDS_STATE='loading';
  renderTrends();
  try{
    var data=await api('/api/v1/inventory/trends');
    TRENDS_DATA=data||null;
    TRENDS_STATE='ready';
    renderTrends();
  }catch(e){
    if(e.message==='unauthorized')return;
    TRENDS_STATE='error';
    renderTrends();
  }
}

function trRound2(n){return Math.round(n*100)/100;}
function trISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}
function trWeekLabel(iso){
  return parseLocalDate(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// Every Monday in the server's window, INCLUDING weeks with no data. A week the
// business bought nothing in is a fact about the window and gets its own empty
// column; deriving the axis from the sparse `cells` array instead would silently
// close those gaps up and misdate every bar around them.
function trendsWeeks(win){
  if(!win||!win.from||!win.to)return [];
  var out=[],d=parseLocalDate(win.from),end=parseLocalDate(win.to);
  while(d<=end&&out.length<104){
    out.push(trISO(d));
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7);
  }
  return out;
}

// Series shown in the chart/table. Past TRENDS_MAX_SERIES the tail folds into a
// single "Other" bucket — a 9th categorical hue is never generated.
function trendsSeries(groups){
  var gs=(groups||[]).slice();
  if(gs.length<=TRENDS_MAX_SERIES)return {series:gs,foldedIds:[]};
  var keep=gs.slice(0,TRENDS_MAX_SERIES-1);
  var tail=gs.slice(TRENDS_MAX_SERIES-1);
  keep.push({id:TRENDS_OTHER_ID,name:'Other ('+tail.length+' groups)'});
  return {series:keep,foldedIds:tail.map(function(g){return g.id;})};
}

// Index the sparse wire data. `present` is kept separate from `value` on
// purpose: it is the only thing that distinguishes "the server sent 0" from
// "the server sent nothing", and caveat 1 turns on exactly that distinction.
function trendsIndex(d,foldedIds){
  var folded={};
  foldedIds.forEach(function(id){folded[id]=1;});
  var value={},present={};
  (d.cells||[]).forEach(function(c){
    var gid=folded[c.group_id]?TRENDS_OTHER_ID:c.group_id;
    if(!value[c.week_start]){value[c.week_start]={};present[c.week_start]={};}
    value[c.week_start][gid]=trRound2((value[c.week_start][gid]||0)+c.spend);
    present[c.week_start][gid]=true;
  });
  (d.unlinked||[]).forEach(function(u){
    if(!value[u.week_start]){value[u.week_start]={};present[u.week_start]={};}
    value[u.week_start][TRENDS_UNLINKED_ID]=u.spend;
    present[u.week_start][TRENDS_UNLINKED_ID]=true;
  });
  return {value:value,present:present};
}

function trendsColor(i){return TRENDS_HUES[i%TRENDS_HUES.length];}

// Unlinked spend is not a group — it is money the catalog could not place. It
// gets the neutral swatch plus a diagonal texture so it reads as "unattributed"
// rather than as one more product category, and so the distinction survives
// colour-vision deficiency, greyscale print and forced-colors mode.
function trendsSwatchStyle(id,i){
  if(id===TRENDS_UNLINKED_ID){
    return 'background:repeating-linear-gradient(45deg,var(--tr-unlinked) 0 2px,transparent 2px 4px),var(--card);'+
      'box-shadow:inset 0 0 0 1px var(--tr-unlinked)';
  }
  return 'background:'+trendsColor(i);
}

// A rect with only its TOP corners rounded — the 4px data-end sits at the top of
// each stack and every segment stays anchored to the baseline below it.
function trTopRoundedRect(x,y,w,h,r,fill,extra){
  var rr=Math.max(0,Math.min(r,h,w/2));
  return '<path d="M'+x+' '+(y+h)+'V'+(y+rr)+'a'+rr+' '+rr+' 0 0 1 '+rr+' -'+rr+
    'h'+(w-2*rr)+'a'+rr+' '+rr+' 0 0 1 '+rr+' '+rr+'V'+(y+h)+'Z" fill="'+fill+'"'+
    (extra||'')+'></path>';
}

// Quarter-decade steps, not half. Observed in the first populated screenshot:
// a ~$1.1k peak rounded to a $1,500 axis and the tallest column reached barely
// two thirds of the plot, flattening the week-to-week differences the chart
// exists to show.
function trNiceMax(v){
  if(!(v>0))return 100;
  var mag=Math.pow(10,Math.floor(Math.log10(v)));
  var step=mag/4;
  return Math.ceil(v/step)*step;
}

function trendsChart(weeks,series,idx){
  var W=480,H=214,padL=46,padR=8,padT=10,padB=32;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var band=plotW/weeks.length;
  var colW=Math.min(26,band*0.62);

  var totals=weeks.map(function(wk){
    var row=idx.value[wk]||{},t=0;
    series.forEach(function(g){t+=row[g.id]||0;});
    t+=row[TRENDS_UNLINKED_ID]||0;
    return trRound2(t);
  });
  var yMax=trNiceMax(Math.max.apply(null,totals.concat([0])));

  var svg='<svg class="tr-svg" viewBox="0 0 '+W+' '+H+'" role="img" '+
    'aria-label="Weekly confirmed COGS spend by item group">'+
    '<title>Weekly confirmed COGS spend by item group</title>';

  // Recessive gridlines + y labels.
  [0,0.5,1].forEach(function(f){
    var y=padT+plotH-f*plotH;
    svg+='<line class="tr-gridline" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"></line>'+
      '<text class="tr-axis" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+
      escHtml(costMoney(yMax*f).replace(/\.00$/,''))+'</text>';
  });

  // Stack order: groups bottom-up in server order, Unlinked always on top so
  // the unattributed slice is the one the eye lands on.
  var stackOrder=series.map(function(g,i){return {id:g.id,name:g.name,fill:trendsColor(i)};});
  stackOrder.push({id:TRENDS_UNLINKED_ID,name:'Unlinked',fill:'url(#tr-hatch)'});

  svg+='<defs><pattern id="tr-hatch" width="5" height="5" patternUnits="userSpaceOnUse" '+
    'patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--card)"></rect>'+
    '<line x1="0" y1="0" x2="0" y2="5" stroke="var(--tr-unlinked)" stroke-width="3"></line></pattern></defs>';

  weeks.forEach(function(wk,wi){
    var row=idx.value[wk]||{};
    var x=padL+wi*band+(band-colW)/2;
    var sel=TRENDS_WEEK===wk;
    svg+='<g class="tr-col" data-week="'+wk+'"'+(sel?' data-selected="1"':'')+
      ' role="button" tabindex="0" aria-label="Week of '+trWeekLabel(wk)+
      ', total '+escHtml(costMoney(totals[wi]))+'">';
    if(sel){
      svg+='<rect x="'+(padL+wi*band)+'" y="'+padT+'" width="'+band+'" height="'+plotH+
        '" fill="var(--info-bg)" opacity="0.55" rx="4"></rect>';
    }
    // Full-band transparent hit target — the tap area is larger than the mark.
    svg+='<rect x="'+(padL+wi*band)+'" y="'+padT+'" width="'+band+'" height="'+plotH+
      '" fill="transparent"></rect>';
    var acc=0;
    stackOrder.forEach(function(s){
      var v=row[s.id];
      if(!v)return;               // absent OR exactly zero — nothing is drawn
      var h=(v/yMax)*plotH;
      var y=padT+plotH-acc-h;
      // 2px surface gap between stacked segments (mark spec); never let the gap
      // eat a thin segment entirely.
      var drawH=Math.max(h-2,1);
      svg+=trTopRoundedRect(x,y,colW,drawH,4,s.fill,' data-group-id="'+escHtml(s.id)+'"');
      acc+=h;
    });
    svg+='</g>';
  });

  // Label every third week — twelve dates will not fit a 480px shell.
  weeks.forEach(function(wk,wi){
    if(wi%3!==0&&wi!==weeks.length-1)return;
    svg+='<text class="tr-axis" x="'+(padL+wi*band+band/2)+'" y="'+(H-14)+
      '" text-anchor="middle">'+escHtml(trWeekLabel(wk))+'</text>';
  });

  svg+='</svg>';
  return svg;
}

function trendsLegend(series,idx,weeks){
  var items=series.map(function(g,i){
    var t=0;
    weeks.forEach(function(wk){t+=(idx.value[wk]||{})[g.id]||0;});
    return '<span class="tr-legend-item"><span class="tr-swatch" style="'+
      trendsSwatchStyle(g.id,i)+'"></span>'+escHtml(g.name)+
      ' <span class="tr-legend-total">'+escHtml(costMoney(trRound2(t)))+'</span></span>';
  });
  var ut=0;
  weeks.forEach(function(wk){ut+=(idx.value[wk]||{})[TRENDS_UNLINKED_ID]||0;});
  items.push('<span class="tr-legend-item"><span class="tr-swatch" style="'+
    trendsSwatchStyle(TRENDS_UNLINKED_ID,0)+'"></span>Unlinked <span class="tr-legend-total">'+
    escHtml(costMoney(trRound2(ut)))+'</span></span>');
  return '<div class="tr-legend">'+items.join('')+'</div>';
}

// The drill-down. This is where caveat 1 becomes concrete: EVERY group in the
// window is listed for the selected week, and one that the server sent no cell
// for is labelled "no cell" — not $0.00 — because the endpoint cannot tell us
// which of the two it was. Groups folded into "Other" in the chart are listed
// here individually, so folding never costs the operator information.
function trendsWeekDetail(d,idx,wk){
  if(!wk)return '';
  var row=idx.value[wk]||{},seen=(idx.present[wk]||{});
  var folded={};
  trendsSeries(d.groups).foldedIds.forEach(function(id){folded[id]=1;});
  // Re-index unfolded so a folded group can still be shown on its own line.
  var raw={},rawSeen={};
  (d.cells||[]).forEach(function(c){
    if(c.week_start!==wk)return;
    raw[c.group_id]=trRound2((raw[c.group_id]||0)+c.spend);
    rawSeen[c.group_id]=true;
  });
  var lines=(d.groups||[]).map(function(g){
    var has=!!rawSeen[g.id];
    return '<div class="tr-wd-row" data-group-id="'+escHtml(g.id)+'">'+
      '<span class="tr-wd-name">'+escHtml(g.name)+'</span>'+
      (has?'<span class="tr-wd-val">'+escHtml(costMoney(raw[g.id]))+'</span>'
         :'<span class="tr-wd-none">no cell</span>')+'</div>';
  });
  lines.push('<div class="tr-wd-row" data-group-id="'+TRENDS_UNLINKED_ID+'">'+
    '<span class="tr-wd-name">Unlinked</span>'+
    (seen[TRENDS_UNLINKED_ID]
      ?'<span class="tr-wd-val">'+escHtml(costMoney(row[TRENDS_UNLINKED_ID]))+'</span>'
      :'<span class="tr-wd-none">no cell</span>')+'</div>');
  return '<div class="tr-week-detail"><div class="tr-week-detail-hd">Week of '+
    escHtml(trWeekLabel(wk))+'</div>'+lines.join('')+
    '<div class="tr-zero-note">&ldquo;No cell&rdquo; means the server sent nothing for that '+
    'group this week. That is either no purchases, or purchases that netted to '+
    'exactly $0 &mdash; the endpoint cannot distinguish them.</div></div>';
}

function trendsTable(weeks,series,idx){
  var head='<th>Week</th>'+series.map(function(g){
    return '<th>'+escHtml(g.name)+'</th>';
  }).join('')+'<th>Unlinked</th><th>Total</th>';
  var colTotals={},grand=0;
  var body=weeks.map(function(wk){
    var row=idx.value[wk]||{},seen=idx.present[wk]||{},t=0,any=false;
    var cells=series.concat([{id:TRENDS_UNLINKED_ID}]).map(function(g){
      var v=row[g.id];
      colTotals[g.id]=trRound2((colTotals[g.id]||0)+(v||0));
      if(v===undefined&&!seen[g.id]){
        // Absent, not zero — caveat 1 again. An em-dash, never $0.00.
        return '<td class="tr-none">&mdash;</td>';
      }
      any=true;
      t+=v||0;
      return '<td>'+escHtml(costMoney(v||0))+'</td>';
    }).join('');
    grand=trRound2(grand+t);
    // A week the server sent nothing at all for gets an em-dash total too.
    // Observed in edge-all-unlinked.png: rendering "$0.00" there asserts a
    // measured zero for a week we in fact know nothing about — the same claim
    // caveat 1 forbids in the individual cells.
    return '<tr data-week="'+wk+'"><td>'+escHtml(trWeekLabel(wk))+'</td>'+cells+
      (any?'<td>'+escHtml(costMoney(trRound2(t)))+'</td>':'<td class="tr-none">&mdash;</td>')+
      '</tr>';
  }).join('');
  var foot='<td>Window</td>'+series.concat([{id:TRENDS_UNLINKED_ID}]).map(function(g){
    return '<td>'+escHtml(costMoney(colTotals[g.id]||0))+'</td>';
  }).join('')+'<td>'+escHtml(costMoney(grand))+'</td>';
  return '<div class="tr-table-wrap"><table class="tr-table"><thead><tr>'+head+
    '</tr></thead><tbody>'+body+'</tbody><tfoot><tr>'+foot+'</tr></tfoot></table></div>';
}

// The completeness card — Decisions 30 and 31 exist precisely so unattributed
// money is visible, and a chart that hides it defeats the amendment.
function trendsReconciliation(d,chartAttributed,unlinkedTotal){
  var c=d.completeness||{};
  var payroll=Number(c.reconciles_to_cogs_excl_tax)||0;
  var pending=Number(c.pending_total)||0;
  var displaySum=trRound2(chartAttributed+unlinkedTotal+pending);
  var drift=trRound2(payroll-displaySum);

  var html='<div class="tr-recon">'+
    '<div class="tr-hero"><span class="tr-hero-label">Confirmed COGS (excl. tax)</span>'+
    '<span class="tr-hero-val">'+escHtml(costMoney(payroll))+'</span>'+
    '<span class="tr-hero-note">The figure payroll reconciles against &mdash; the same '+
    'number the weekly period summary uses.</span></div>'+
    '<div class="tr-recon-row"><span class="tr-recon-key">Attributed to groups '+
    '<span class="tr-recon-sub">&middot; charted below</span></span>'+
    '<span class="tr-recon-val">'+escHtml(costMoney(chartAttributed))+'</span></div>'+
    '<div class="tr-recon-row"><span class="tr-recon-key">Unlinked '+
    '<span class="tr-recon-sub">&middot; no catalog item on the line</span></span>'+
    '<span class="tr-recon-val">'+escHtml(costMoney(unlinkedTotal))+'</span></div>'+
    '<div class="tr-recon-row"><span class="tr-recon-key">Awaiting review '+
    '<span class="tr-recon-sub">&middot; '+(Number(c.pending_count)||0)+' receipts, not yet '+
    'itemised, so they cannot be charted</span></span>'+
    '<span class="tr-recon-val">'+escHtml(costMoney(pending))+'</span></div>';

  // Caveat 3. Display cells are penny-rounded per cell; the payroll figure comes
  // from one window-wide sum rounded once. When they disagree, say so and say
  // which one is authoritative — do not silently show whichever is prettier.
  if(Math.abs(drift)>=0.01){
    html+='<div class="tr-drift"><strong>'+escHtml(costMoney(Math.abs(drift)))+
      '</strong> of rounding difference. The three lines above are each rounded to '+
      'the cent and add to '+escHtml(costMoney(displaySum))+'; the headline figure is '+
      'summed once over every line item, which is how payroll computes it. '+
      'Reconcile against the headline, not the sum of the rows.</div>';
  }
  return html+'</div>';
}

// Amendment 3's figure, kept OUT of the reconciliation card on purpose: it is
// not an addend to the payroll identity, and period-summary does not count it.
function trendsUnitemized(d){
  var v=Number((d.completeness||{}).unitemized_remainder)||0;
  return '<div class="tr-unitemized">'+
    '<div class="tr-unitemized-head">'+
    '<span class="tr-unitemized-label">Unitemized remainder (net)</span>'+
    '<span class="tr-unitemized-val">'+escHtml(costMoney(v))+'</span></div>'+
    '<div class="tr-unitemized-sub">Receipt totals minus their own line items, added up '+
    'across the window with signs kept. Not part of the figure above.</div>'+
    '<button class="tr-disclose" data-action="toggle-unitemized" aria-expanded="'+
    (TRENDS_UNITEMIZED_OPEN?'true':'false')+'">Why &ldquo;net&rdquo;?</button>'+
    (TRENDS_UNITEMIZED_OPEN
      ?'<div class="tr-unitemized-detail">A receipt itemised for more than its own total '+
       'contributes a negative amount here, so it cancels one itemised for less. Two large '+
       'offsetting gaps and no gaps at all produce the same small number, and this endpoint '+
       'reports no per-receipt count &mdash; so a figure near zero is not evidence that '+
       'coverage is good. To see where it comes from, check individual receipts on the '+
       'Receipts tab.</div>'
      :'')+'</div>';
}

function renderTrends(){
  // Null-safe: F5 removes this node for un-granted users.
  var host=document.getElementById('trends-container');
  if(!host)return;

  if(TRENDS_STATE==='loading'){showSkeleton('trends-container');return;}
  if(TRENDS_STATE==='error'){
    showInlineError('trends-container','Couldn’t load spending trends.','loadTrends()');
    return;
  }
  if(TRENDS_STATE!=='ready'){host.innerHTML='';return;}

  var d=TRENDS_DATA||{};
  var win=d.window;
  var winLine=win?'<p class="tr-window">'+costWindowLabel(win)+'</p>':'';

  var cells=d.cells||[],unlinked=d.unlinked||[];
  var pending=Number((d.completeness||{}).pending_total)||0;
  // "Nothing to show" is strictly: no attributed money, no unlinked money, and
  // nothing awaiting review. Money that exists but is entirely unattributed is
  // NOT empty — that is the case the operator most needs to see.
  if(!cells.length&&!unlinked.length&&pending<=0){
    host.innerHTML=winLine+
      '<div class="tr-empty"><h3>No confirmed spending yet</h3>'+
      '<p>Weekly spend by item group appears here once receipts are reviewed.</p>'+
      '<p>Receipts waiting on review are counted separately, and there are none '+
      'in this window.</p></div>';
    return;
  }

  var weeks=trendsWeeks(win);
  var sr=trendsSeries(d.groups);
  var idx=trendsIndex(d,sr.foldedIds);

  var attributed=0;
  weeks.forEach(function(wk){
    var row=idx.value[wk]||{};
    sr.series.forEach(function(g){attributed+=row[g.id]||0;});
  });
  attributed=trRound2(attributed);
  var unlinkedTotal=(d.unlinked_total===undefined||d.unlinked_total===null)
    ?trRound2(unlinked.reduce(function(a,u){return a+u.spend;},0))
    :Number(d.unlinked_total);

  // If the selected week fell out of the window on reload, drop the selection
  // rather than rendering a detail panel for a week that is no longer charted.
  if(TRENDS_WEEK&&weeks.indexOf(TRENDS_WEEK)===-1)TRENDS_WEEK=null;

  host.innerHTML=winLine+
    trendsReconciliation(d,attributed,unlinkedTotal)+
    trendsUnitemized(d)+
    '<div class="tr-chart-card">'+
      trendsChart(weeks,sr.series,idx)+
      trendsLegend(sr.series,idx,weeks)+
      '<p class="tr-zero-note">A week where a group&rsquo;s spend nets to exactly $0 &mdash; '+
      'a refund cancelling a charge, say &mdash; is not sent by the server and is drawn here '+
      'as no activity. Tap a week to see which groups have no cell.</p>'+
      trendsWeekDetail(d,idx,TRENDS_WEEK)+
    '</div>'+
    trendsTable(weeks,sr.series,idx);
}

// Trends interactions.
//
// Bound on `document`, NOT on #trends-container, deliberately — the hazard F4's
// review carried forward. On inventory.html, F5 (tab gating) removed the Trends markup for
// un-granted users; a top-level
// getElementById('trends-container').addEventListener would then throw a
// TypeError at PARSE time and take down the ENTIRE inventory page — every tab,
// not just Trends — for exactly those users. Delegating from a node that always
// exists makes the handler inert when the tab is absent instead of fatal. The
// #trends-container scope check keeps it from firing on other tabs' markup.
document.addEventListener('click',function(e){
  if(!e.target||!e.target.closest)return;
  if(!e.target.closest('#trends-container'))return;

  var disclose=e.target.closest('[data-action="toggle-unitemized"]');
  if(disclose){
    TRENDS_UNITEMIZED_OPEN=!TRENDS_UNITEMIZED_OPEN;
    renderTrends();
    return;
  }
  var col=e.target.closest('.tr-col, .tr-table tbody tr[data-week]');
  if(col){
    var wk=col.dataset.week;
    TRENDS_WEEK=(TRENDS_WEEK===wk)?null:wk;
    renderTrends();
  }
});

// Keyboard parity for the chart columns, which are SVG groups rather than
// buttons. Same document-level delegation, same reason.
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  if(!e.target||!e.target.closest)return;
  var col=e.target.closest('#trends-container .tr-col');
  if(!col)return;
  e.preventDefault();
  var wk=col.dataset.week;
  TRENDS_WEEK=(TRENDS_WEEK===wk)?null:wk;
  renderTrends();
});

// ── Food cost (#s2, formerly Inventory's #s6) — FR-4 / AC-4 ────────────────────────────────────────────
//
// Renders GET /api/v1/inventory/cost (design §2.3). Three things this render
// path is deliberately careful about, all of them contract, not taste:
//
//  1. NULLS ARE NOT ZEROS. ingredient_cost_total / margin / food_cost_pct are
//     nullable. A null renders as an em-dash, never as $0.00 or 0% — showing a
//     zero where the server said "I don't know" is the exact false number
//     INV-B forbids. `unallocated` (e.g. "no recipe") is surfaced verbatim
//     next to the item so the reason is visible, not inferred.
//  2. MOVERS ARE FULL ORDERINGS. The server returns every participating id in
//     rank order; the strips slice to COST_MOVER_N client-side. Rows with a
//     null pct are absent from by_food_cost_pct; rows with a null margin are
//     absent from by_margin. A negative-margin row leading by_margin.worst is
//     correct and is rendered as such.
//  3. SPARSE IS THE EXPECTED PROD STATE (accept-sparse-prod, A7). Two shapes:
//     rows:[] -> the honest low-data card; and rows-with-costs-but-no-sales ->
//     the table plus a sparse note, with the movers strips SUPPRESSED. Ranking
//     "worst margin" across items that simply have no sales yet would read as
//     "everything is losing money" when the truth is "no sales data yet".
//
// KNOWN GAP (routed to the operator, not papered over here): a menu item with
// a recipe but zero in-window ingredient spend arrives as cost 0 / margin =
// full revenue / pct 0 — a flattering 0% food cost. Rendering it as "—" would
// misrepresent genuinely zero-cost items, so it is shown as the data says. The
// honest fix needs a new `unallocated` reason string, which is a §2.3 design
// amendment and therefore not this card's to make.
let COST_DATA=null;
let COST_STATE='idle'; // 'idle' | 'loading' | 'error' | 'ready'
let COST_SORT={col:'revenue',dir:'desc'};
const COST_MOVER_N=3;

async function loadCost(){
  COST_STATE='loading';
  renderCost();
  try{
    var data=await api('/api/v1/inventory/cost');
    COST_DATA=data||null;
    COST_STATE='ready';
    renderCost();
  }catch(e){
    if(e.message==='unauthorized')return;
    COST_STATE='error';
    renderCost();
  }
}

function costMoney(n){
  var neg=n<0;
  var s='$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return neg?'-'+s:s;
}
function costUnits(n){
  return Number(n).toLocaleString('en-US',{maximumFractionDigits:Number(n)%1?2:0});
}
function costPct(n){return Number(n).toFixed(1)+'%';}
// A null from the wire is "unknown", and must look different from a real zero.
function costDash(){return '<span class="cost-null">&mdash;</span>';}

function costSortValue(row,col){
  if(col==='name')return row.menu_item_name||'';
  if(col==='units')return row.units_sold;
  if(col==='revenue')return row.revenue;
  if(col==='cost')return row.ingredient_cost_total;
  if(col==='margin')return row.margin;
  if(col==='pct')return row.food_cost_pct;
  return 0;
}

// Nulls always sink to the bottom regardless of direction — an unknown is not
// "the smallest value", and letting it lead a sorted column would read as a
// ranking claim the data doesn't support.
function costSortRows(rows){
  var col=COST_SORT.col,dir=COST_SORT.dir==='asc'?1:-1;
  return rows.slice().sort(function(a,b){
    var av=costSortValue(a,col),bv=costSortValue(b,col);
    var an=(av===null||av===undefined),bn=(bv===null||bv===undefined);
    if(an&&bn)return (a.menu_item_name||'').localeCompare(b.menu_item_name||'');
    if(an)return 1;
    if(bn)return -1;
    if(typeof av==='string')return av.localeCompare(bv)*dir;
    if(av===bv)return (a.menu_item_name||'').localeCompare(b.menu_item_name||'');
    return (av<bv?-1:1)*dir;
  });
}

function costWindowLabel(w){
  if(!w)return '';
  // Displayed straight from the server envelope — the window is computed in the
  // app timezone server-side (users.DefaultTimezone) and must never be
  // recomputed on the client.
  var opts={month:'short',day:'numeric'};
  var from=parseLocalDate(w.from).toLocaleDateString('en-US',opts);
  var to=parseLocalDate(w.to).toLocaleDateString('en-US',opts);
  return w.weeks+' weeks &middot; '+from+' &ndash; '+to;
}

function renderCostMoverRow(row,side,maxAbs,kind){
  var val,cls='',frac;
  if(kind==='pct'){
    val=costPct(row.food_cost_pct);
    frac=Math.min(Math.abs(row.food_cost_pct)/100,1);
  }else{
    val=costMoney(row.margin);
    cls=row.margin<0?' neg':'';
    frac=maxAbs?Math.min(Math.abs(row.margin)/maxAbs,1):0;
  }
  return '<div class="cost-mover-row" data-side="'+side+'" data-menu-item-id="'+escHtml(row.menu_item_id)+'">'+
    '<div class="cost-mover-head"><span class="cost-mover-name">'+escHtml(row.menu_item_name)+'</span>'+
    '<span class="cost-mover-val">'+val+'</span></div>'+
    '<div class="cost-mover-track"><span class="cost-mover-fill'+cls+'" style="width:'+
    (Math.max(frac,0.02)*100).toFixed(1)+'%"></span></div></div>';
}

function renderCostMoverStrip(key,title,sub,pair,byId,kind){
  // pair.best / pair.worst are FULL orderings from the server (reversed views of
  // the same participating set) — the slice happens here.
  //
  // The slice is capped at half the participating set, not just COST_MOVER_N.
  // With a short ordering a naive top-3-of-each puts the SAME item under both
  // "Best" and "Worst" (observed in the populated screenshot: 4 rankable items
  // -> Salmon Bowl appeared on both sides). That is not a ranking, it is a
  // contradiction, so the strip narrows rather than double-counts.
  var ids=(pair&&pair.best)||[];
  var n=ids.length;
  var per=n<=1?n:Math.min(COST_MOVER_N,Math.floor(n/2));
  var pick=function(list){
    return (list||[]).slice(0,per).map(function(id){return byId[id];})
      .filter(function(r){return !!r;});
  };
  var best=pick(pair&&pair.best);
  // A single participating item is shown once, as "Best" — calling the only
  // data point both the best and the worst says nothing true.
  var worst=n<=1?[]:pick(pair&&pair.worst);
  if(!best.length&&!worst.length)return '';
  var maxAbs=0;
  if(kind==='margin'){
    best.concat(worst).forEach(function(r){maxAbs=Math.max(maxAbs,Math.abs(r.margin));});
  }
  var body='';
  if(best.length){
    body+='<div class="cost-mover-side">Best</div>'+
      best.map(function(r){return renderCostMoverRow(r,'best',maxAbs,kind);}).join('');
  }
  if(worst.length){
    body+='<div class="cost-mover-side">Worst</div>'+
      worst.map(function(r){return renderCostMoverRow(r,'worst',maxAbs,kind);}).join('');
  }
  return '<div class="cost-mover-strip" data-strip="'+key+'">'+
    '<div class="cost-mover-title">'+title+'</div>'+
    '<div class="cost-mover-sub">'+sub+'</div>'+body+'</div>';
}

// True when nothing in the window has revenue. In that case a negative margin
// is not a loss — it is just "minus the ingredient cost" with no sales to net
// against — so the table drops the loss-red styling. The NUMBER is still shown
// (it is a real server value); only the alarm colour, which would assert a loss
// that has not happened, is withheld.
function costNoSalesAtAll(rows){
  return !rows.some(function(r){return Number(r.revenue)>0;});
}

function renderCostTable(rows){
  var noSales=costNoSalesAtAll(rows);
  var cols=[
    {k:'name',label:'Item'},
    {k:'units',label:'Units'},
    {k:'revenue',label:'Revenue'},
    {k:'cost',label:'Cost'},
    {k:'margin',label:'Margin'},
    {k:'pct',label:'FC %'}
  ];
  var head=cols.map(function(c){
    var on=COST_SORT.col===c.k;
    var arrow=on?(COST_SORT.dir==='asc'?'&#9650;':'&#9660;'):'&#9662;';
    return '<th data-sort="'+c.k+'"'+(on?' class="sorted"':'')+
      ' aria-sort="'+(on?(COST_SORT.dir==='asc'?'ascending':'descending'):'none')+'">'+
      c.label+'<span class="cost-arrow">'+arrow+'</span></th>';
  }).join('');
  var body=costSortRows(rows).map(function(r){
    var cost=(r.ingredient_cost_total===null||r.ingredient_cost_total===undefined)
      ?costDash():costMoney(r.ingredient_cost_total);
    var margin=(r.margin===null||r.margin===undefined)
      ?costDash()
      // ── KNOWN INCONSISTENCY, DELIBERATELY NOT FIXED HERE (routed to the
      // operator, same pattern as cost.go's 0%-food-cost gap) ──
      // The loss-red rule below is WINDOW-level (`noSales`), not ROW-level. So
      // in a populated window a single zero-revenue row — a comped or retired
      // dish — still renders its negative margin in loss-red, even though by
      // this card's own reasoning ("with no revenue to net against, margin is
      // simply minus the cost… these are not losses") that row is no more a
      // loss than the all-sparse case. Visible in the populated fixture as
      // Comped Special's -$11.20.
      //
      // Not fixed here because extending the rule row-level CHANGES rendering
      // in the PRD's "Populated" state, and whether the Cost State-Enumeration
      // table intends that is an operator call, not an implementer's. Flagged
      // at G6 review; do not mistake the current output for a settled decision.
      :'<span class="'+((r.margin<0&&!noSales)?'cost-neg':'')+'">'+costMoney(r.margin)+'</span>';
    var pct=(r.food_cost_pct===null||r.food_cost_pct===undefined)
      ?costDash():costPct(r.food_cost_pct);
    var reason=r.unallocated?'<div class="cost-unalloc">'+escHtml(r.unallocated)+'</div>':'';
    return '<tr data-menu-item-id="'+escHtml(r.menu_item_id)+'">'+
      '<td data-col="name"><div class="cost-item-name">'+escHtml(r.menu_item_name)+'</div>'+
      (r.menu_group?'<div class="cost-item-group">'+escHtml(r.menu_group)+'</div>':'')+reason+'</td>'+
      '<td data-col="units">'+costUnits(r.units_sold)+'</td>'+
      '<td data-col="revenue">'+costMoney(r.revenue)+'</td>'+
      '<td data-col="cost">'+cost+'</td>'+
      '<td data-col="margin">'+margin+'</td>'+
      '<td data-col="pct">'+pct+'</td></tr>';
  }).join('');
  return '<div class="cost-table-wrap"><table class="cost-table"><thead><tr>'+head+
    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}

function renderCost(){
  var host=document.getElementById('cost-container');
  if(!host)return;

  if(COST_STATE==='loading'){showSkeleton('cost-container');return;}
  if(COST_STATE==='error'){
    showInlineError('cost-container','Couldn’t load food cost.','loadCost()');
    return;
  }
  if(COST_STATE!=='ready'){host.innerHTML='';return;}

  var rows=(COST_DATA&&COST_DATA.rows)||[];
  var win=COST_DATA&&COST_DATA.window;
  var winLine=win?'<p id="cost-window" class="cost-window">'+costWindowLabel(win)+'</p>':'';

  // Empty — the accepted prod state (A7). Say what is actually true rather
  // than implying the tab is broken or that the numbers are zero.
  if(!rows.length){
    host.innerHTML=winLine+
      '<div class="cost-empty"><h3>No sales data yet</h3>'+
      '<p>Food cost appears here once sales sync.</p>'+
      '<p>Ingredient spend is still being recorded on the Receipts tab.</p></div>';
    return;
  }

  // Partially sparse: purchases landed, Toast sales did not. Every row has zero
  // revenue, so every margin is the negative of its cost. Suppress the movers
  // strips — there is nothing meaningful to rank, and a "worst margin" ranking
  // here would read as a loss verdict rather than a missing-data notice.
  var anyRevenue=!costNoSalesAtAll(rows);
  var sparseNote=anyRevenue?'':
    '<div class="cost-sparse-note"><strong>No sales data yet</strong>'+
    '<span>Ingredient spend below is real; sales are not synced yet. With no '+
    'revenue to net against, margin is simply minus the cost and food-cost % '+
    'has nothing to divide by &mdash; these are not losses.</span></div>';

  var byId={};
  rows.forEach(function(r){byId[r.menu_item_id]=r;});
  var movers=(COST_DATA&&COST_DATA.movers)||{};
  var strips='';
  if(anyRevenue){
    strips=renderCostMoverStrip('food_cost_pct','Food cost %',
      'Lowest = most efficient plate',movers.by_food_cost_pct,byId,'pct')+
      renderCostMoverStrip('margin','Margin dollars',
      'Highest = biggest absolute earner',movers.by_margin,byId,'margin');
  }

  host.innerHTML=winLine+sparseNote+strips+renderCostTable(rows);
}

// Sort on header tap.
//
// Bound on `document`, NOT on #cost-container, deliberately (kept as lifted; on inventory.html F5 tab gating)
// removes the Cost tab's markup for un-granted users; a top-level
// getElementById('cost-container').addEventListener would then throw a
// TypeError at parse time and take down the ENTIRE inventory page — every tab,
// not just Cost — for exactly those users. Delegating from a node that always
// exists makes the handler inert when the tab is absent instead of fatal.
// The #cost-container scope check keeps it from firing on other tables.
document.addEventListener('click',function(e){
  if(!e.target||!e.target.closest)return;
  var th=e.target.closest('#cost-container th[data-sort]');
  if(!th)return;
  var col=th.dataset.sort;
  if(COST_SORT.col===col){
    COST_SORT.dir=COST_SORT.dir==='asc'?'desc':'asc';
  }else{
    COST_SORT.col=col;
    // Names read naturally A->Z; every numeric column is most interesting at
    // its extreme, so those open descending — except food-cost %, where the
    // useful end is the cheap one.
    COST_SORT.dir=(col==='name'||col==='pct')?'asc':'desc';
  }
  renderCost();
});

document.addEventListener('DOMContentLoaded',async function(){
  try{CURRENT_USER=await api('/api/v1/me');}catch(e){return;}
  hookHubLoaders();
  var hashTab=(location.hash.match(/tab=(\d+)/)||[])[1];
  refreshHub();
  show(hashTab?+hashTab:0);
});
document.addEventListener('dblclick',function(e){e.preventDefault();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
