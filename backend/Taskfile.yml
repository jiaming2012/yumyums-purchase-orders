version: '3'

vars:
  # Connection components — override DB_HOST/DB_PORT for remote, or DB_URL for full control
  DB_USER: '{{.DB_USER | default "yumyums"}}'
  DB_PASS: '{{.DB_PASS | default "yumyums"}}'
  DB_NAME: '{{.DB_NAME | default "yumyums"}}'
  DB_HOST: '{{.DB_HOST | default "localhost"}}'
  # 5433 = yumyums-dev-pg, the container that actually serves HQ. Host :5432 is
  # bound by infra-postgres-1 (slack-trading), which has no `yumyums` role — the
  # old default failed closed but failed, costing a triage run on 2026-07-21.
  # See cross-contamination audit surface #9.
  DB_PORT: '{{.DB_PORT | default "5433"}}'
  DB_URL: '{{.DB_URL | default (printf "postgres://%s:%s@%s:%s/%s?sslmode=disable" .DB_USER .DB_PASS .DB_HOST .DB_PORT .DB_NAME)}}'
  # hq_test_go — the GO suite's database. Playwright owns hq_test_e2e. They were
  # one shared hq_test until 2026-07-21; Go TestMains truncate `users` and would
  # log a concurrent Playwright run out mid-suite. Audit surface #3.
  DB_TEST_URL: '{{.DB_TEST_URL | default (printf "postgres://%s:%s@%s:%s/hq_test_go?sslmode=disable" .DB_USER .DB_PASS .DB_HOST .DB_PORT)}}'
  PORT: '{{.PORT | default "8484"}}'
  STATIC_DIR: '{{.STATIC_DIR | default ".."}}'

  # ─────────────────────────────────────────────────────────────────────────────
  # THE FOUR HQ_SYNC_* VARS — card `sync-live-in-dev-substrate` (Activity 5,
  # run 20260810), leg 2. Setting these OPENS the in-server /sync/* proxy door
  # (proxy.go + jwtbridge_handler.go); with them unset the door fails CLOSED
  # (503 sync_proxy_not_configured), which is the normal state of a deploy that
  # has not adopted the sync substrate.
  #
  # 🛑 proxy.go:78 ACTIVATION-ORDER GUARD — these are wired into the DEV targets
  #    below ONLY (dev / dev:log / dev:lan / dev:tailscale / dev:tailscale:log),
  #    and they are DELIBERATELY ABSENT from `prod`, `build`, and
  #    docker-compose.prod.yml. The guard exists because the door forwards every
  #    method to PostgREST with an `authenticated` token and does NO row filtering
  #    of its own — the gate is RLS, and setting HQ_SYNC_REST_URL on a deploy
  #    whose substrate has no RLS policies gives every logged-in crew member full
  #    read+write on the exposed schema. Dev is safe because the substrate DOES
  #    carry the row-visibility RLS (migrations 0073/0074 + the substrate policies)
  #    resolved through the FDW the persistent-dev service points at the dev HQ.
  #    A leak of HQ_SYNC_REST_URL into a prod/not-ready deploy is the exact defect
  #    this guard exists to prevent — do not copy these into a prod target.
  #
  # The two URL vars resolve the LIVE substrate's Docker-assigned host ports at
  # task-run time (they are ephemeral — see docker-compose.supabase.yml). Bring
  # the substrate up first with `task sync:dev:up`. If the substrate is down the
  # ports resolve empty and the door simply stays 503 (fail-closed), which is
  # correct — the dev server still boots.
  #
  # HQ_SYNC_JWT_SECRET must equal the substrate's JWT_SECRET (the single shared
  # secret the Go minter signs with and PostgREST/Realtime verify). It is read
  # from the committed throwaway value in docker-compose.supabase.yml — a local
  # spike credential, safe by construction (that file's banner).
  #
  # HQ_SYNC_REALTIME_HOST's first dot-separated label must equal the substrate
  # tenant's external_id (`realtime-dev`) — proxy.go point 2.
  # ─────────────────────────────────────────────────────────────────────────────
  SYNC_COMPOSE: '{{.SYNC_COMPOSE | default "../docker-compose.supabase.yml"}}'
  HQ_SYNC_REALTIME_HOST: '{{.HQ_SYNC_REALTIME_HOST | default "realtime-dev.localhost"}}'

  # Network addresses
  DEV_TS: '{{.DEV_TS | default "100.90.128.69"}}'
  WIN_LAN: '192.168.8.164'
  WIN_TS: '100.70.200.55'
  WIN_PORT: '5433'

tasks:
  dev:
    desc: Run the server in development mode
    cmd: |
      LOG_FILE=/tmp/hq-server-{{.PORT}}.log
      { echo "[hq-server] logs → $LOG_FILE"; go run ./cmd/server 2>&1; } | tee "$LOG_FILE"
    env:
      STATIC_DIR: '{{.STATIC_DIR}}'
      PORT: '{{.PORT}}'
      DB_URL: '{{.DB_URL}}'
      BASE_URL: 'http://{{.DEV_TS}}:{{.PORT}}'
      SUPERADMIN_CONFIG: config/superadmins.yaml
      # The four HQ_SYNC_* vars open the /sync/* proxy door (card
      # sync-live-in-dev-substrate). DEV ONLY — see the vars: banner + proxy.go:78.
      HQ_SYNC_REST_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port rest 3000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_REALTIME_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port realtime 4000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_JWT_SECRET:
        sh: 'grep -m1 -oE "JWT_SECRET: *[0-9a-f]{32,}" {{.SYNC_COMPOSE}} | awk "{print \$2}"'
      HQ_SYNC_REALTIME_HOST: '{{.HQ_SYNC_REALTIME_HOST}}'

  dev:log:
    desc: Run the server with all log output written to a file
    cmd: go run ./cmd/server
    env:
      STATIC_DIR: '{{.STATIC_DIR}}'
      PORT: '{{.PORT}}'
      DB_URL: '{{.DB_URL}}'
      BASE_URL: 'http://{{.DEV_TS}}:{{.PORT}}'
      SUPERADMIN_CONFIG: config/superadmins.yaml
      LOG_TO_FILE: '1'
      HQ_SYNC_REST_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port rest 3000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_REALTIME_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port realtime 4000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_JWT_SECRET:
        sh: 'grep -m1 -oE "JWT_SECRET: *[0-9a-f]{32,}" {{.SYNC_COMPOSE}} | awk "{print \$2}"'
      HQ_SYNC_REALTIME_HOST: '{{.HQ_SYNC_REALTIME_HOST}}'

  dev:lan:
    desc: Run server against Windows box (LAN)
    cmd: |
      LOG_FILE=/tmp/hq-server-{{.PORT}}.log
      { echo "[hq-server] logs → $LOG_FILE"; go run ./cmd/server 2>&1; } | tee "$LOG_FILE"
    env:
      STATIC_DIR: '{{.STATIC_DIR}}'
      PORT: '{{.PORT}}'
      DB_URL: 'postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_LAN}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable'
      BASE_URL: 'http://{{.DEV_TS}}:{{.PORT}}'
      SUPERADMIN_CONFIG: config/superadmins.yaml
      HQ_SYNC_REST_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port rest 3000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_REALTIME_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port realtime 4000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_JWT_SECRET:
        sh: 'grep -m1 -oE "JWT_SECRET: *[0-9a-f]{32,}" {{.SYNC_COMPOSE}} | awk "{print \$2}"'
      HQ_SYNC_REALTIME_HOST: '{{.HQ_SYNC_REALTIME_HOST}}'

  dev:tailscale:
    desc: Run server against Windows box (Tailscale)
    cmd: |
      LOG_FILE=/tmp/hq-server-{{.PORT}}.log
      { echo "[hq-server] logs → $LOG_FILE"; go run ./cmd/server 2>&1; } | tee "$LOG_FILE"
    env:
      STATIC_DIR: '{{.STATIC_DIR}}'
      PORT: '{{.PORT}}'
      DB_URL: 'postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_TS}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable'
      BASE_URL: 'http://{{.DEV_TS}}:{{.PORT}}'
      SUPERADMIN_CONFIG: config/superadmins.yaml
      HQ_SYNC_REST_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port rest 3000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_REALTIME_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port realtime 4000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_JWT_SECRET:
        sh: 'grep -m1 -oE "JWT_SECRET: *[0-9a-f]{32,}" {{.SYNC_COMPOSE}} | awk "{print \$2}"'
      HQ_SYNC_REALTIME_HOST: '{{.HQ_SYNC_REALTIME_HOST}}'

  dev:tailscale:log:
    desc: Run server against Windows box (Tailscale) with all log output written via LOG_TO_FILE (slog NDJSON to timestamped file)
    cmd: go run ./cmd/server
    env:
      STATIC_DIR: '{{.STATIC_DIR}}'
      PORT: '{{.PORT}}'
      DB_URL: 'postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_TS}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable'
      BASE_URL: 'http://{{.DEV_TS}}:{{.PORT}}'
      SUPERADMIN_CONFIG: config/superadmins.yaml
      LOG_TO_FILE: '1'
      HQ_SYNC_REST_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port rest 3000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_REALTIME_URL:
        sh: 'docker compose -p spike-supabase -f {{.SYNC_COMPOSE}} port realtime 4000 2>/dev/null | sed "s#.*:#http://127.0.0.1:#"'
      HQ_SYNC_JWT_SECRET:
        sh: 'grep -m1 -oE "JWT_SECRET: *[0-9a-f]{32,}" {{.SYNC_COMPOSE}} | awk "{print \$2}"'
      HQ_SYNC_REALTIME_HOST: '{{.HQ_SYNC_REALTIME_HOST}}'

  # ---------------------------------------------------------------------------
  # Migrations (goose). `go run` caches the binary per-version so the first run
  # downloads and subsequent runs are instant. Mirrors the dev / dev:lan /
  # dev:tailscale matrix so the migration target always matches the dev DB.
  # ---------------------------------------------------------------------------
  migrate:
    desc: Apply pending migrations (local DB)
    cmd: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir internal/db/migrations postgres "{{.DB_URL}}" up

  migrate:lan:
    desc: Apply pending migrations against Windows box (LAN)
    cmd: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir internal/db/migrations postgres "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_LAN}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable" up

  migrate:tailscale:
    desc: Apply pending migrations against Windows box (Tailscale)
    cmd: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir internal/db/migrations postgres "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_TS}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable" up

  migrate:status:
    desc: Show migration status (local DB)
    cmd: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir internal/db/migrations postgres "{{.DB_URL}}" status

  migrate:status:tailscale:
    desc: Show migration status against Windows box (Tailscale)
    cmd: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir internal/db/migrations postgres "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_TS}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable" status

  migrate:down:
    desc: Roll back the most recent migration (local DB)
    cmd: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir internal/db/migrations postgres "{{.DB_URL}}" down

  migrate:down:tailscale:
    desc: Roll back the most recent migration against Windows box (Tailscale)
    cmd: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir internal/db/migrations postgres "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_TS}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable" down

  prod:
    desc: Run the server in production mode (embedded assets, prod DB)
    deps: [build]
    cmd: ./bin/server
    env:
      PORT: '{{.PORT}}'
      DB_URL: '{{.DB_URL}}'
      BASE_URL: 'https://hq.yumyums.kitchen'
      SUPERADMIN_CONFIG: config/superadmins.yaml

  build:
    desc: Build the server binary with embedded frontend assets (injects git SHA + built_at)
    vars:
      GIT_SHA:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      BUILT_AT:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - rm -rf cmd/server/public/*
      - cp ../*.html ../*.js ../manifest.json cmd/server/public/
      - cp ../version.json cmd/server/public/ 2>/dev/null || true
      - cp -r ../icons cmd/server/public/ 2>/dev/null || true
      - cp -r ../lib cmd/server/public/ 2>/dev/null || true
      - >-
        go build
        -ldflags "-X github.com/yumyums/hq/internal/version.GitSHA={{.GIT_SHA}}
        -X github.com/yumyums/hq/internal/version.BuiltAt={{.BUILT_AT}}"
        -o bin/server ./cmd/server

  # ---------------------------------------------------------------------------
  # Local Docker (runs Postgres on this machine)
  # ---------------------------------------------------------------------------
  db-start:
    desc: Start local PostgreSQL container (idempotent — starts existing container or creates new one)
    cmd: |
      if docker ps -a --format '{{`{{.Names}}`}}' | grep -q '^yumyums-pg$'; then
        docker start yumyums-pg
      else
        docker run -d --name yumyums-pg \
          -e POSTGRES_USER={{.DB_USER}} \
          -e POSTGRES_PASSWORD={{.DB_PASS}} \
          -e POSTGRES_DB={{.DB_NAME}} \
          -p {{.DB_PORT}}:5432 \
          -v yumyums-pgdata:/var/lib/postgresql/data \
          postgres:16
      fi

  db-stop:
    desc: Stop and remove local PostgreSQL container
    cmd: docker stop yumyums-pg && docker rm yumyums-pg

  db-reset:
    desc: Reset local database (stop, remove volume, restart)
    cmds:
      - task db-stop
      - docker volume rm yumyums-pgdata
      - task db-start

  db-test:
    desc: Ensure hq_test_go + hq_test_e2e databases exist (works local or remote)
    # Connect to the always-present "postgres" maintenance DB — NOT DB_NAME
    # ({{.DB_NAME}}), which may not exist on a local dev machine (it doesn't on a
    # stock Homebrew Postgres) and made this task fail with `database "yumyums"
    # does not exist`. CREATE DATABASE can't run from inside the DB being checked
    # anyway, so a maintenance DB is the correct connection target.
    #
    # Refuses to create test databases on a host that also serves the dev/prod
    # database ({{.DB_NAME}}) unless ALLOW_TEST_DB_ON_DEV_HOST=1.
    #
    # 🛑 THE GUARD IS NOW ARMED (default 0). It shipped defaulting to 1 —
    # dormant — because the test databases genuinely lived on the yumyums-dev-pg
    # cluster (audit surface #4), and its own comment promised it "will start
    # failing loudly the moment a proper test cluster exists". That cluster now
    # exists: yumyums-test-pg on :5434 (docker-compose.test.yml, ledger decision
    # 155), and the root Taskfile's test:* targets pass its coordinates into this
    # task explicitly. A bare `task backend:db-test` with the :5433 defaults is
    # exactly the mistake that produced B-141, so it now refuses instead of
    # creating test databases beside production. Set ALLOW_TEST_DB_ON_DEV_HOST=1
    # only as a knowing, one-off override.
    cmd: |
      MAINT="postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.DB_HOST}}:{{.DB_PORT}}/postgres?sslmode=disable"
      if [ "${ALLOW_TEST_DB_ON_DEV_HOST:-0}" != "1" ]; then
        if psql "$MAINT" -tc "SELECT 1 FROM pg_database WHERE datname = '{{.DB_NAME}}'" | grep -q 1; then
          echo "refusing: {{.DB_HOST}}:{{.DB_PORT}} also serves the dev DB '{{.DB_NAME}}'" >&2
          exit 1
        fi
      fi
      for db in hq_test_go hq_test_e2e; do
        psql "$MAINT" -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 \
          || psql "$MAINT" -c "CREATE DATABASE $db"
      done

  # ---------------------------------------------------------------------------
  # Remote Docker (Windows box — managed via infra repo)
  # To start Postgres on the Windows box: cd infra/ && task yumyums:up
  # ---------------------------------------------------------------------------
  db-ping:
    desc: Check connectivity to the configured Postgres
    cmd: psql "{{.DB_URL}}" -c "SELECT version();"

  db-ping:lan:
    desc: Check connectivity to Windows box (LAN)
    cmd: psql "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_LAN}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable" -c "SELECT version();"

  db-ping:tailscale:
    desc: Check connectivity to Windows box (Tailscale)
    cmd: psql "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.WIN_TS}}:{{.WIN_PORT}}/{{.DB_NAME}}?sslmode=disable" -c "SELECT version();"

  # ---------------------------------------------------------------------------
  # Data management (uses psql — works local or remote)
  # ---------------------------------------------------------------------------
  db-reset-purchasing:
    desc: Wipe purchasing data (POs, shopping lists) for re-testing cutoff flow
    cmd: >-
      psql "{{.DB_URL}}" -c "
        TRUNCATE shopping_list_items, shopping_list_vendor_sections, shopping_lists, po_line_items, purchase_orders CASCADE;
      "

  db-reset-inventory:
    desc: Wipe inventory + receipt data only (keeps users, templates, etc.)
    cmd: >-
      psql "{{.DB_URL}}" -c "
        TRUNCATE purchase_line_items, purchase_events, pending_purchases CASCADE;
      "

  # ---------------------------------------------------------------------------
  # Utility
  # ---------------------------------------------------------------------------
  sync-toast:
    desc: Replay Toast ingest for a date range, reading from DO Spaces (requires DB_URL + DO_SPACES_*; usage — task backend:sync-toast FROM=2026-05-01 TO=2026-05-31)
    cmd: >-
      go run ./cmd/sync-toast
      --from {{.FROM}}
      --to {{.TO}}
    env:
      DB_URL: '{{.DB_URL}}'
      DO_SPACES_ENDPOINT: '{{.DO_SPACES_ENDPOINT | default (printf "https://%s.digitaloceanspaces.com" .DO_SPACES_REGION)}}'

  login:
    desc: Login as admin and save session cookie to /tmp/yumcookie
    cmd: >-
      curl -s -c /tmp/yumcookie
      -X POST http://localhost:{{.PORT}}/api/v1/auth/login
      -H 'Content-Type: application/json'
      -d '{"email":"jamal@yumyums.kitchen","password":"test123"}'
      | python3 -m json.tool
