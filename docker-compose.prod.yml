# docker-compose.prod.yml — production stack for Yumyums HQ.
#
# ONE container (the Go backend embeds the frontend), exposed to the public via
# Cloudflare Tunnel at https://hq.yumyums.kitchen. Prod runs on the SAME box as
# dev; `task prod:deploy` pulls origin/main into the prod clone and rebuilds
# this stack from it. Prod therefore only ever runs pushed-to-main code.
#
# Build context is the repo ROOT (the Dockerfile reaches ../*.html etc. for the
# embedded frontend); the Dockerfile lives at backend/Dockerfile. `sw.js` is a
# committed artifact, so no Node toolchain is needed in the prod clone — only
# git + docker.
#
# DB: shares the yumyums-dev-pg Postgres container but is ISOLATED to the
# `production` schema via search_path — dev data lives in a different schema on
# the same instance. Keep the DB_URL below EXACT; it is the only thing keeping
# prod and dev data apart. The app auto-migrates (goose, embedded) on startup.
#
# Secrets (Anthropic / Mercury / DO Spaces / SMTP / Toast / Zoho / service
# token) come from a git-ignored .env.prod placed next to this file. Without it
# the app still boots, but those integrations are inert.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Populated by `task prod:deploy` (exports GIT_SHA/BUILT_AT before build)
      # so /api/v1/health and `task version` report the deployed commit.
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
        BUILT_AT: "${BUILT_AT:-unknown}"
    image: yumyums-purchase-orders:prod
    container_name: yumyums-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Production schema on the shared Postgres. Do NOT change without
      # migrating data — this is what separates prod from dev on yumyums-dev-pg.
      DB_URL: "postgres://yumyums:yumyums@yumyums-dev-pg:5432/yumyums?sslmode=disable&search_path=production"
      BASE_URL: "${BASE_URL:-https://hq.yumyums.kitchen}"
      # Prod is the ONLY live alert sender (T-21b decision 46). Outbound alert
      # delivery is opt-in; dev servers holding the same creds stay silent.
      ALERTS_ENABLED: "1"
      # B-172: object storage is mandatory in prod. With this set, a missing or
      # partial STORAGE_* config (e.g. a forgotten .env.prod) is a hard startup
      # failure instead of silently degrading photo/video uploads to 503s. Dev
      # and the E2E suite leave this unset, so their deliberate "unconfigured"
      # state stays a non-fatal warning.
      STORAGE_REQUIRED: "1"
      SUPERADMIN_CONFIG: /app/config/superadmins.yaml
      TEMPLATE_CONFIG: /app/config/templates.yaml
      # B-146 (toast-ingest-resurrection): the Toast SFTP key ships as an
      # operator-placed, git-ignored file (`id_rsa`) sitting BESIDE this compose
      # file in the prod clone — the SAME pattern .env.prod uses to survive
      # `git reset --hard origin/main`. It is bind-mounted read-only to the path
      # below (see `volumes:`). Pinning the absolute in-container path here (not
      # relying on a .env.prod line) means a forgotten/renamed key is a LOUD
      # startup failure via config.go's os.Stat guard + the fail-loud health
      # field, not a silent dead sync. The image does NOT COPY the key; the
      # mount is the only delivery.
      TOAST_SFTP_KEY_PATH: /app/id_rsa
      # Enable the in-process daily sync worker (resurrection). "0" disables it;
      # "12h" is the documented default (LoadConfigFromEnv). Pinned here so the
      # worker's enabled/disabled state is explicit in the deploy artifact rather
      # than implied by an absent env line.
      TOAST_SYNC_INTERVAL: "12h"
    env_file:
      - path: .env.prod
        required: false
    volumes:
      # Toast SFTP private key — operator places `id_rsa` next to this compose
      # file (git-ignored via .gitignore:id_rsa), chmod 600, owned by the
      # deploying user. Read-only in the container. If this file is absent the
      # container fails fast on boot (TOAST_SFTP_KEY_PATH set → os.Stat fails),
      # which is now the intended loud behavior. See the attended-steps note in
      # .night-crew/knowledge/reference/toast-archive-gap-20260901.md.
      - ./id_rsa:/app/id_rsa:ro
    networks:
      - yumyums

networks:
  yumyums:
    name: yumyums_default
    external: true
